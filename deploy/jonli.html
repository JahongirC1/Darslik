<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jonli test</title>
<meta name="theme-color" content="#eef1fc">
<link rel="apple-touch-icon" href="ikon-ios.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Jonli test — talaba sahifasi. Asosiy ko'rinish: oyin.css (.oy …).
   :root dagi ranglar — mavzu.js va umumiy.css uchun (🎨 oynasi). */
:root{
  --ink:#1a2238; --ink-soft:#4a5578; --paper:#eef1fc; --card:#fff; --line:#dde2f6;
  --kart:#fff; --kart2:#f3f5fe; --head-bg:rgba(238,241,252,.94);
  --t:#1f5f99; --t-grad:linear-gradient(135deg,#2f80c3,#1f5f99); --t-tile:#e3eef8; --t-matn:#1f5f99; --t-soya:rgba(31,95,153,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#eef1fc}
html[data-tun="1"]{background:#11142b}
body{min-height:100vh;min-height:100dvh;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 0}
header.oy-tepa{margin-bottom:18px}
.ekran{display:none}.ekran.faol{display:block;animation:paydo .25s}
@keyframes paydo{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:28px;margin-bottom:4px}
.izoh{text-align:center;font-size:15px;margin-top:14px}
.xato{color:var(--o-qizil);font-weight:800;font-size:15px;min-height:20px;margin-top:12px;text-align:center}
.markaz{text-align:center}
.markaz h2{margin-top:6px}
.markaz p{font-size:16px;line-height:1.5}
.holat{margin:0 4px 10px}
.prompt{text-align:center;margin:16px 0 18px}
.prompt small{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
.prompt div{font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;line-height:1.2;word-break:break-word;margin-top:6px}
.prompt div.ar{font-family:'Amiri',serif;font-size:56px;line-height:1.75;padding-top:.12em}
.tanlov{margin-top:16px}
.tanlov h3{font-size:19px;margin:16px 0 10px;text-align:left}
.hayvonlar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.boshlar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hb{aspect-ratio:1;border:2px solid var(--o-chiz);background:var(--o-kart2);border-radius:16px;font-size:30px;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 3px 0 var(--o-soya);-webkit-tap-highlight-color:transparent;font-family:'Fredoka',sans-serif;color:var(--o-soft)}
.hb.on{border-color:var(--o-ink);background:var(--o-sariq);box-shadow:0 3px 0 var(--o-sariq2)}
.hb small{font-size:13px;font-weight:600}
.statlar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.statlar div{background:var(--o-kart2);border:2px solid var(--o-chiz);border-radius:18px;padding:10px 6px;text-align:center}
.statlar b{display:block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px}
.statlar span{font-size:13px;font-weight:800;color:var(--o-soft)}
.plus{display:inline-block;background:var(--o-yashil);color:#fff;border-radius:16px;padding:6px 18px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;margin-top:8px}
.nat-sar{font-size:34px}
.nat-sar.ha{color:var(--o-yashil)}.nat-sar.yoq{color:var(--o-qizil)}
.men-kart{background:var(--o-sariq);color:#1c1f4a;border-radius:22px;box-shadow:0 6px 0 var(--o-sariq2);padding:14px 18px;display:flex;align-items:center;gap:14px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;margin-bottom:16px}
.men-kart .oy-av{font-size:44px}
.ovoz-btn{width:46px;height:46px;padding:0;font-size:21px}
/* rejimlar */
.jam-b{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:12px 14px;color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;margin:12px 0 6px}
.jam-teg{display:inline-flex;align-items:center;gap:6px;border-radius:13px;padding:4px 12px;color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px}
.teglar{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px}
.teg{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:4px 11px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;background:var(--o-kart);border:2px solid var(--o-chiz)}
.teg.ol{background:#ff6b2c;border-color:#ff6b2c;color:#fff}.teg.qiz{background:var(--o-qizil);border-color:var(--o-qizil);color:#fff}
.hisob{display:flex;align-items:center;gap:6px;background:var(--o-kart);border:2px solid var(--o-chiz);border-radius:18px;padding:7px 10px;margin-bottom:10px;font-family:'Fredoka',sans-serif;font-weight:700}
.hisob .jam-teg{font-size:14px;padding:3px 9px}.hisob b{font-size:19px}.hisob .o{flex:1;text-align:center;font-size:13px;color:var(--o-soft);font-weight:600}
.juft{border:2.5px dashed var(--o-chiz);border-radius:24px;background:var(--o-kart2);padding:14px;text-align:center;margin:-4px 0 18px}
.juft .ar{font-family:'Amiri',serif;font-size:48px;line-height:1.5}.juft .uz{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px}
.tn-btn{min-height:104px !important;justify-content:center;font-size:30px !important}
.yoz-inp{font-size:24px !important}
.xavf-k{background:var(--o-kart2);border:2px dashed #ff9a62;border-radius:20px;padding:14px;margin-top:16px;text-align:center}
.xavf-k h3{font-size:19px;margin-bottom:4px}.xavf-k p{font-size:13.5px;margin-bottom:10px}
.xavf-k .q{display:flex;gap:8px}.xavf-k .q .oy-btn{flex:1;font-size:16px;padding:12px}
.oy-btn.olov{background:#ff6b2c;color:#fff;box-shadow:0 6px 0 #c94a15}
.xavf-k.on{border-style:solid;border-color:#ff6b2c;background:#fff1ea}
html[data-tun="1"] .xavf-k.on{background:#3a2216}
.jbar{display:flex;align-items:center;gap:8px;margin-top:7px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px}
.jbar .n{width:76px;text-align:left}.jbar .c{flex:1;height:14px;border-radius:8px;background:var(--o-kart2);overflow:hidden}.jbar .c i{display:block;height:100%;border-radius:8px}
.jbar .b{width:44px;text-align:right}
.minus{display:inline-block;background:var(--o-qizil);color:#fff;border-radius:16px;padding:6px 18px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;margin-top:8px}
.duel-q{display:flex;gap:10px;margin-top:14px}
.duel-q>div{flex:1;border-radius:18px;padding:12px 6px;background:var(--o-kart2);border:2px solid var(--o-chiz);text-align:center;font-family:'Fredoka',sans-serif}
.duel-q>div.g{background:var(--o-sariq);border-color:var(--o-sariq2);box-shadow:0 5px 0 var(--o-sariq2)}
.duel-q b{display:block;font-size:28px;font-weight:700}.duel-q .oy-av{font-size:40px}
.uyga-k{display:grid;gap:8px;margin:16px 0;text-align:left}
.uyga-k div{display:flex;gap:10px;align-items:center;background:var(--o-kart2);border:2px solid var(--o-chiz);border-radius:14px;padding:9px 12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15.5px}
.xato-k{margin-top:16px;text-align:left}.xato-k h3{font-size:19px;margin-bottom:8px}
.xq{border-top:1.5px solid var(--o-chiz);padding:10px 0}.xq:first-of-type{border-top:none}
.xq-p small{display:block;font-family:'Fredoka',sans-serif;font-size:12.5px;color:var(--o-soft);font-weight:600}
.xq-p{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px}.xq-p .ar,.xq-j .ar{font-family:'Amiri',serif;font-size:1.35em;line-height:1.6}
.xq-j{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px}
.xq-j .yoq{color:var(--o-qizil)}.xq-j .ha{color:var(--o-yashil)}
</style>
<style>
/* ============================================================
   Umumiy uslub — lug'at va fe'l trenajyori ikkalasi ishlatadi
   (rangli kartalar, mashq turlari, pastdan chiqadigan oyna).
   Ranglar src/mavzu.js dagi o'zgaruvchilardan: --t, --t-grad,
   --t-tile, --t-matn, --t-soya. build.py <style> ga aylantiradi.
   ============================================================ */

.q-hero{background:var(--t-grad);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 8px 22px var(--t-soya)}
.q-hero .raq{font-size:12px;font-weight:800;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.q-hero h2{font-size:23px;font-weight:800;margin:3px 0 2px;letter-spacing:-.01em}
.q-hero p{font-size:13px;opacity:.88}
.q-hero .pb{height:6px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}
.q-hero .pb i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .4s}
.mt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 15px 17px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:transform .1s;position:relative}
.mt-card:active{transform:scale(.97)}
.mt-card .ik{width:46px;height:46px;border-radius:14px;background:var(--t-tile);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.mt-card .ik.ar{font-family:'Amiri',serif;font-size:25px;color:var(--t-matn);line-height:1}
.mt-card b{display:block;font-size:15.5px;font-weight:800;line-height:1.25}
.mt-card span.iz{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.35}
.mt-card:disabled{opacity:.45;cursor:default}
.mt-card .yangi{display:inline-block;white-space:nowrap;font-size:9.5px;font-weight:800;color:var(--t-matn);background:var(--t-tile);border-radius:20px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.mt-card .badge{top:10px;right:10px}
.mt-hero{display:flex;align-items:center;gap:14px;width:100%;border:none;background:var(--t-grad);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 8px 22px var(--t-soya);cursor:pointer;font-family:inherit;text-align:left}
.mt-hero:active{transform:scale(.985)}
.mt-hero .ik{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.mt-hero b{display:block;font-size:17px;font-weight:800}
.mt-hero span.iz{font-size:13px;opacity:.88}
.mt-top{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:4px;font-family:inherit;color:var(--ink);text-align:left;cursor:pointer}
.mt-top .ik{width:44px;height:44px;border-radius:13px;background:var(--t-tile);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.mt-top b{display:block;font-size:14px;font-weight:800}
.mt-top span.iz{font-size:12.5px;color:var(--ink-soft)}
.mt-top .ozg{margin-left:auto;flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--t-matn);white-space:nowrap}
.mt-h{font-size:17px;font-weight:800;margin:20px 2px 12px;letter-spacing:-.01em}
.mt-rek{text-align:center;font-size:13.5px;color:var(--ink-soft);margin:16px 0 4px}
.mt-rek b{color:var(--ink)}
/* pastdan chiqadigan sozlash oynasi */
.mt-fon{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:mtFade .2s}
@keyframes mtFade{from{opacity:0}to{opacity:1}}
.mt-sheet{animation:mtYuqori .25s ease}
@keyframes mtYuqori{from{transform:translateY(40px)}to{transform:none}}
.mt-sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--kart);border-radius:24px 24px 0 0;padding:10px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.mt-sheet .tut{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.mt-sheet .bosh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mt-sheet .bosh .ik{width:46px;height:46px;border-radius:14px;background:var(--t-tile);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.mt-sheet .bosh .ik.ar{font-family:'Amiri',serif;font-size:25px;color:var(--t-matn)}
.mt-sheet h3{font-size:18px;font-weight:800}
.mt-sheet p{font-size:12.5px;color:var(--ink-soft)}
.mt-go{width:100%;padding:15px;border:none;border-radius:15px;background:var(--t-grad);color:#fff;font-family:inherit;font-size:15.5px;font-weight:800;margin-top:4px;cursor:pointer}
.mt-go:disabled{opacity:.5}
/* Moslash */
.ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ms-col{display:grid;gap:10px;align-content:start}
.ms-b{background:var(--card);border:1.5px solid var(--line);border-radius:15px;min-height:64px;display:grid;place-items:center;padding:8px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;transition:.15s;line-height:1.3}
.ms-b.ar{font-family:'Amiri',serif;font-size:23px;font-weight:400;line-height:1.6}
.ms-b.on{border-color:var(--t-matn);background:var(--t-tile)}
.ms-b.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);pointer-events:none;box-shadow:none}
.ms-b.no{border-color:var(--red);background:var(--red-soft);animation:silkin .3s}
@keyframes silkin{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ms-iz{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:14px}
/* Xotira o'yini */
.xo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.xo-k{aspect-ratio:1/1.05;border-radius:15px;border:none;padding:0;background:transparent;perspective:600px;cursor:pointer;font-family:inherit}
.xo-i{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.xo-k.och .xo-i,.xo-k.top .xo-i{transform:rotateY(180deg)}
.xo-y{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;display:grid;place-items:center;padding:6px;text-align:center}
.xo-y.old{background:var(--t-grad);color:rgba(255,255,255,.7);font-size:24px;box-shadow:0 4px 12px var(--t-soya)}
.xo-y.orqa{transform:rotateY(180deg);background:var(--kart);border:1.5px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:700;line-height:1.25;overflow:hidden}
.xo-y.orqa.ar{font-family:'Amiri',serif;font-size:21px;font-weight:400;line-height:1.5}
.xo-k.top .xo-y.orqa{border-color:var(--green);background:var(--green-soft)}
/* To'g'ri / Noto'g'ri */
.tf-juft{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf-juft .choice{font-weight:800}
.tf-juft .ha{color:var(--green)}.tf-juft .yoq{color:var(--red)}
.q-prompt .q-sub{font-size:19px;font-weight:700;color:var(--ink-soft);margin-top:10px}
.q-prompt .q-sub.ar{font-size:30px;font-weight:400}
.eshit{width:88px;height:88px;border-radius:50%;border:none;background:var(--t-grad);color:#fff;font-size:36px;cursor:pointer;box-shadow:0 8px 22px var(--t-soya)}
.eshit:active{transform:scale(.95)}
.tz-vaqt{font-size:15px !important;color:var(--t-matn) !important;font-weight:800 !important}
.qism-card .q-pr{height:4px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.qism-card .q-pr i{display:block;height:100%;background:var(--t);border-radius:3px}


</style>
<style>
/* ============================================================
   Jonli test — ko'rinish (ustoz ekrani va talaba sahifasi)
   Nuqtali och binafsha fon, yumaloq Fredoka shrifti, «qalin»
   kartalar va tugmalar (pastida soya — bosiladigan ko'rinadi).
   Hammasi .oy ichida — kabinetning qolgan qismiga tegmaydi.
   Tungi rejim: html[data-tun="1"] (mavzu.js).
   ============================================================ */
.oy{
  --o-bg:#eef1fc; --o-nuqta:#cfd5ef; --o-ink:#1c1f4a; --o-soft:#5d6394; --o-kart:#fff; --o-kart2:#f3f5fe;
  --o-chiz:#dde2f6; --o-soya:#d3d8ef; --o-sariq:#f6c64f; --o-sariq2:#d4a23a; --o-yashil:#16a070; --o-yashil2:#4a9d74;
  --o-qizil:#e8384f;
  font-family:'Nunito','Manrope',system-ui,sans-serif; color:var(--o-ink);
}
html[data-tun="1"] .oy{
  --o-bg:#11142b; --o-nuqta:#272c55; --o-ink:#eef0ff; --o-soft:#a6acd8; --o-kart:#1b1f3f; --o-kart2:#22274b;
  --o-chiz:#2e3466; --o-soya:#0a0c1f; --o-sariq2:#b8882a;
}
.oy-fon{background-color:var(--o-bg);background-image:radial-gradient(var(--o-nuqta) 1.3px,transparent 1.5px);background-size:25px 25px}
.oy h1,.oy h2,.oy h3,.oy .oy-f{font-family:'Fredoka','Manrope',system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
.oy .ar{font-family:'Amiri',serif;direction:rtl;font-weight:700}

/* kartalar va tugmalar */
.oy-kart{background:var(--o-kart);border:2px solid var(--o-chiz);border-radius:28px;box-shadow:0 6px 0 var(--o-soya);padding:24px 22px}
.oy-btn{font-family:'Fredoka','Manrope',sans-serif;font-weight:600;font-size:19px;border:none;border-radius:20px;padding:16px 24px;
  background:var(--o-sariq);color:#1c1f4a;box-shadow:0 6px 0 var(--o-sariq2);cursor:pointer;transition:transform .08s,box-shadow .08s;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.oy-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--o-sariq2)}
.oy-btn:disabled{opacity:.5;cursor:default}
.oy-btn.oq{background:var(--o-kart);color:var(--o-ink);border:2px solid var(--o-chiz);box-shadow:0 5px 0 var(--o-soya)}
.oy-btn.oq:active{box-shadow:0 1px 0 var(--o-soya)}
.oy-btn.kichik{font-size:15px;padding:10px 16px;border-radius:15px}
.oy-btn.toliq{width:100%}

/* sarlavha: sariq «logo» kvadrati */
.oy-tepa{display:flex;align-items:center;gap:14px}
.oy-logo{width:54px;height:54px;border-radius:17px;background:var(--o-sariq);box-shadow:0 5px 0 var(--o-sariq2);transform:rotate(-5deg);
  display:grid;place-items:center;font-family:'Amiri',serif;font-weight:700;font-size:30px;color:#1c1f4a;flex-shrink:0;line-height:1}
.oy-nom{flex:1;min-width:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oy-nom small{display:block;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:700;color:var(--o-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis}

/* maydonlar */
.oy-label{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;margin:16px 0 8px}
.oy-input{width:100%;border:2px solid var(--o-chiz);background:var(--o-kart2);border-radius:18px;padding:16px 18px;font-family:'Fredoka',sans-serif;
  font-weight:500;font-size:21px;color:var(--o-ink);outline:none;box-sizing:border-box}
.oy-input:focus{border-color:var(--o-ink);border-width:2.5px}
.oy-input::placeholder{color:#a7acc9;font-weight:500}
.oy-pin-input{text-align:center;font-size:34px;font-weight:600;letter-spacing:.22em}

/* PIN */
.oy-pin{display:inline-block;background:var(--o-sariq);box-shadow:0 7px 0 var(--o-sariq2);border-radius:26px;padding:8px 36px;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(58px,10vw,104px);letter-spacing:.04em;color:#1c1f4a;line-height:1.15;
  font-variant-numeric:tabular-nums}

/* javob tugmalari */
.oy-javob{position:relative;display:flex;align-items:center;gap:18px;width:100%;border:none;border-radius:22px;padding:20px 22px;min-height:84px;overflow-wrap:break-word;
  color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,2.6vw,28px);text-align:left;line-height:1.2;
  box-shadow:0 6px 0 rgba(28,31,74,.22);cursor:pointer;transition:transform .08s,opacity .2s;-webkit-tap-highlight-color:transparent}
.oy-javob:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(28,31,74,.22)}
.oy-javob .ar{font-size:1.35em;line-height:1.35;flex:1;text-align:right}
.oy-shakl{width:32px;height:32px;flex-shrink:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.oy-javob.xira{opacity:.33}
.oy-javob.togri{box-shadow:0 0 0 4px var(--o-kart),0 0 0 9px var(--o-yashil2)}

.oy-javob .son{position:absolute;right:14px;bottom:12px;background:rgba(0,0,0,.14);border-radius:20px;padding:1px 13px;font-size:17px;min-width:44px;text-align:center}
.oy-javob.togri .son{background:rgba(0,0,0,.38)}
.oy-javoblar{display:grid;gap:14px}

/* turli */
.oy-soft{color:var(--o-soft);font-weight:700}
.oy-qator{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;color:var(--o-soft)}
.oy-qator b{color:var(--o-ink);font-weight:600}
.oy-chiziq{height:13px;border-radius:10px;background:var(--o-kart);border:2px solid var(--o-chiz);overflow:hidden}
.oy-chiziq i{display:block;height:100%;background:var(--o-yashil);border-radius:8px;transition:width .2s linear}
.oy-nuqtalar{display:flex;gap:9px;justify-content:center;margin-top:16px}
.oy-nuqtalar i{width:13px;height:13px;border-radius:50%;background:var(--o-soft);animation:oyNuqta 1.2s infinite}
.oy-nuqtalar i:nth-child(2){animation-delay:.2s}.oy-nuqtalar i:nth-child(3){animation-delay:.4s}
@keyframes oyNuqta{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.oy-emoji{font-size:84px;line-height:1.1;text-align:center;animation:oySakra .6s ease}
@keyframes oySakra{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.oy-doira{width:120px;height:120px;border-radius:50%;background:var(--o-sariq);box-shadow:0 7px 0 var(--o-sariq2);display:grid;place-items:center;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:64px;color:#1c1f4a;margin:18px auto}
.oy-sekund{width:64px;height:64px;border-radius:50%;background:var(--o-ink);color:var(--o-kart);display:grid;place-items:center;flex-shrink:0;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px}
.oy-sekund.oz{background:var(--o-qizil);color:#fff;animation:oyUr .5s ease infinite alternate}
@keyframes oyUr{to{transform:scale(1.1)}}

/* so'z kartasi (natijada) */
.oy-soz{border:2.5px dashed var(--o-chiz);border-radius:24px;padding:20px;text-align:center;background:var(--o-kart2)}
.oy-soz .ar{font-size:clamp(40px,6vw,64px);display:inline-block;vertical-align:middle}
.oy-soz .uz{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;margin-top:4px}
.oy-karnay{width:54px;height:54px;border-radius:16px;border:2px solid var(--o-chiz);background:var(--o-kart);box-shadow:0 4px 0 var(--o-soya);
  font-size:24px;cursor:pointer;vertical-align:middle;margin-left:12px}

/* avatar: hayvoncha + bosh kiyim */
.oy-av{position:relative;display:inline-grid;place-items:center;width:1.35em;height:1.35em;font-size:30px;line-height:1;flex-shrink:0}
.oy-av-h{font-size:1em}
.oy-av-b{position:absolute;left:50%;top:-.38em;transform:translateX(-50%) rotate(-10deg);font-size:.62em}
.oy-av-b.koz{top:.16em;font-size:.56em;transform:translateX(-50%)}
.oy-av-b.quloq{top:-.18em;font-size:.95em;transform:translateX(-50%);opacity:.95}
.oy-av.katta{font-size:84px}
.oy-av.ort{font-size:40px}

/* qatnashchi «chip»lari */
.oy-chiplar{display:flex;flex-wrap:wrap;gap:10px}
.oy-chip{display:inline-flex;align-items:center;gap:8px;background:var(--o-kart2);border:2px solid var(--o-chiz);border-radius:30px;padding:6px 16px 6px 8px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;animation:oyChip .35s ease both}
.oy-chip .oy-av{font-size:26px}
@keyframes oyChip{from{opacity:0;transform:scale(.5)}70%{transform:scale(1.08)}to{opacity:1;transform:scale(1)}}

/* reyting qatori */
.oy-rq{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:2px solid var(--o-chiz);font-family:'Fredoka',sans-serif;font-weight:500;font-size:19px}
.oy-rq:first-of-type{border-top:none}
.oy-rq .o{width:34px;text-align:center;font-weight:700}
.oy-rq .i{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oy-rq .b{font-weight:700}
.oy-rq .t{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--o-soft)}
.oy-rq.men{background:var(--o-kart2);border-radius:14px}

/* podium */
.oy-podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:26px 0 22px;min-height:330px}
.oy-p{width:min(31%,230px);display:flex;flex-direction:column;align-items:center;animation:oyKotar .8s cubic-bezier(.2,.9,.3,1.2) both}
.oy-p .oy-av{font-size:clamp(46px,7vw,70px);animation:oySakra .6s ease both;animation-delay:inherit}
.oy-p-ism{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(16px,2.2vw,23px);text-align:center;word-break:break-word;line-height:1.15;margin-top:6px}
.oy-p-ball{font-size:14px;font-weight:800;color:var(--o-soft);margin:2px 0 10px}
.oy-foiz{color:var(--o-ink);font-weight:800}
.oy-p-ust{width:100%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:14px;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:54px;color:#1c1f4a;line-height:1}
.oy-p-ust small{font-size:32px}
.oy-p1 .oy-p-ust{height:190px;background:var(--o-sariq);box-shadow:inset 0 -10px 0 var(--o-sariq2)}.oy-p1{animation-delay:1.6s}
.oy-p2 .oy-p-ust{height:140px;background:#c8cfe6;box-shadow:inset 0 -10px 0 #a7b0cf}.oy-p2{animation-delay:.9s}
.oy-p3 .oy-p-ust{height:100px;background:#eab48a;box-shadow:inset 0 -10px 0 #cf9468}.oy-p3{animation-delay:.2s}
.oy-p.bo{visibility:hidden}
@keyframes oyKotar{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
/* konfetti */
.oy-konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.oy-konfetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:oyTush linear forwards}
@keyframes oyTush{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:640px){
  .oy-kart{padding:20px 16px;border-radius:24px}
  .oy-logo{width:46px;height:46px;font-size:26px;border-radius:15px}
  .oy-nom{font-size:21px}
  .oy-tepa{gap:10px}
  .oy-javob{min-height:72px;padding:16px 18px;gap:14px}
  .oy-podium{min-height:270px;gap:8px}
  .oy-p1 .oy-p-ust{height:150px}.oy-p2 .oy-p-ust{height:110px}.oy-p3 .oy-p-ust{height:80px}
  .oy-p-ust{font-size:40px}
}

#pauzaQ{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(28,31,74,.82);color:#fff;text-align:center;font-family:'Fredoka',sans-serif}

.xj-o{display:flex;align-items:center;gap:6px;padding:5px 4px;border-radius:10px;font-weight:600;font-size:14px;min-width:0}

#pauzaQ h2{font-size:34px;margin:4px 0 8px;color:#fff}#pauzaQ p{font-size:17px;opacity:.9;line-height:1.45}#pauzaQ .oy-emoji{font-size:64px}
.xona-p{margin-top:14px;text-align:left}
.xp-pin{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--o-sariq);box-shadow:0 6px 0 var(--o-sariq2);border-radius:20px;padding:10px 14px;color:#1c1f4a;font-family:'Fredoka',sans-serif}
.xp-pin small{font-size:15px;font-weight:600}.xp-pin b{font-size:44px;font-weight:700;letter-spacing:.04em;line-height:1.1}.xp-pin span{width:100%;text-align:center;font-size:13px;font-weight:600;opacity:.75}
.xp-t{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.xp-t .oy-btn{flex:1;min-width:150px}
.xona-p .oy-chip{cursor:pointer}.xona-p .oy-chip.men{cursor:default;outline:2px solid var(--o-sariq)}
.xona-p .oy-btn:disabled{opacity:.55}
.xq-k{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.xq-k span{background:#fde3e6;color:#8f1d2c;border-radius:10px;padding:3px 9px;font-size:13.5px;font-weight:600}
.xq-k span.bosh{background:var(--o-kart2);color:var(--o-soft)}.xq-k b{margin-right:3px}.xq-k .ar{font-family:'Amiri',serif;font-size:1.2em}
</style>
<script>
/* ============================================================
   Ko'rinish — sayt rangi va tungi rejim

   Foydalanuvchi tepadagi 🎨 tugmasidan rangni o'zi tanlaydi; tanlov
   shu telefonda eslab qolinadi va lug'at hamda fe'l trenajyorida bir
   xil ishlaydi (ikkalasi bitta saytda — localStorage umumiy).

   Bu fayl <head> ichida yuklanadi: rang sahifa chizilishidan OLDIN
   qo'yilishi kerak, aks holda har ochilganda bir lahza standart rang
   ko'rinib, keyin almashadi.

   Birinchi kirgandagi rang brend faylidan keladi (standartRang) —
   build.py 'moviy' o'rniga qo'yadi.

   Sahifalar CSS da shu o'zgaruvchilarni ishlatadi:
     --t       asosiy rang (tugmalar, faol holat)
     --t-grad  katta kartalar uchun gradient
     --t-tile  belgi (ikonka) orqasidagi och fon
     --t-matn  asosiy rangdagi yozuv (tungi rejimda ochroq)
     --t-soya  rangli kartaning soyasi
   ============================================================ */
(function () {
  var MAVZULAR = [
    // k, nom, kunduzgi rang, gradient, och fon, tungi rang, tungi gradient, tungi yozuv
    ['kok',      'To‘q ko‘k', '#1a2238', ['#2a3558', '#1a2238'], '#eceef6', '#3b4a7a', ['#4a5a8f', '#2f3c66'], '#a9b8ea'],
    ['zumrad',   'Zumrad',    '#0b7a5c', ['#12a57c', '#0b7a5c'], '#e0f3ec', '#0f9a72', ['#14b083', '#0b7a5c'], '#5fd6ab'],
    ['yashil',   'Yashil',    '#2b5d50', ['#356d5f', '#264f45'], '#e4efeb', '#3a7a69', ['#43887a', '#2f6457'], '#93cfbc'],
    ['moviy',    'Moviy',     '#1f5f99', ['#2f80c3', '#1f5f99'], '#e3eef8', '#2f7fc0', ['#3b8fd4', '#2368a6'], '#8cc2f0'],
    ['binafsha', 'Binafsha',  '#4b3a8c', ['#6a55b8', '#4b3a8c'], '#ece8f7', '#6a55b8', ['#7a66c8', '#5644a0'], '#bdb0f2'],
    ['bordo',    'Bordo',     '#7a2e3a', ['#9a3b4a', '#73283a'], '#f6e6e9', '#a8475a', ['#b8566a', '#8a3446'], '#f2a8b5']
  ];
  var STANDART = 'moviy';
  var KEY = 'au_korinish_v1';

  function topMavzu(k) {
    for (var i = 0; i < MAVZULAR.length; i++) if (MAVZULAR[i][0] === k) return MAVZULAR[i];
    return null;
  }
  function oqi() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function yoz(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function hozirgi() {
    var s = oqi();
    return { rang: topMavzu(s.rang) ? s.rang : (topMavzu(STANDART) ? STANDART : 'moviy'), tun: !!s.tun };
  }

  function qoy() {
    var de = document.documentElement;
    if (!de || !de.style) return;
    var h = hozirgi(), m = topMavzu(h.rang), tun = h.tun;
    var t = tun ? m[5] : m[2], g = tun ? m[6] : m[3];
    var v = {
      '--t': t,
      '--t-grad': 'linear-gradient(135deg,' + g[0] + ',' + g[1] + ')',
      '--t-tile': tun ? rgba(m[5], .24) : m[4],
      '--t-matn': tun ? m[7] : m[2],
      '--t-soya': rgba(t, tun ? .35 : .25),
      '--nur2': rgba(g[0], tun ? .20 : .15)
    };
    for (var k in v) de.style.setProperty(k, v[k]);
    de.setAttribute('data-rang', h.rang);
    if (tun) de.setAttribute('data-tun', '1'); else de.removeAttribute('data-tun');
    var meta = document.querySelector && document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', tun ? '#0e1320' : t);
    // Android ilovada status va pastki panel rangi ham mos bo'lsin
    try { if (window.AUIlova && AUIlova.rang) AUIlova.rang(tun ? '#0e1320' : '#faf9f6', tun); } catch (e) {}
  }

  /* Tungi rejim: asosiy ranglar shu yerda bir marta — ikkala sahifa
     ham shu o'zgaruvchilarni ishlatadi. html[data-tun] :root dan
     kuchliroq, shuning uchun brend ranglari ustidan ham yoziladi.     */
  var CSS =
    'html[data-tun="1"]{color-scheme:dark;--ink:#e6e9f2;--ink-soft:#a3abc3;--paper:#0e1320;' +
    '--card:rgba(27,34,53,.92);--kart:#1a2133;--kart2:#232b42;--line:#2e3752;' +
    '--head-bg:rgba(14,19,32,.9);--nav-bg:rgba(18,24,39,.96);--fon1:rgba(14,19,32,.90);--fon2:rgba(14,19,32,.95);' +
    '--shadow:0 1px 3px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);' +
    '--green:#4cc28c;--green-soft:rgba(76,194,140,.16);--red:#f07c66;--red-soft:rgba(240,124,102,.16);' +
    '--blue:#82b6ea;--blue-soft:rgba(130,182,234,.16);' +
    '--amber-soft:color-mix(in srgb,var(--amber) 22%,transparent);' +
    '--nur1:rgba(0,0,0,0);--nur1k:rgba(0,0,0,0)}' +
    'html[data-tun="1"] img.logo{background:#fff}' +
    '.rang-btn{margin-left:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);' +
    'background:var(--kart,#fff);display:grid;place-items:center;font-size:18px;flex-shrink:0;cursor:pointer;padding:0}' +
    '.rang-btn+.rang-btn{margin-left:8px}' +
    '.yangila-btn{font-size:21px;font-weight:700;color:var(--t-matn,#1f5f99);position:relative}' +
    '.yangila-btn.aylan{animation:auAylan .8s linear infinite}' +
    '@keyframes auAylan{to{transform:rotate(360deg)}}' +
    '.yangila-btn.yangi::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;' +
    'background:var(--red,#b5442f);box-shadow:0 0 0 2px var(--kart,#fff)}' +
    '#auKorinish{position:fixed;inset:0;z-index:9996;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;' +
    'justify-content:center;font-family:Manrope,system-ui,sans-serif;animation:auKf .2s}' +
    '@keyframes auKf{from{opacity:0}to{opacity:1}}' +
    '#auKorinish .sh{width:100%;max-width:520px;background:var(--kart,#fff);color:var(--ink,#1a2238);' +
    'border-radius:24px 24px 0 0;padding:10px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}' +
    '#auKorinish .tut{width:40px;height:5px;border-radius:3px;background:var(--line,#ddd);margin:0 auto 14px}' +
    '#auKorinish .bosh{display:flex;align-items:center;gap:12px;margin-bottom:14px}' +
    '#auKorinish .ik{width:46px;height:46px;border-radius:14px;background:var(--t-tile);display:grid;place-items:center;font-size:22px}' +
    '#auKorinish h3{font-size:18px;font-weight:800;margin:0}' +
    '#auKorinish p{font-size:12.5px;color:var(--ink-soft,#4a5578);margin:0}' +
    '#auKorinish .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}' +
    '#auKorinish .rg{border:2px solid var(--line,#e7e4dd);border-radius:18px;padding:12px 6px 10px;text-align:center;' +
    'background:var(--kart,#fff);font-family:inherit;cursor:pointer;color:var(--ink,#1a2238)}' +
    '#auKorinish .rg.on{border-color:var(--t-matn)}' +
    '#auKorinish .doira{width:44px;height:44px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;' +
    'color:#fff;font-size:19px;font-weight:800;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}' +
    '#auKorinish .rg b{font-size:12.5px;font-weight:800}' +
    '#auKorinish .tun{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line,#e7e4dd);' +
    'border-radius:18px;padding:12px 14px;background:var(--kart,#fff);font-family:inherit;cursor:pointer;' +
    'color:var(--ink,#1a2238);text-align:left;margin-bottom:14px}' +
    '#auKorinish .tun .ti{font-size:22px}#auKorinish .tun b{display:block;font-size:14px;font-weight:800}' +
    '#auKorinish .tun small{font-size:12px;color:var(--ink-soft,#4a5578)}' +
    '#auKorinish .sw{margin-left:auto;width:46px;height:28px;border-radius:14px;background:var(--line,#ddd);position:relative;flex-shrink:0;transition:.2s}' +
    '#auKorinish .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}' +
    '#auKorinish .tun.on .sw{background:var(--t)}#auKorinish .tun.on .sw i{left:21px}' +
    '#auKorinish .ok{width:100%;padding:15px;border:none;border-radius:15px;background:var(--t-grad);color:#fff;' +
    'font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer}';

  function cssQosh() {
    if (!document.head || document.getElementById('auKorinishCss')) return;
    var st = document.createElement('style'); st.id = 'auKorinishCss'; st.textContent = CSS;
    document.head.appendChild(st);
  }

  // rang tanlash oynasi
  function oyna(qayta) {
    var eski = document.getElementById('auKorinish');
    if (eski) eski.remove();
    var h = hozirgi();
    var o = document.createElement('div'); o.id = 'auKorinish';
    if (qayta) o.style.animation = 'none';
    o.innerHTML = '<div class="sh" role="dialog" aria-modal="true" aria-label="Ko‘rinish"><div class="tut"></div>' +
      '<div class="bosh"><div class="ik">🎨</div><div><h3>Ko‘rinish</h3><p>Sayt rangini o‘zingiz tanlang</p></div></div>' +
      '<div class="gr">' + MAVZULAR.map(function (m) {
        var on = m[0] === h.rang;
        return '<button class="rg' + (on ? ' on' : '') + '" data-rang="' + m[0] + '">' +
          '<div class="doira" style="background:linear-gradient(135deg,' + m[3][0] + ',' + m[3][1] + ')">' + (on ? '✓' : '') + '</div>' +
          '<b>' + m[1] + '</b></button>';
      }).join('') + '</div>' +
      '<button class="tun' + (h.tun ? ' on' : '') + '" data-tun="1"><span class="ti">🌙</span>' +
      '<span><b>Tungi rejim</b><small>Qorong‘i fon — kechqurun ko‘zni charchatmaydi</small></span>' +
      '<span class="sw"><i></i></span></button>' +
      '<button class="ok">Tayyor</button></div>';
    document.body.appendChild(o);
    o.addEventListener('click', function (e) {
      if (e.target === o || e.target.closest('.ok')) { o.remove(); return; }
      var r = e.target.closest('[data-rang]'), t = e.target.closest('[data-tun]');
      if (!r && !t) return;
      var s = hozirgi();
      if (r) s.rang = r.getAttribute('data-rang');
      if (t) s.tun = !s.tun;
      yoz(s); qoy(); oyna(true);  // darrov ko'rinadi
    });
  }

  try { cssQosh(); qoy(); } catch (e) {}
  window.auKorinish = function () { cssQosh(); oyna(); };
  window.auKorinishHozir = hozirgi;
  window.AU_MAVZULAR = MAVZULAR;
})();

</script>

/* ============================================================
   Jonli test — umumiy qism (ustoz.html va jonli.html ikkalasida)

     dasturlarning musiqasi ishlatilmagan — kuylar o'zimizniki.

     podium (karnay kirishi + g'olib kuyi).

const OYIN_RANG = ['#e8384f', '#3a6cf6', '#d18a00', '#12a070'];
const OYIN_SHAKL = [
  '<path d="M12 3.2 22.2 20.4H1.8z"/>',
  '<path d="M12 1.8 22.2 12 12 22.2 1.8 12z"/>',
  '<circle cx="12" cy="12" r="9.2"/>',
  '<rect x="3.2" y="3.2" width="17.6" height="17.6" rx="2.4"/>'
];
const oyinShakl = k => `<svg class="oy-shakl" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">${OYIN_SHAKL[k]}</svg>`;

/* ---------- avatar ---------- */
const OYIN_HAYVON = ['🐶', '🐱', '🦊', '🐼', '🐨', '🐯', '🦁', '🐸', '🐵', '🐰', '🐻', '🐷', '🐮', '🐔', '🐧', '🦉', '🦄', '🐙', '🐢', '🐝'];
const OYIN_BOSH = [{ e: '', n: 'Yo‘q' }, { e: '🎩' }, { e: '👑' }, { e: '🧢' }, { e: '🎓' }, { e: '🎀' }, { e: '🌸' }, { e: '⛑️' }, { e: '🕶️', k: 'koz' }, { e: '🎧', k: 'quloq' }];
function avatarKod(kod, ism) {
  const m = /^(\d{1,2})-(\d{1,2})$/.exec(String(kod || ''));
  if (m && +m[1] < OYIN_HAYVON.length && +m[2] < OYIN_BOSH.length) return [+m[1], +m[2]];
  let h = 0; for (const c of String(ism || '?')) h = (h * 31 + c.codePointAt(0)) >>> 0;     // tanlamagan bo'lsa — ismidan
  return [h % OYIN_HAYVON.length, 0];
}
function avatarHtml(kod, ism, cls) {
  const [h, b] = avatarKod(kod, ism), bk = OYIN_BOSH[b];
  return `<span class="oy-av${cls ? ' ' + cls : ''}"><span class="oy-av-h">${OYIN_HAYVON[h]}</span>${bk.e ? `<span class="oy-av-b${bk.k ? ' ' + bk.k : ''}">${bk.e}</span>` : ''}</span>`;
}

/* ---------- musiqa va ovozlar ---------- */
const OyinOvoz = (function () {
  const KEY = 'au_oyin_ovoz_v1';
  let ctx = null, bosh = null, mus = null, sfx = null, aks = null, shovqinBuf = null;
  let yoqiq = true;
  try { yoqiq = localStorage.getItem(KEY) !== '0'; } catch (e) {}
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function tayyorla() {                      // faqat foydalanuvchi bosgandan keyin (brauzer talabi)

      const AC = window.AudioContext || window.webkitAudioContext;

      bosh = ctx.createGain(); bosh.gain.value = yoqiq ? 1 : 0; bosh.connect(ctx.destination);

      sfx = ctx.createGain(); sfx.gain.value = .8; sfx.connect(siq);

      aks = ctx.createGain(); aks.gain.value = 1;

    [-7, 7].forEach(c => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = c;
      o.connect(f); o.start(t); o.stop(t + dur + .15);
    });
    f.connect(g); chiqar(g, chiq, aksga);
  }
  // chertma (arpedjio, qo'ng'iroq): uchburchak + yuqori garmonika, tez so'nadi
  function chert(m, t, vol, dur, aksga) {
    nota(m, t, dur || .22, 'triangle', vol, mus, 0, aksga === undefined ? .35 : aksga);
    nota(m + 12, t, (dur || .22) * .5, 'sine', vol * .35, mus, 0, 0);
  }
  function bas(m, t, dur, vol) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o2.type = 'sine'; o.frequency.value = hz(m); o2.frequency.value = hz(m);
    f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(220, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(mus);
    o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  function shovqin(t, dur, vol, past, chiq, tur) {      // tarelka / chapak
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = shovqinBuf; f.type = tur || 'highpass'; f.frequency.value = past || 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(chiq || mus); s.start(t, Math.random() * .4); s.stop(t + dur + .02);
  }
  function baraban(t, vol, chiq) {                        // katta baraban
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + .3);
    o.connect(g); g.connect(chiq || mus); o.start(t); o.stop(t + .32);
  }
  function qarsak(t, vol, chiq) {                         // kichik baraban / chapak
    shovqin(t, .16, vol, 1700, chiq, 'bandpass');
    nota(52, t, .08, 'triangle', vol * .6, chiq);
  }
  const tarelka = (t, vol, ochiq) => shovqin(t, ochiq ? .18 : .035, vol, 8000);

  /* ---------------- kuylar (hammasi shu yerda yozilgan, o'zimizniki) ----------------
     Har kuy 16 qadamli taktlardan iborat (1 qadam = 1/16 nota). */
  const takt = (bars) => [].concat(...bars);            // 8 ta «sakkizlik» → 16 qadam
  const sak = a => takt(a.map(x => [x, 0]));
  const KUY = {
    // kutish xonasi: quvnoq, sakrab turadigan — F – Dm – B♭ – C | B♭ – C – Am – Dm
    kutish: {
      bpm: 128,
      akkord: [[41, [65, 69, 72]], [38, [62, 65, 69]], [46, [62, 65, 70]], [36, [64, 67, 72]],
               [46, [62, 65, 70]], [36, [64, 67, 72]], [45, [64, 69, 72]], [38, [62, 65, 69]]],
      kuy: takt([
        sak([72, 0, 77, 0, 81, 79, 77, 0]), sak([74, 0, 77, 0, 81, 0, 79, 77]),
        sak([74, 0, 77, 0, 82, 81, 79, 0]), sak([79, 0, 76, 0, 72, 74, 76, 79]),
        sak([82, 0, 81, 0, 79, 0, 77, 79]), sak([81, 0, 79, 0, 76, 0, 72, 0]),
        sak([76, 77, 79, 0, 81, 0, 84, 0]), sak([81, 0, 79, 77, 0, 74, 76, 0])]),
      qadam(q, t, a) {
        const s = q % 16, bar = Math.floor(q / 16) % 8;
        if ([0, 3, 6, 8, 11, 14].includes(s)) bas(a[0] + (s === 6 || s === 14 ? 12 : 0), t, .2, .42);
        if (s % 4 === 2) a[1].forEach(m => boy(m, t, .1, .035, 2400, mus, .25));      // «skank» akkordlar
        if (s === 0 || s === 8 || (s === 14 && bar % 2)) baraban(t, .7);
        if (s === 4 || s === 12) qarsak(t, .2);
        if (s % 2 === 1) tarelka(t, .05); else if (s % 4 === 2) tarelka(t, .07, true);
        const k = this.kuy[q % 128]; if (k && q >= 32) chert(k, t, .19);          // 2 takt kirish, keyin kuy
        if (q % 128 === 124) for (let i = 0; i < 4; i++) qarsak(t + i * (60 / this.bpm / 4), .08 + i * .04);
      }
    },
    // savol: o'rtacha tezlikda, quvnoq (F – C – Dm – B♭); vaqt o'tgan sari asta boyiydi,
    // lekin shoshiltirmaydi — mayda tez urishlar yo'q
    savol: {
      bpm: 124,
      akkord: [[41, [65, 69, 72]], [36, [64, 67, 72]], [38, [62, 65, 69]], [46, [62, 65, 70]]],
      kuy: takt([sak([72, 0, 74, 0, 77, 0, 0, 0]), sak([76, 0, 74, 0, 72, 0, 0, 0]),
                 sak([74, 0, 77, 0, 81, 0, 79, 0]), sak([77, 0, 0, 0, 74, 0, 0, 0])]),
      qadam(q, t, a, j) {                                 // j: 0 → 1 (savol vaqtining qancha qismi o'tdi)
        const s = q % 16;
        if (s === 0 || s === 6 || s === 8 || s === 14) bas(a[0] + (s === 6 || s === 14 ? 12 : 0), t, .22, .34);
        if (s === 0 || s === 8) baraban(t, .55);
        if (s === 4 || s === 12) qarsak(t, .13);
        if (s % 4 === 2) tarelka(t, .05, true);
        if (s % 4 === 2) a[1].forEach(m => boy(m, t, .09, .03, 2200, mus, .2));    // sakrab turadigan akkord
        if (j > .3 && s % 2 === 0) chert(a[1][[0, 1, 2, 1][(s / 2) % 4]] + 12, t, .08, .16, .2);
        const k = this.kuy[q % 64]; if (j > .55 && k) chert(k + 12, t, .13, .35);
        if (j > .75 && s === 0) a[1].forEach(m => boy(m, t, 1.8, .022, 1800, mus, .25, .3));
      }
    },
    // podium: g'olib kuyi (karnay kirishidan keyin) — C – G – Am – F, yengil va tantanali
    podium: {
      bpm: 112,
      akkord: [[36, [64, 67, 72]], [43, [62, 67, 71]], [45, [64, 69, 72]], [41, [65, 69, 72]]],
      kuy: takt([sak([79, 0, 0, 76, 79, 0, 84, 0]), sak([83, 0, 81, 0, 79, 0, 0, 0]), sak([76, 0, 79, 0, 84, 0, 83, 81]), sak([81, 0, 0, 0, 77, 79, 81, 0])]),
      qadam(q, t, a) {
        const s = q % 16;
        if (s === 0) a[1].forEach(m => boy(m, t, 2, .028, 2000, mus, .3, .25));
        if (s === 0 || s === 10) bas(a[0], t, .5, .36);
        if (s === 0 || s === 8) baraban(t, .5);
        if (s === 4 || s === 12) qarsak(t, .12);
        if (s % 2 === 0) tarelka(t, .03);
        const k = this.kuy[q % 64]; if (k) chert(k, t, .16, .4);
      }
    }
  };
  let joriy = null, keyingi = 0, qadam = 0, taymer = null, jT0 = 0, jDav = 0;
  function rejala() {                                // 0.12 s oldindan rejalashtirish
    const k = KUY[joriy]; if (!k) return;
    const d = 60 / k.bpm / 4;
    while (keyingi < ctx.currentTime + .12) {
      const j = jDav ? Math.min(1, Math.max(0, (keyingi - jT0) / jDav)) : 0;
      k.qadam(qadam, keyingi, k.akkord[Math.floor(qadam / 16) % k.akkord.length], j);
      keyingi += d; qadam++;
    }
  }
  // musiqa('kutish') · musiqa('savol', {davom: 20}) — savol uzunligi (s) bo'yicha kuchayadi
  // musiqa('podium') — avval karnay (fanfara), keyin g'olib kuyi · musiqa(null) — to'xtatish
  function musiqa(nom, opt) {
    if (nom === joriy && !(opt && opt.davom)) return;
    joriy = nom; clearInterval(taymer); taymer = null;
    if (!nom || !tayyorla()) return;
    keyingi = ctx.currentTime + .05; qadam = 0;
    jT0 = keyingi; jDav = opt && opt.davom ? opt.davom : 0;
    if (nom === 'podium') { if (yoqiq) OVOZ.fanfara(); keyingi += 4.3; }
    taymer = setInterval(rejala, 25); rejala();
  }

  const OVOZ = {
    tik() { nota(96, ctx.currentTime, .05, 'square', .12, sfx); },
    soat() { const t = ctx.currentTime; nota(84, t, .09, 'square', .22, sfx); nota(96, t + .002, .05, 'sine', .2, sfx); },
    pop() { const t = ctx.currentTime; nota(76, t, .12, 'sine', .35, sfx, 7); nota(88, t + .06, .1, 'sine', .2, sfx); },
    sanoq() { const t = ctx.currentTime; nota(81, t, .2, 'square', .14, sfx); baraban(t, .5, sfx); },
    boshla() { const t = ctx.currentTime; [72, 76, 79, 84].forEach((m, i) => boy(m, t + i * .07, .28, .09, 3000, sfx, .2)); },
    togri() { const t = ctx.currentTime; [72, 76, 79, 84].forEach((m, i) => nota(m, t + i * .08, .35, 'triangle', .38, sfx, 0, .2)); },
    xato() { const t = ctx.currentTime; nota(55, t, .3, 'sawtooth', .22, sfx, -2); nota(50, t + .22, .45, 'sawtooth', .22, sfx, -3); },
    gong() {
      const t = ctx.currentTime;
      [[45, .5], [57, .28], [64, .16], [69, .1]].forEach(([m, v]) => nota(m, t, 2.2, 'sine', v, sfx, 0, .2));
      shovqin(t, .6, .2, 1500, sfx);
    },
    fanfara() {
      const t = ctx.currentTime;
      // 2 soniya baraban «gumburlashi» (kuchayib), zarb, keyin karnay
      for (let i = 0; i < 40; i++) shovqin(t + i * .05, .06, .03 + i * .006, 1500, sfx, 'bandpass');
      baraban(t + 2, .9, sfx); shovqin(t + 2, 1.6, .22, 4500, sfx);
      [[67, 0, .14], [67, .16, .14], [67, .32, .14], [72, .48, .9]].forEach(([m, d, l]) => boy(m, t + 2 + d, l, .13, 3200, sfx, .25));
      [[64, 72, 76, 79]].forEach(ak => ak.forEach(m => boy(m, t + 2.5, 1.7, .06, 2600, sfx, .3, .05)));
      [84, 88, 91, 96].forEach((m, i) => nota(m, t + 2.55 + i * .08, .8, 'triangle', .1, sfx, 0, .3));
    }
  };
  return {
    tayyorla,
    musiqa,
    ovoz(nom) { if (yoqiq && tayyorla() && OVOZ[nom]) OVOZ[nom](); },
    yoqiqmi: () => yoqiq,
    joriy: () => joriy,                         // hozir qaysi kuy (sinov uchun)
    _chiqish: () => (tayyorla(), bosh),          // umumiy ovoz tuguni (yozib olish/sinov uchun)
    almashtir() {
      yoqiq = !yoqiq;
      try { localStorage.setItem(KEY, yoqiq ? '1' : '0'); } catch (e) {}
      if (tayyorla()) bosh.gain.setTargetAtTime(yoqiq ? 1 : 0, ctx.currentTime, .05);
      return yoqiq;
    }
  };
})();

</script>
<script>
/* ============================================================
   Jonli test — talaba (jonli.html)
   PIN + ism → kutish (qahramon tanlash) → 3-2-1 → savol → natija →
   … → podium va barcha o'rinlar.

   Rejimlar (server javobidagi `rejim`):
     • savol turi — 4 rangli tugma, «To'g'ri / Noto'g'ri», yozib javob;
     • jamoa / battle — o'z jamoasi (guruhi), tepada hisob;
     • oxirgi qolgan — xato qilsa chiqadi va tomosha qiladi;
     • ×2 tavakkal — har savoldan OLDIN tanlanadi (kutish, 3-2-1 va
       natija ekranida «keyingi savolga»);
     • uyga vazifa / duel — talaba o'zi «Boshlash»ni bosadi, natijadan
       keyin «Keyingi savol»; reyting muddat tugagach ochiladi.
   Holat serverdan (/api/o/h) so'raladi; soat server soatiga
   moslanadi, sekundomer shu yerda yuradi. Sahifa yangilansa, o'yinga
   qaytadi. Ovozlar — oyin-umumiy.js (OyinOvoz).
   ============================================================ */
(function () {
  const OKEY = 'au_jonli_oyin_v1', AKEY = 'au_jonli_avatar_v1';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const matn = (t, ar) => ar ? `<span class="ar">${esc(t)}</span>` : esc(t);
  let O = null, H = null, FARQ = 0, TIMER = null, KALIT = '', TANLOV = null;
  const hozir = () => Date.now() + FARQ;
  // pauzada sekundomer to'xtab turadi (server qolgan vaqtni beradi)
  const qoldiMs = () => !H ? 0 : H.pauza ? (H.qoldi || 0) : H.oxiri ? Math.max(0, H.oxiri - hozir()) : 0;
  const qoldi = () => Math.ceil(qoldiMs() / 1000);
  const foyd = () => { try { return JSON.parse(localStorage.getItem('au_user_v1') || 'null'); } catch (e) { return null; } };
  const saqla = () => { try { O ? localStorage.setItem(OKEY, JSON.stringify(O)) : localStorage.removeItem(OKEY); } catch (e) {} };
  function ekran(id) { document.querySelectorAll('.ekran').forEach(e => e.classList.toggle('faol', e.id === id)); window.scrollTo(0, 0); }
  const tnRang = k => k === 0 ? OYIN_RANG[3] : OYIN_RANG[0];
  const javobTugma = (s, k, cls, son) => s.tur === 'tn'
    ? `<button class="oy-javob tn-btn${cls ? ' ' + cls : ''}" style="background:${tnRang(k)}" data-k="${k}">${k === 0 ? '✓' : '✗'} ${esc(s.v[k])}${son === undefined ? '' : `<span class="son">${son}</span>`}</button>`
    : `<button class="oy-javob${cls ? ' ' + cls : ''}" style="background:${OYIN_RANG[k]}" data-k="${k}">
      ${oyinShakl(k)}${matn(s.v[k], s.vAr)}${son === undefined ? '' : `<span class="son">${son}</span>`}</button>`;
  if (typeof BREND !== 'undefined') $('markaz').textContent = BREND.markaz || '';
  const rj = () => (H && H.rejim) || {};
  const chiqdimi = () => H && H.men.chiqdi !== null && H.men.chiqdi !== undefined;
  const jamoaRang = i => OYIN_RANG[i || 0];

  /* ---------- ovoz tugmasi ---------- */
  const ovozBelgi = () => { $('ovozBtn').textContent = OyinOvoz.yoqiqmi() ? '🔊' : '🔇'; };
  window.ovozAlmash = () => { OyinOvoz.almashtir(); ovozBelgi(); };
  ovozBelgi();
  document.addEventListener('pointerdown', () => OyinOvoz.tayyorla(), { once: true });

  /* ---------- tepadagi tugma: «Bosh sahifa» yoki «Chiqish» ---------- */
  function tepa() {
    const b = $('tepaBtn');
    if (O) { b.textContent = 'Chiqish'; b.removeAttribute('href'); b.onclick = chiq; }
    else { b.textContent = 'Bosh sahifa'; b.setAttribute('href', 'index.html'); b.onclick = null; }
  }
  function chiq(e) {
    e.preventDefault();
    const egasiKut = H && H.xona && H.xona.egasi && H.faza === 'kutish';
    if (H && H.faza !== 'tugadi' && !confirm(egasiKut ? 'Chiqsangiz, xona yopiladi. Chiqasizmi?' : rj().uyga ? 'Chiqasizmi? Keyin shu PIN bilan qaytib, davom ettirsangiz bo‘ladi.' : 'O‘yindan chiqasizmi?')) return;
    if (egasiKut) post('xona-tugat');
    clearTimeout(TIMER); O = null; H = null; saqla(); tepa(); ekran('eKir');
  }

  /* ---------- qahramon (avatar) ---------- */
  let AV = null;
  try { AV = localStorage.getItem(AKEY); } catch (e) {}
  if (!/^\d{1,2}-\d{1,2}$/.test(AV || '')) AV = Math.floor(Math.random() * OYIN_HAYVON.length) + '-0';
  function tanlovChiz() {
    const [h, b] = avatarKod(AV);
    $('kutAv').innerHTML = avatarHtml(AV, '', 'katta');
    $('hayvonlar').innerHTML = OYIN_HAYVON.map((e, i) => `<button class="hb${i === h ? ' on' : ''}" onclick="avTanla(${i},null)">${e}</button>`).join('');
    $('boshlar').innerHTML = OYIN_BOSH.map((x, i) => `<button class="hb${i === b ? ' on' : ''}" onclick="avTanla(null,${i})">${x.e || '<small>Yo‘q</small>'}</button>`).join('');
  }
  window.avTanla = function (h, b) {
    const [h0, b0] = avatarKod(AV);
    AV = (h === null ? h0 : h) + '-' + (b === null ? b0 : b);
    try { localStorage.setItem(AKEY, AV); } catch (e) {}
    tanlovChiz(); OyinOvoz.ovoz('pop');
    if (O) fetch('/api/o/avatar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: O.id, o: O.oid, avatar: AV }) }).catch(() => {});
  };

  /* ---------- kirish ---------- */
  const pinEl = $('pin'), ismEl = $('ism');
  const u = foyd();
  if (u && u.ism) ismEl.value = (u.ism + ' ' + (u.familiya || '')).trim();
  try { const s = localStorage.getItem('au_jonli_ism'); if (s && !ismEl.value) ismEl.value = s; } catch (e) {}
  const pinUrl = new URLSearchParams(location.search).get('pin');
  pinEl.addEventListener('input', () => {
    const r = pinEl.value.replace(/\D/g, '').slice(0, 6);
    pinEl.value = r.length > 3 ? r.slice(0, 3) + ' ' + r.slice(3) : r;
    $('kirXato').textContent = '';
    if (r.length === 6 && !ismEl.value) ismEl.focus();
  });
  if (pinUrl) { pinEl.value = pinUrl; pinEl.dispatchEvent(new Event('input')); }
  [pinEl, ismEl].forEach(e => e.addEventListener('keydown', ev => { if (ev.key === 'Enter') window.kir(); }));

  window.kir = async function () {
    const pin = pinEl.value.replace(/\D/g, ''), ism = ismEl.value.trim().replace(/\s+/g, ' '), x = $('kirXato');
    if (pin.length !== 6) { x.textContent = 'PIN 6 ta raqamdan iborat'; pinEl.focus(); return; }
    if (ism.length < 2) { x.textContent = 'Ism va familiyangizni yozing'; ismEl.focus(); return; }
    x.textContent = ''; $('kirBtn').disabled = true;
    let d;
    try {
      d = await (await fetch('/api/o/kir', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin, ism, tel: u && u.tel, avatar: AV, oid: O && O.pin === pin ? O.oid : undefined }) })).json();
    } catch (e) { d = { ok: false, xato: 'Internet yo‘q — qayta urinib ko‘ring' }; }
    $('kirBtn').disabled = false;
    if (!d.ok) { x.textContent = d.xato || 'Kirib bo‘lmadi'; return; }
    try { localStorage.setItem('au_jonli_ism', ism); } catch (e) {}
    O = { id: d.id, oid: d.oid, pin }; saqla(); tepa();
    OyinOvoz.ovoz('pop');
    KALIT = ''; so();
  };
  const post = (yol, b) => fetch('/api/o/' + yol, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id: O.id, o: O.oid }, b || {})) })
    .then(r => r.json()).catch(() => ({ ok: false, xato: 'Internet yo‘q' }));

  /* ---------- holat ---------- */
  async function so() {
    clearTimeout(TIMER);
    if (!O) return;
    let d;
    try { d = await (await fetch('/api/o/h?id=' + O.id + '&o=' + O.oid, { cache: 'no-store' })).json(); }
    catch (e) { TIMER = setTimeout(so, 2000); return; }
    if (!O) return;
    if (!d.ok) {
      const xabar = d.chiqarildi ? 'Siz o‘yindan chiqarildingiz yoki o‘yin bekor qilindi.' : (d.xato || 'O‘yin topilmadi');
      O = null; saqla(); H = null; tepa(); ekran('eKir'); $('kirXato').textContent = xabar; return;
    }
    FARQ = d.hozir - Date.now(); H = d;
    if (d.men.avatar) AV = d.men.avatar;
    chiz();
    if (d.faza === 'tugadi' && d.yakuniy) {
      const rj = $('revJoy');
      if (rj && d.xona) { const h = revanshHtml(d); if (rj.dataset.h !== h) { rj.dataset.h = h; rj.innerHTML = h; } }
      // do'st ochgan xona: revansh tugmasi chiqishini kutamiz (10 daqiqagacha)
      if (d.xona && !d.xona.egasi && !d.xona.revansh && (O.kut = (O.kut || 0) + 1) < 150) { TIMER = setTimeout(so, 4000); return; }
      O = null; saqla(); tepa(); return;
    }
    // keyingi so'rov: bosqich tugaydigan paytga moslab
    // so'rovlar soni: sekundomer telefonda yuradi, server — bosqich almashganda (va ora-sira, pauza/«Keyingi» uchun)
    let k = d.faza === 'tugadi' ? 15000 : d.faza === 'kutish' ? (d.rejim.uyga ? 10000 : d.xona && d.xona.egasi ? 2000 : 3000)
      : d.faza === 'savol' ? (TANLOV === null ? 3000 : 2500) : d.faza === 'natija' ? 2500 : 1500;
    if (d.oxiri && !d.pauza) k = Math.min(k, d.oxiri - hozir() + 120);
    TIMER = setTimeout(so, Math.max(300, k));
  }

  // tepadagi qator: savol raqami, ball; jamoa/battle — hisob; teglar
  function hisobQator(d) {
    if (!d.jamoalar || !d.rejim.battle) return '';

        ${r.yoqotish && !chiqdimi() ? `<p class="oy-soft" style="margin-top:12px">❤️ Siz hali o‘yindasiz — <b style="color:var(--o-ink)">${d.tirik}</b> kishi qoldi</p>` : ''}
        <div class="statlar"><div><b>${d.men.ball}</b><span>ball</span></div><div><b>${d.men.orin || '—'}<small style="font-size:16px;color:var(--o-soft)">${d.men.orin ? '/' + d.jami : ''}</small></b><span>o‘rin</span></div>
          <div><b>${d.men.togri}</b><span>to‘g‘ri</span></div></div>
        ${jamoaBar(d)}
        ${r.uyga ? '' : `<p class="oy-soft" style="margin-top:14px">${d.topdi || 0} / ${d.javob_berdi || 0} kishi to‘g‘ri topdi</p>`}
        ${keyingiBor ? xavfKarta(d, d.i + 1) : ''}
        ${r.uyga ? `<button class="oy-btn toliq" style="margin-top:16px" onclick="uygaKeyingi()">${keyingiBor ? 'Keyingi savol ›' : 'Yakunlash ›'} <small class="sek" style="opacity:.6">${qoldi()}</small></button>`
          : d.xona && d.xona.egasi ? `<button class="oy-btn toliq" style="margin-top:16px" onclick="xonaKeyingi(this)">${keyingiBor ? 'Keyingi savol ›' : 'Natijalar ›'} <small class="sek" style="opacity:.6">${qoldi()}</small></button>`
          : `<p class="oy-soft" style="margin-top:6px">${keyingiBor ? 'Keyingi savol: <b class="sek">' + qoldi() + '</b> s' : 'Natijalar…'}</p>`}</div>`;
  }
  window.uygaKeyingi = async function () { if (!H) return; await post('keyingi-men', { faza: H.faza, i: H.i }); so(); };
  // o'yin oxirida talabaning o'z xatolari: savol, uning javobi va to'g'risi
  function xatoKarta(d) {
    const x = d.xatolarim;
    if (!x) return '';
    if (!x.length) return `<div class="oy-kart markaz xato-k"><h3>🎉 Hamma savolga to‘g‘ri javob berdingiz!</h3></div>`;
    const t = (v, ar) => `<span class="${ar ? 'ar' : ''}">${esc(v)}</span>`;
    return `<div class="oy-kart xato-k"><h3>📝 Xatolaringiz <span class="oy-soft">(${x.length} ta)</span></h3>${x.map(q => `<div class="xq">
        <div class="xq-p"><small>${q.i + 1}. ${esc(q.label || '')}</small>${t(q.p, q.pAr)}${q.juft ? ` = ${t(q.juft, q.juftAr)}` : ''}</div>
        <div class="xq-j"><span class="yoq">✗ ${q.javob === null ? '⏰ javob bermadingiz' : t(q.javob || '—', q.vAr)}</span><span class="ha">✓ ${t(q.togri, q.vAr)}</span></div></div>`).join('')}</div>`;
  }
  // xona tugadi: egasi «🔁 Revansh» bosadi (o'sha sozlamalar, yangi savollar); boshqalarga yangi PIN ko'rinadi
  // xona egasiga o'yin oxirida: kim qaysi so'zda xato qildi (ko'p xato qilingani tepada)
  function xonaXatolar(d) {
    const x = d.xatolar;
    if (!x) return '';
    if (!x.length) return `<div class="oy-kart xato-k"><h3>🎉 Hech kim xato qilmadi!</h3></div>`;
    const t = (v, ar) => `<span class="${ar ? 'ar' : ''}">${esc(v)}</span>`;
    return `<div class="oy-kart xato-k"><h3>❌ Kim qaysi so‘zda xato qildi</h3>${x.map(q => `<div class="xq">
        <div class="xq-p"><small>${q.i + 1}. ${esc(q.label || '')} · ${q.xato.length + q.javobsiz.length} kishi xato</small>${t(q.p, q.pAr)}${q.juft ? ` = ${t(q.juft, q.juftAr)}` : ''}</div>
        <div class="xq-j"><span class="ha">✓ ${t(q.togri, q.vAr)}</span></div>
        <div class="xq-k">${q.xato.map(y => `<span><b>${esc(y.ism)}</b> ${t(y.javob || '—', q.vAr)}</span>`).join('')}${q.javobsiz.map(n => `<span class="bosh"><b>${esc(n)}</b> ⏰</span>`).join('')}</div></div>`).join('')}</div>`;
  }
  function revanshHtml(d) {
    const x = d.xona;
    if (x.egasi) return `<a class="oy-btn toliq" style="margin-top:20px" href="index.html?xona=revansh&id=${O ? O.id : ''}&o=${O ? O.oid : ''}">🔁 Revansh — yana o‘ynaymiz</a>
      <a class="oy-btn oq toliq" style="margin-top:10px" href="index.html">Bosh sahifaga</a>`;
    if (x.revansh) return `<a class="oy-btn toliq" style="margin-top:20px" href="jonli.html?pin=${x.revansh}">🔁 Revansh! Qo‘shilish — PIN ${x.revansh}</a>`;
    return `<p class="oy-soft" style="margin-top:18px;text-align:center">${esc(x.ochdi || 'Xona egasi')} revansh ochsa — shu yerda tugma chiqadi…</p>
      <a class="oy-btn oq toliq" style="margin-top:10px" href="index.html">Bosh sahifaga</a>`;
  }
  function yakunChiz() {
    const d = H, r = d.rejim, top = d.top || [], m = top.find(x => x.men);
    $('eYakun').dataset.yakuniy = d.yakuniy ? '1' : '';
    if (!d.yakuniy) {                                     // uyga vazifa / duel — o'zi tugatdi, boshqalarni kutamiz
      const md = r.muddat ? new Date(r.muddat + 5 * 3600e3) : null, ik = n => String(n).padStart(2, '0');
      $('eYakun').innerHTML = `<div class="oy-kart markaz"><div class="oy-emoji">✅</div><h2>${r.duel ? 'Duelni yechdingiz!' : 'Vazifani tugatdingiz!'}</h2>
        <div class="statlar"><div><b>${d.men.togri}</b><span>/ ${d.son} to‘g‘ri</span></div><div><b>${d.men.ball}</b><span>ball</span></div><div><b>${Math.round(d.men.togri / d.son * 100)}%</b><span>natija</span></div></div>
        <p class="oy-soft" style="margin-top:16px">${r.duel ? 'Raqibingiz hali yechmoqda — natija ikkalangiz tugatgach ochiladi 🤫'
          : `Umumiy reyting muddat tugagach ochiladi${md ? ` (${ik(md.getUTCDate())}.${ik(md.getUTCMonth() + 1)} ${ik(md.getUTCHours())}:${ik(md.getUTCMinutes())})` : ''}. ${d.tugatganlar || 1} kishi yechib bo‘ldi.`}</p>
        <p class="oy-soft" style="font-size:13px;margin-top:6px">Natijangiz guruh reytingiga yozildi.</p>
        <a class="oy-btn oq toliq" style="margin-top:18px" href="index.html">Bosh sahifaga</a></div>` + xatoKarta(d);
      OyinOvoz.ovoz('fanfara');
      return;
    }
    if (!d.xona) OyinOvoz.ovoz('fanfara');               // xonada — musiqa('podium') o'zi karnay chaladi
    if (r.duel) {
      const u = top.find(x => !x.men), g = m && (!u || m.ball > u.ball), dr = m && u && m.ball === u.ball;
      $('eYakun').innerHTML = `<div class="oy-kart markaz"><div class="oy-emoji">${dr ? '🤝' : g ? '🏆' : '💪'}</div><h2 class="nat-sar ${g ? 'ha' : ''}">${dr ? 'Durang!' : g ? 'Siz yutdingiz!' : 'Bu safar raqib yutdi'}</h2>
        <div class="duel-q">${[m, u].filter(Boolean).map(x => `<div class="${top[0] === x && !dr ? 'g' : ''}">${avatarHtml(x.avatar, x.ism)}<div>${esc(x.men ? 'Siz' : x.ism)}${top[0] === x && !dr ? ' 👑' : ''}</div><b>${x.togri} / ${d.son}</b><small>${x.ball} ball</small></div>`).join('')}</div>
        <a class="oy-btn toliq" style="margin-top:18px" href="index.html?guruhim=1&duel=1">🔁 Revansh — yangi duel</a>
        <a class="oy-btn oq toliq" style="margin-top:10px" href="index.html">Bosh sahifaga</a></div>` + xatoKarta(d);
      if (g) konfetti();
      return;
    }
    // «· 94%» — to'g'ri javoblar foizi
    const foizK = (t, n) => n && t !== undefined && t !== null ? ` · <span class="oy-foiz">${Math.round(t / n * 100)}%</span>` : '';
    const p = k => top[k] ? `<div class="oy-p oy-p${k + 1}">${avatarHtml(top[k].avatar, top[k].ism)}<div class="oy-p-ism">${esc(top[k].ism)}</div>
        <div class="oy-p-ball">${top[k].ball} ball${foizK(top[k].togri, d.son)}</div><div class="oy-p-ust">${k + 1}<small>${['🥇', '🥈', '🥉'][k]}</small></div></div>` : '<div class="oy-p bo"></div>';
    let bosh = `<div class="markaz"><h2>🏆 ${esc(d.nom)}</h2></div>`;
    const jl = d.jamoalar || [], g = jl[0], dr = jl.length > 1 && jl[1].ball === g.ball;
    if (jl.length) {
      const bizniki = g && g.k === d.men.jamoa && !dr;
      bosh = `<div class="markaz"><h2>${dr ? '🤝 Durang!' : `🏆 ${esc(g.nom)}${r.battle ? '-guruh' : ' jamoa'} g‘olib!`}</h2>
        ${bizniki ? '<p class="oy-soft" style="font-size:16px">🎉 Sizning jamoangiz yutdi!</p>' : ''}</div>${hisobQator(Object.assign({}, d, { i: -1 })) || ''}<div class="oy-kart">${jamoaBar(d)}</div>`;
      if (bizniki) konfetti();
    } else if (r.yoqotish && top[0]) bosh = `<div class="markaz"><h2>❤️ Oxirgi qolgan: ${esc(top[0].ism)}!</h2></div>`;
    $('eYakun').innerHTML = bosh + `<div class="oy-podium">${p(1)}${p(0)}${p(2)}</div>
      ${m ? `<div class="men-kart">${avatarHtml(m.avatar, m.ism)}<span style="flex:1">Siz: ${m.orin}-o‘rin</span><span>${m.ball} ball${foizK(m.togri, d.son)}</span></div>` : ''}
      <div class="oy-kart"><h3 style="margin-bottom:6px">Barcha o‘rinlar</h3>${top.map(x => `<div class="oy-rq${x.men ? ' men' : ''}">
        <span class="o">${x.orin <= 3 ? ['🥇', '🥈', '🥉'][x.orin - 1] : x.orin}</span>${avatarHtml(x.avatar, x.ism)}
        <span class="i">${esc(x.ism)}${x.men ? ' (siz)' : ''}</span><span class="t">${r.yoqotish && x.chiqdi !== null && x.chiqdi !== undefined ? (x.chiqdi >= 0 ? '💥' + (x.chiqdi + 1) : '👀') : x.togri + '/' + d.son} · ${d.son ? Math.round((x.togri || 0) / d.son * 100) : 0}%</span><span class="b">${x.ball}</span></div>`).join('')}</div>
      ${d.xona ? `<div id="revJoy">${revanshHtml(d)}</div>${xonaXatolar(d)}${xatoKarta(d)}` : `${xatoKarta(d)}<a class="oy-btn oq toliq" style="margin-top:20px" href="jonli.html">Yangi o‘yinga kirish</a>`}`;
    if (m && m.orin <= 3) konfetti();
  }
  function konfetti() {
    const k = document.createElement('div'); k.className = 'oy-konfetti';
    for (let i = 0; i < 70; i++) {
      const e = document.createElement('i');
      e.style.left = Math.random() * 100 + '%';
      e.style.background = OYIN_RANG[i % 4];
      e.style.animationDuration = (2.4 + Math.random() * 2) + 's';
      e.style.animationDelay = (1.6 + Math.random() * 1.2) + 's';
      k.appendChild(e);
    }
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 7000);
  }
  // sekundomer
  function tik() {
    const q = qoldi();
    document.querySelectorAll('.sek').forEach(e => { e.textContent = q; });
    const c = $('sChiz');
    if (c && H && H.faza === 'savol') c.style.width = Math.max(0, qoldiMs() / (H.vaqt * 1000) * 100) + '%';
  }
  // ustoz pauza bosdi — butun ekran ustida yozuv, javob tugmalari ishlamaydi
  function pauzaKor() {
    let e = $('pauzaQ');
    const kor = H && H.pauza && ['tayyor', 'savol', 'natija'].includes(H.faza);
    if (!kor) { if (e) e.remove(); return; }
    const x = H.xona, h = x && x.egasi
      ? '<div><div class="oy-emoji">⏸</div><h2>Pauza</h2><p>O‘yin to‘xtatildi — vaqt ham to‘xtab turibdi.</p><button class="oy-btn" onclick="xonaPauza(1)">▶ Davom etish</button></div>'
      : `<div><div class="oy-emoji">⏸</div><h2>Pauza</h2><p>${x ? esc(x.ochdi || 'Xona egasi') : 'Ustoz'} o‘yinni to‘xtatdi.<br>Vaqt ham to‘xtab turibdi — davom ettirishini kuting.</p></div>`;
    if (!e) { e = document.createElement('div'); e.id = 'pauzaQ'; document.body.appendChild(e); }
    if (e.dataset.h !== h) { e.dataset.h = h; e.innerHTML = h; }
  }
  setInterval(() => { if (H && H.oxiri) tik(); }, 200);

  // sahifa yangilansa — o'yinga qaytamiz
  try { O = JSON.parse(localStorage.getItem(OKEY) || 'null'); } catch (e) {}
  if (O && O.id && O.oid) { if (pinUrl && pinUrl.replace(/\D/g, '') !== O.pin) { O = null; saqla(); } else so(); }
  else if (!pinUrl) pinEl.focus();
  tepa();
})();

</script>
