      shovqinBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = shovqinBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }
  function chiqar(g, chiq, aksga) { g.connect(chiq || mus); if (aksga) { const a = ctx.createGain(); a.gain.value = aksga; g.connect(a); a.connect(aks); } }
  // oddiy nota: tur — sine/triangle/square/sawtooth
  function nota(m, t, dur, tur, vol, chiq, sirpan, aksga) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tur; o.frequency.setValueAtTime(hz(m), t);
    if (sirpan) o.frequency.exponentialRampToValueAtTime(hz(m + sirpan), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); chiqar(g, chiq, aksga); o.start(t); o.stop(t + dur + .05);
  }
  // «boy» ovoz: ikki xil sozlangan arra to'lqin + filtr (karnay, akkord)
  function boy(m, t, dur, vol, kesish, chiq, aksga, hujum) {
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(kesish * .35, t); f.frequency.linearRampToValueAtTime(kesish, t + (hujum || .02) + .03);
    f.frequency.exponentialRampToValueAtTime(Math.max(300, kesish * .4), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + (hujum || .015));
    g.gain.setValueAtTime(vol, t + Math.max(.02, dur - .08)); g.gain.exponentialRampToValueAtTime(.0008, t + dur + .1);
    [-7, 7].forEach(c => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = c;
      o.connect(f); o.start(t); o.stop(t + dur + .15);
    });
    f.connect(g); chiqar(g, chiq, aksga);
  }
  // chertma (arpedjio, qo'ng'iroq): uchburchak + yuqori garmonika, tez so'nadi
  function chert(m, t, vol, dur, aksga) {
    nota(m, t, dur || .22, 'triangle', vol, mus, 0, aksga === undefined ? .35 : aksga);
    nota(m + 12, t, (dur || .22) * .5, 'sine', vol * .35, mus, 0, 0);
  }
  function bas(m, t, dur, vol) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o2.type = 'sine'; o.frequency.value = hz(m); o2.frequency.value = hz(m);
    f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(220, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(mus);
    o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  function shovqin(t, dur, vol, past, chiq, tur) {      // tarelka / chapak
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = shovqinBuf; f.type = tur || 'highpass'; f.frequency.value = past || 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(chiq || mus); s.start(t, Math.random() * .4); s.stop(t + dur + .02);
  }
  function baraban(t, vol, chiq) {                        // katta baraban
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + .3);
    o.connect(g); g.connect(chiq || mus); o.start(t); o.stop(t + .32);
  }
  function qarsak(t, vol, chiq) {                         // kichik baraban / chapak
    shovqin(t, .16, vol, 1700, chiq, 'bandpass');
    nota(52, t, .08, 'triangle', vol * .6, chiq);
  }
  const tarelka = (t, vol, ochiq) => shovqin(t, ochiq ? .18 : .035, vol, 8000);

  /* ---------------- kuylar (hammasi shu yerda yozilgan, o'zimizniki) ----------------
     Har kuy 16 qadamli taktlardan iborat (1 qadam = 1/16 nota). */
  const takt = (bars) => [].concat(...bars);            // 8 ta «sakkizlik» → 16 qadam
  const sak = a => takt(a.map(x => [x, 0]));
  const KUY = {
    // kutish xonasi: quvnoq, sakrab turadigan — F – Dm – B♭ – C | B♭ – C – Am – Dm
    kutish: {
      bpm: 128,
      akkord: [[41, [65, 69, 72]], [38, [62, 65, 69]], [46, [62, 65, 70]], [36, [64, 67, 72]],
               [46, [62, 65, 70]], [36, [64, 67, 72]], [45, [64, 69, 72]], [38, [62, 65, 69]]],
      kuy: takt([
        sak([72, 0, 77, 0, 81, 79, 77, 0]), sak([74, 0, 77, 0, 81, 0, 79, 77]),
        sak([74, 0, 77, 0, 82, 81, 79, 0]), sak([79, 0, 76, 0, 72, 74, 76, 79]),
        sak([82, 0, 81, 0, 79, 0, 77, 79]), sak([81, 0, 79, 0, 76, 0, 72, 0]),
        sak([76, 77, 79, 0, 81, 0, 84, 0]), sak([81, 0, 79, 77, 0, 74, 76, 0])]),
      qadam(q, t, a) {
        const s = q % 16, bar = Math.floor(q / 16) % 8;
        if ([0, 3, 6, 8, 11, 14].includes(s)) bas(a[0] + (s === 6 || s === 14 ? 12 : 0), t, .2, .42);
        if (s % 4 === 2) a[1].forEach(m => boy(m, t, .1, .035, 2400, mus, .25));      // «skank» akkordlar
        if (s === 0 || s === 8 || (s === 14 && bar % 2)) baraban(t, .7);
        if (s === 4 || s === 12) qarsak(t, .2);
        if (s % 2 === 1) tarelka(t, .05); else if (s % 4 === 2) tarelka(t, .07, true);
        const k = this.kuy[q % 128]; if (k && q >= 32) chert(k, t, .19);          // 2 takt kirish, keyin kuy
        if (q % 128 === 124) for (let i = 0; i < 4; i++) qarsak(t + i * (60 / this.bpm / 4), .08 + i * .04);
      }
    },
    // savol: o'rtacha tezlikda, quvnoq (F – C – Dm – B♭); vaqt o'tgan sari asta boyiydi,
    // lekin shoshiltirmaydi — mayda tez urishlar yo'q
    savol: {
      bpm: 124,
      akkord: [[41, [65, 69, 72]], [36, [64, 67, 72]], [38, [62, 65, 69]], [46, [62, 65, 70]]],
      kuy: takt([sak([72, 0, 74, 0, 77, 0, 0, 0]), sak([76, 0, 74, 0, 72, 0, 0, 0]),
                 sak([74, 0, 77, 0, 81, 0, 79, 0]), sak([77, 0, 0, 0, 74, 0, 0, 0])]),
      qadam(q, t, a, j) {                                 // j: 0 → 1 (savol vaqtining qancha qismi o'tdi)
        const s = q % 16;
        if (s === 0 || s === 6 || s === 8 || s === 14) bas(a[0] + (s === 6 || s === 14 ? 12 : 0), t, .22, .34);
        if (s === 0 || s === 8) baraban(t, .55);
        if (s === 4 || s === 12) qarsak(t, .13);
        if (s % 4 === 2) tarelka(t, .05, true);
        if (s % 4 === 2) a[1].forEach(m => boy(m, t, .09, .03, 2200, mus, .2));    // sakrab turadigan akkord
        if (j > .3 && s % 2 === 0) chert(a[1][[0, 1, 2, 1][(s / 2) % 4]] + 12, t, .08, .16, .2);
        const k = this.kuy[q % 64]; if (j > .55 && k) chert(k + 12, t, .13, .35);
        if (j > .75 && s === 0) a[1].forEach(m => boy(m, t, 1.8, .022, 1800, mus, .25, .3));
      }
    },
    // podium: g'olib kuyi (karnay kirishidan keyin) — C – G – Am – F, yengil va tantanali
    podium: {
      bpm: 112,
      akkord: [[36, [64, 67, 72]], [43, [62, 67, 71]], [45, [64, 69, 72]], [41, [65, 69, 72]]],
      kuy: takt([sak([79, 0, 0, 76, 79, 0, 84, 0]), sak([83, 0, 81, 0, 79, 0, 0, 0]), sak([76, 0, 79, 0, 84, 0, 83, 81]), sak([81, 0, 0, 0, 77, 79, 81, 0])]),
      qadam(q, t, a) {
        const s = q % 16;
        if (s === 0) a[1].forEach(m => boy(m, t, 2, .028, 2000, mus, .3, .25));
        if (s === 0 || s === 10) bas(a[0], t, .5, .36);
        if (s === 0 || s === 8) baraban(t, .5);
        if (s === 4 || s === 12) qarsak(t, .12);
        if (s % 2 === 0) tarelka(t, .03);
        const k = this.kuy[q % 64]; if (k) chert(k, t, .16, .4);
      }
    }
  };
  let joriy = null, keyingi = 0, qadam = 0, taymer = null, jT0 = 0, jDav = 0;
  function rejala() {                                // 0.12 s oldindan rejalashtirish
    const k = KUY[joriy]; if (!k) return;
    const d = 60 / k.bpm / 4;
    while (keyingi < ctx.currentTime + .12) {
      const j = jDav ? Math.min(1, Math.max(0, (keyingi - jT0) / jDav)) : 0;
      k.qadam(qadam, keyingi, k.akkord[Math.floor(qadam / 16) % k.akkord.length], j);
      keyingi += d; qadam++;
    }
  }
  // musiqa('kutish') · musiqa('savol', {davom: 20}) — savol uzunligi (s) bo'yicha kuchayadi
  // musiqa('podium') — avval karnay (fanfara), keyin g'olib kuyi · musiqa(null) — to'xtatish
  function musiqa(nom, opt) {
    if (nom === joriy && !(opt && opt.davom)) return;
    joriy = nom; clearInterval(taymer); taymer = null;
    if (!nom || !tayyorla()) return;
    keyingi = ctx.currentTime + .05; qadam = 0;
    jT0 = keyingi; jDav = opt && opt.davom ? opt.davom : 0;
    if (nom === 'podium') { if (yoqiq) OVOZ.fanfara(); keyingi += 4.3; }
    taymer = setInterval(rejala, 25); rejala();
  }

  const OVOZ = {
    tik() { nota(96, ctx.currentTime, .05, 'square', .12, sfx); },
    soat() { const t = ctx.currentTime; nota(84, t, .09, 'square', .22, sfx); nota(96, t + .002, .05, 'sine', .2, sfx); },
    pop() { const t = ctx.currentTime; nota(76, t, .12, 'sine', .35, sfx, 7); nota(88, t + .06, .1, 'sine', .2, sfx); },
    sanoq() { const t = ctx.currentTime; nota(81, t, .2, 'square', .14, sfx); baraban(t, .5, sfx); },
    boshla() { const t = ctx.currentTime; [72, 76, 79, 84].forEach((m, i) => boy(m, t + i * .07, .28, .09, 3000, sfx, .2)); },
    togri() { const t = ctx.currentTime; [72, 76, 79, 84].forEach((m, i) => nota(m, t + i * .08, .35, 'triangle', .38, sfx, 0, .2)); },
    xato() { const t = ctx.currentTime; nota(55, t, .3, 'sawtooth', .22, sfx, -2); nota(50, t + .22, .45, 'sawtooth', .22, sfx, -3); },
    gong() {
      const t = ctx.currentTime;
      [[45, .5], [57, .28], [64, .16], [69, .1]].forEach(([m, v]) => nota(m, t, 2.2, 'sine', v, sfx, 0, .2));
      shovqin(t, .6, .2, 1500, sfx);
    },
    fanfara() {
      const t = ctx.currentTime;
      // 2 soniya baraban «gumburlashi» (kuchayib), zarb, keyin karnay
      for (let i = 0; i < 40; i++) shovqin(t + i * .05, .06, .03 + i * .006, 1500, sfx, 'bandpass');
      baraban(t + 2, .9, sfx); shovqin(t + 2, 1.6, .22, 4500, sfx);
      [[67, 0, .14], [67, .16, .14], [67, .32, .14], [72, .48, .9]].forEach(([m, d, l]) => boy(m, t + 2 + d, l, .13, 3200, sfx, .25));
      [[64, 72, 76, 79]].forEach(ak => ak.forEach(m => boy(m, t + 2.5, 1.7, .06, 2600, sfx, .3, .05)));
      [84, 88, 91, 96].forEach((m, i) => nota(m, t + 2.55 + i * .08, .8, 'triangle', .1, sfx, 0, .3));
    }
  };
  return {
    tayyorla,
    musiqa,
    ovoz(nom) { if (yoqiq && tayyorla() && OVOZ[nom]) OVOZ[nom](); },
    yoqiqmi: () => yoqiq,
    joriy: () => joriy,                         // hozir qaysi kuy (sinov uchun)
    _chiqish: () => (tayyorla(), bosh),          // umumiy ovoz tuguni (yozib olish/sinov uchun)
    almashtir() {
      yoqiq = !yoqiq;
      try { localStorage.setItem(KEY, yoqiq ? '1' : '0'); } catch (e) {}
      if (tayyorla()) bosh.gain.setTargetAtTime(yoqiq ? 1 : 0, ctx.currentTime, .05);
      return yoqiq;
    }
  };
})();

</script>
<script>
/* ============================================================
   Jonli test, battle va duel uchun savollar — brauzerda tuziladi
   (ustoz.html: lug'at + fe'l trenajyori; index.html: lug'at — duel).

   jSavollar(qismlar, son, yon, tur)   — lug'atdan (VOCAB, data.js)
   jFelSavollar(shakllar, boblar, son, tur) — fe'llardan (VERBS +
                                         engine2.js dagi E)
   tur:  tanlov — 4 variant · tn — to'g'ri/noto'g'ri · yoz — tarjimani
         yozadi · aralash — har savolga tasodifan
   Savol: {tur, p, pAr, v, vAr, ok, label, juft?, juftAr?, qabul?}
   Server: _worker.js (savollarNorm) — to'g'ri javob talabaga faqat
   savol vaqti tugagach ko'rsatiladi.
   ============================================================ */
const jNormAr = t => String(t || '').replace(/[ً-ٰٟـ]/g, '').replace(/[آأإٱ]/g, 'ا')
  .replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const jNormHar = t => String(t || '').replace(/([\u064B-\u0650\u0652])(\u0651)/g, '$2$1').replace(/\u0640/g, '').replace(/\s+/g, ' ').trim();
const jNormUz = t => String(t || '').toLowerCase().replace(/[‘’'`ʻʼ]/g, "'").replace(/\s+/g, ' ').trim();
function jQisqa(uz) {                    // tugmaga sig'adigan qisqa tarjima: birinchi ma'no, qavslarsiz
  let t = String(uz).replace(/\([^)]*\)/g, '').split(';')[0].trim().replace(/[,\s]+$/, '');
  if (!t) t = String(uz);
  return t.length > 48 ? t.slice(0, 46) + '…' : t;
}
// «yozib javob» uchun qabul qilinadigan ma'nolar: «qalam, ruchka; pero» → [qalam, ruchka, pero]
function jMaxnolar(uz) {
  const r = String(uz || '').replace(/\([^)]*\)/g, ' ').split(/[;,/]/).map(x => x.replace(/\s+/g, ' ').trim()).filter(x => x && x.length <= 40);
  return [...new Set(r)].slice(0, 8);
}
function jAralashtir(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const jYorliq = q => /qism$/.test(q.nom) ? q.qism + '-qism' : q.nom;
const jTurTanla = tur => { const r = Array.isArray(tur) ? (tur.length ? tur : ['tanlov']) : tur === 'aralash' ? ['tanlov', 'tn', 'yoz'] : [tur || 'tanlov']; return r[Math.floor(Math.random() * r.length)]; };
const TOGRI_NOTOGRI = ['To‘g‘ri', 'Noto‘g‘ri'];
function jSozlar(qismlar) {               // takror so'zlar bitta (to'liqroq tarjimasi bilan)
  const m = new Map();
  qismlar.forEach(i => (VOCAB[i] ? VOCAB[i].sozlar : []).forEach(s => {
    const k = jNormAr(s.ar), e = m.get(k);
    if (!e || String(s.uz).length > String(e.uz).length) m.set(k, s);
  }));
  return [...m.values()];
}
// 3 ta noto'g'ri variant: boshqa so'zlardan, to'g'risi bilan takrorlanmasin
function jBoshqa(D, togri, ol, kalit, n) {
  const bor = new Set([kalit(togri)]), chiq = [];
  for (const x of jAralashtir(D)) {
    const v = ol(x), k = kalit(v);
    if (!k || bor.has(k)) continue;
    bor.add(k); chiq.push(v);
    if (chiq.length === n) break;
  }
  return chiq;
}
// ustoz qo'lda tanlagan so'zlar: «qism raqami|arabcha» kalitlari (faqat tanlangan qismlardagilari)
const jSozKalit = (q, s) => q.qism + '|' + jNormAr(s.ar);
function jTanlanganlar(qismlar, tanlov) {
  if (!tanlov || !tanlov.length) return null;
  const t = new Set(tanlov), bor = new Set();
  qismlar.forEach(i => (VOCAB[i] ? VOCAB[i].sozlar : []).forEach(s => { if (t.has(jSozKalit(VOCAB[i], s))) bor.add(jNormAr(s.ar)); }));
  return bor.size ? bor : null;
}
function jSavollar(qismlar, son, yon, tur, tanlov) {
  const hammasi = jSozlar(qismlar), faqat = jTanlanganlar(qismlar, tanlov);
  const S = jAralashtir(faqat ? hammasi.filter(w => faqat.has(jNormAr(w.ar))) : hammasi);
  const D = hammasi.length >= 12 ? hammasi : jSozlar(VOCAB.map((_, i) => i));   // noto'g'ri variantlar — qismning hamma so'zlaridan
  return S.slice(0, son).map(w => {
    const t = jTurTanla(tur);
    const y = t === 'yoz' ? 'ar-uz' : yon === 'aralash' ? (Math.random() < .5 ? 'ar-uz' : 'uz-ar') : yon;
    const arga = y === 'uz-ar';
    if (t === 'yoz') {                                                      // arabcha so'z → o'zbekcha yozadi
      const q = jMaxnolar(w.uz);
      if (q.length) return { tur: 'yoz', p: w.ar, pAr: true, qabul: q, label: 'Tarjimasini yozing' };
    }
    const togri = arga ? w.ar : jQisqa(w.uz), kalit = arga ? jNormAr : jNormUz;
    if (t === 'tn') {                                                       // juft: yarmida to'g'ri, yarmida boshqa so'zniki
      const rost = Math.random() < .5, juft = rost ? togri : (jBoshqa(D, togri, x => arga ? x.ar : jQisqa(x.uz), kalit, 1)[0] || togri);
      return { tur: 'tn', p: arga ? w.uz : w.ar, pAr: !arga, juft, juftAr: arga, v: TOGRI_NOTOGRI, ok: juft === togri ? 0 : 1, label: 'Shu tarjima to‘g‘rimi?' };
    }
    const v = jAralashtir([togri].concat(jBoshqa(D, togri, x => arga ? x.ar : jQisqa(x.uz), kalit, 3)));
    return arga ? { tur: 'tanlov', p: w.uz, pAr: false, v, vAr: true, ok: v.indexOf(togri), label: 'Arabchasi qaysi?' }
                : { tur: 'tanlov', p: w.ar, pAr: true, v, vAr: false, ok: v.indexOf(togri), label: 'Tarjimasini toping' };
  });
}

/* ---------------- fe'l shakllari ---------------- */
const FEL_SHAKL = [
  { k: 'muzori', nom: 'Moziy → Muzoriy', label: 'Muzoriy (marfu’) shaklini toping', tn: 'Muzoriy (marfu’) shakli to‘g‘rimi?' },
  { k: 'mozi', nom: 'Muzoriy → Moziy', label: 'Moziy shaklini toping', tn: 'Moziy shakli to‘g‘rimi?' },
  { k: 'amr', nom: 'Buyruq (amr)', label: 'Buyruq shaklini toping', tn: 'Buyruq shakli to‘g‘rimi?' },
  { k: 'masdar', nom: 'Masdar', label: 'Masdarini toping', tn: 'Masdari to‘g‘rimi?' },
  { k: 'foil', nom: 'Ism foil', label: 'Ism foilini toping', tn: 'Ism foili to‘g‘rimi?' },
  { k: 'maful', nom: 'Ism maf’ul', label: 'Ism maf’ulini toping', tn: 'Ism maf’uli to‘g‘rimi?' },
  { k: 'tarjima', nom: 'Tarjimasi', label: 'Fe’lning tarjimasi', tn: 'Tarjimasi to‘g‘rimi?' }
];
const FEL_BOBLAR = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const jFelX = fn => { try { return fn() || ''; } catch (e) { return ''; } };
function jFelOb(v) { return { bob: v.bob, root: [...String(v.root || '')], pastV: v.pastV || 'a', presV: v.presV || '', tur: v.tur, masdar: v.masdar || '', ar: v.ar, uz: v.uz }; }
function jFelShakl(f, k) {
  if (typeof E === 'undefined') return '';
  const kerakPres = k === 'muzori' || k === 'mozi' || k === 'amr' || ((k === 'foil' || k === 'maful') && f.bob === 'I');
  if (kerakPres && !f.presV) return '';
  if (k === 'mozi') return jFelX(() => E.conjugate(Object.assign({}, f, { zamon: 'otgan' }), '3ms')) || f.ar;
  if (k === 'muzori') return jFelX(() => E.conjugate(Object.assign({}, f, { zamon: 'hozirgi' }), '3ms'));
  if (k === 'amr') return jFelX(() => E.imperative(f, '2ms'));
  if (k === 'masdar') return f.masdar || jFelX(() => E.masdar(f.bob, f.root, null));
  if (k === 'foil') return jFelX(() => E.participle(f.bob, f.root, 'aniq', f.presV));
  if (k === 'maful') return E.hasPassive(f) ? jFelX(() => E.participle(f.bob, f.root, 'majhul', f.presV)) : '';
  if (k === 'tarjima') return jQisqa(f.uz);
  return '';
}
const jFellar = boblar => (typeof VERBS === 'undefined' ? [] : VERBS).filter(v => !boblar.length || boblar.includes(v.bob));
function jFelSavollar(shakllar, boblar, son, tur) {
  const F = jAralashtir(jFellar(boblar)).map(jFelOb), H = (typeof VERBS === 'undefined' ? [] : VERBS).map(jFelOb);
  const sh = shakllar.length ? shakllar : ['muzori'], chiq = [];
  for (const f of F) {
    if (chiq.length >= son) break;
    const k = sh[chiq.length % sh.length], s = FEL_SHAKL.find(x => x.k === k);
    const togri = jFelShakl(f, k);
    if (!togri) continue;
    const prompt = k === 'mozi' ? jFelShakl(f, 'muzori') : (jFelShakl(f, 'mozi') || f.ar);
    if (!prompt) continue;
    // fe'l shakllari harakat bilan solishtiriladi: يَكْتُبُ va يَكْتُبَ — boshqa-boshqa javob
    const ar = k !== 'tarjima', kalit = ar ? jNormHar : jNormUz;
    // noto'g'ri variantlar: shu fe'lning boshqa shakllari va boshqa fe'llarning shu shakli
    const bor = new Set([kalit(togri), kalit(prompt)]), boshqa = [];
    const qosh = v => { const n = kalit(v); if (v && n && !bor.has(n)) { bor.add(n); boshqa.push(v); } };
    // moziy/muzoriy/buyruq: shu fe'lning o'xshash shakllari (يَكْتُبَ ، تَكْتُبُ ، نَكْتُبْ ، اُكْتُبْ)
    const sit = { muzori: { zamon: 'hozirgi', mayl: 'aniqlik', cell: '3ms' }, mozi: { zamon: 'otgan', mayl: 'aniqlik', cell: '3ms' }, amr: { zamon: 'hozirgi', mayl: 'buyruq', cell: '2ms' } }[k];
    const yaqin = sit && typeof E !== 'undefined' && E.yaqinShakllar ? (() => { try { return E.yaqinShakllar(f, sit, 3); } catch (e) { return []; } })() : [];
    yaqin.forEach(qosh);
    if (!yaqin.length && ar) jAralashtir(['mozi', 'muzori', 'amr', 'masdar', 'foil', 'maful'].filter(x => x !== k)).slice(0, 3).forEach(x => { if (boshqa.length < 2) qosh(jFelShakl(f, x)); });
    for (const g of jAralashtir(H)) { if (boshqa.length >= 3) break; if (ar && g.bob !== f.bob && Math.random() < .6) continue; qosh(jFelShakl(g, k)); }
    if (boshqa.length < 1) continue;
    const label = s.label + (k === 'tarjima' ? '' : ` (${f.bob} bob)`);
    const t = jTurTanla(tur);
    if (t === 'tn') {
      const juft = Math.random() < .5 ? togri : boshqa[0];
      chiq.push({ tur: 'tn', p: prompt, pAr: true, juft, juftAr: ar, v: TOGRI_NOTOGRI, ok: juft === togri ? 0 : 1, label: s.tn + (k === 'tarjima' ? '' : ` (${f.bob} bob)`) });
    } else if (t === 'yoz' && k === 'tarjima' && jMaxnolar(f.uz).length) {
      chiq.push({ tur: 'yoz', p: prompt, pAr: true, qabul: jMaxnolar(f.uz), label: 'Fe’lning tarjimasini yozing' });
    } else {
      const v = jAralashtir([togri].concat(boshqa.slice(0, 3)));
      chiq.push({ tur: 'tanlov', p: prompt, pAr: true, v, vAr: ar, ok: v.indexOf(togri), label });
    }
  }
  return chiq;
}

      ${jb.length ? `<h3 style="margin-top:12px">⏰ Javob bermadi <span class="oy-soft">(${jb.length})</span></h3><div class="jo-xq-k">${jb.map(n => `<span class="jo-xk bosh"><b>${esc(n)}</b></span>`).join('')}</div>` : ''}</div>`;

// o'yin oxirida talabalar xatolari: ko'p xato qilingan savollar tepada, kim nima deb javob bergani
function jXatolarHtml(o) {
  const x = o.xatolar;
  if (!x || !o.oyinchilar.length) return '';

// uyga vazifa: PIN, muddat, kim qayergacha yechgan, eslatish
function jUygaHtml(o) {
  const p = o.oyinchilar, tug = p.filter(x => x.tugatdi).length, km = o.kirmaganlar || [];
  const jami = km.length + p.length;
  const md = new Date(o.muddat + 5 * 3600e3), ik = n => String(n).padStart(2, '0');
  return jAsbob(o) + `<div class="jo-uyga">
    <div class="oy-kart markaz"><div class="jtegs" style="justify-content:center">${jRejimTeg(o.rejim)}</div>
      <p class="oy-soft" style="margin-top:10px">Talabalar shu saytda PIN ni kiritadi</p><div class="jo-sayt">${esc(location.host)}/jonli</div>

      <div class="jo-muddat">⏳ ${ik(md.getUTCDate())}.${ik(md.getUTCMonth() + 1)} ${ik(md.getUTCHours())}:${ik(md.getUTCMinutes())} gacha · <b>${jMuddatQisqa(o.muddat)}</b></div>

        <span class="oy-soft" style="font-size:13px">talaba yechib bo‘ldi · ${p.length - tug} kishi yechmoqda</span></div></div>
      ${p.length ? p.map(x => `<div class="oy-rq"><span class="o">${x.tugatdi ? '✅' : x.boshladi ? '✍️' : '⏳'}</span>${avatarHtml(x.avatar, x.ism)}<span class="i">${esc(x.ism)}</span>

      ${km.length ? `<h3 style="margin-top:16px;font-size:17px">Hali kirmagan (${km.length})</h3><div class="jo-tirik">${km.map(x => `<span class="jo-tav">${esc(x.ism)}${o.rejim.guruhlar && o.rejim.guruhlar.length > 1 ? ' · ' + esc(x.guruh) : ''}</span>`).join('')}</div>` : ''}
      <div class="xabar" id="jEsl"></div></div></div>
    <div class="jo-tugmalar"><button class="oy-btn oq" onclick="jYakunla(true)">Muddatidan oldin yakunlash</button>

      ${o.rejim.guruhlar ? `<button class="oy-btn" onclick="jEslat(this)">📢 Yechmaganlarga eslatish</button>` : ''}</div>`;

async function jEslat(b) {
  b.disabled = true;
  const d = await api('/api/o/eslat', { id: JO.id }), x = $('jEsl');
  b.disabled = false;
  if (x) { x.className = 'xabar ' + (d.ok ? 'ok' : 'xato'); x.textContent = d.ok ? `📢 ${d.yechmagan} ta talabaga eslatma: ${d.yetdi} ta telefonga bildirishnoma ketdi (qolganlar bildirishnomani yoqmagan)` : (d.xato || 'Bo‘lmadi'); }

async function jKeyingi(avto) {
  const k = JO.faza + ':' + JO.i;

async function jYakunla(uyga) {

}
async function jTugat() {

<script>
/* ============================================================
   Kabinet: «⚔️ Battle» tabi — guruh va guruh battle, kurs turniri,
   haftalik liga (ustoz, admin va guruh sardori uchun).

   • Chaqiruv: o'z guruhi, raqib guruh, vaqt, savollar (lug'at
     qismlari) → raqib sardori qabul qiladi yoki boshqa vaqt taklif
     qiladi. Kelishilgach ikkala guruhga bildirishnoma va chatda e'lon.
   • Belgilangan vaqtda «▶ Battle'ni ochish» — jonli test ochiladi
     (jamoalar — ikki guruh; o'yin ekrani jonli.js da).
   • Turnir (ustoz/admin): guruhlarni tanlaydi → jadval; har juftga
     vaqt belgilanadi → battle; g'olib keyingi bosqichga o'zi o'tadi.
   Server: _worker.js dagi /api/g/battle…, /api/g/turnir…, /api/g/liga.
   ============================================================ */
const BKEY = 'au_battle_sozlama_v1';
let BS = { qism: [], son: 15, vaqt_s: 15, tur: 'tanlov', yon: 'ar-uz', xavf: false, oraliq: 7 };
try { Object.assign(BS, JSON.parse(localStorage.getItem(BKEY) || '{}')); } catch (e) {}
if (!BS.oraliq) BS.oraliq = 7;
const bSaqla = () => { try { localStorage.setItem(BKEY, JSON.stringify(BS)); } catch (e) {} };
let BD = null, BT = null, BFORMA = null, TFORMA = false, LIGA = null;
const OYLAR_UZ = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentyabr', 'oktabr', 'noyabr', 'dekabr'];
function bSana(iso) {
  const t = Date.parse(iso); if (isNaN(t)) return '—';
  const d = new Date(t + 5 * 3600e3), ik = n => String(n).padStart(2, '0');
  return `${d.getUTCDate()}-${OYLAR_UZ[d.getUTCMonth()]}, ${ik(d.getUTCHours())}:${ik(d.getUTCMinutes())}`;
}
function bQoldi(iso) {
  const q = Date.parse(iso) - Date.now();
  if (isNaN(q)) return '';
  if (q <= 0) return 'vaqti keldi';
  const k = Math.floor(q / 864e5), s = Math.floor(q % 864e5 / 3600e3), m = Math.floor(q % 3600e3 / 6e4);
  return (k ? k + ' kun ' : '') + (s ? s + ' soat ' : '') + (k ? '' : m + ' daq.') + ' qoldi';
}
const bLokal = iso => { const t = iso ? Date.parse(iso) : Math.ceil((Date.now() + 3600e3) / 3600e3) * 3600e3; return new Date(t + 5 * 3600e3).toISOString().slice(0, 16); };
const bGuruh = id => ((BD && BD.guruhlar) || []).find(g => g.id === id) || {};
const bMeniki = id => !BD || BD.menikilar === null || BD.menikilar.includes(id);

async function battleChiz(el) {
  el.innerHTML = '<div class="bosh-bosh">Yuklanmoqda…</div>';
  const [d, t] = await Promise.all([api('battlelar'), api('turnirlar')]);
  if (ATAB !== 'battle') return;
  if (!d.ok) { el.innerHTML = `<div class="bosh-bosh">${esc(d.xato || 'Yuklab bo‘lmadi')}</div>`; return; }
  BD = d; BT = t.ok ? t.turnirlar : [];
  const b = d.battlelar, sardor = KIM.rol === 'sardor';
  const kelgan = b.filter(x => x.holat === 'taklif' && x.menda[x.kutadi]);
  const yuborilgan = b.filter(x => x.holat === 'taklif' && !x.menda[x.kutadi]);
  const kelishilgan = b.filter(x => x.holat === 'qabul').sort((x, y) => String(x.vaqt).localeCompare(String(y.vaqt)));
  const natija = b.filter(x => x.holat === 'otdi');
  const mening = (d.menikilar === null ? [...new Set(b.flatMap(x => [x.a.gid, x.b.gid]))] : d.menikilar).filter(g => d.rekord[g]);
  el.innerHTML = `<div class="bt-q">
    <div class="karta bt-bosh"><div><h3>⚔️ Guruhlar battle’i</h3><p class="izoh">Boshqa guruhni chaqiring — kelishilgan vaqtda jonli test ochiladi, hisob — guruh a’zolarining o‘rtacha bali.</p></div>
      <button class="asosiy-btn" style="width:auto" onclick="bFormaOch()">+ Yangi chaqiruv</button></div>
    <div id="bForma">${BFORMA ? bFormaHtml() : ''}</div>
    ${kelgan.length ? `<h3 class="bt-sar">📨 Sizga kelgan chaqiruvlar <span class="son">${kelgan.length}</span></h3>${kelgan.map(x => bKarta(x, 'kelgan')).join('')}` : ''}
    ${kelishilgan.length ? `<h3 class="bt-sar">📅 Kelishilgan battlelar</h3>${kelishilgan.map(x => bKarta(x, 'qabul')).join('')}` : ''}
    ${yuborilgan.length ? `<h3 class="bt-sar">⏳ Javob kutilmoqda</h3>${yuborilgan.map(x => bKarta(x, 'yuborilgan')).join('')}` : ''}
    ${!kelgan.length && !kelishilgan.length && !yuborilgan.length ? '<div class="bosh-bosh" style="padding:18px">Hozircha rejalashtirilgan battle yo‘q. «+ Yangi chaqiruv» bilan boshlang.</div>' : ''}
    ${natija.length ? `<h3 class="bt-sar">🏁 Natijalar</h3>${natija.slice(0, 15).map(x => bKarta(x, 'otdi')).join('')}` : ''}
    ${mening.length ? `<div class="karta"><h3>📊 Battle hisobi</h3><div class="jadval-q" style="box-shadow:none"><table><tr><th>Guruh</th><th class="son">G‘alaba</th><th class="son">Mag‘lubiyat</th><th class="son">Durang</th></tr>
      ${mening.map(g => `<tr><td><b>${esc(guruhTol(bGuruh(g)))}</b></td><td class="son">${d.rekord[g].g}</td><td class="son">${d.rekord[g].m}</td><td class="son">${d.rekord[g].d}</td></tr>`).join('')}</table></div></div>` : ''}
    <div class="karta bt-bosh" style="margin-top:20px"><div><h3>🏆 Kurs turnirlari</h3><p class="izoh">Guruhlar juft-juft bellashadi: g‘olib keyingi bosqichga o‘tadi, finalda — kurs chempioni.</p></div>
      ${sardor ? '' : `<button class="asosiy-btn" style="width:auto" onclick="TFORMA=!TFORMA;battleChiz($('asosiyIchi'))">${TFORMA ? 'Yopish' : '+ Yangi turnir'}</button>`}</div>
    ${TFORMA && !sardor ? tFormaHtml() : ''}
    ${BT.length ? BT.map(tHtml).join('') : '<div class="bosh-bosh" style="padding:18px">Hali turnir yo‘q.</div>'}
  </div>`;
}
function bVS(x) {
  const n = x.natija, g = n && n.golib;
  return `<div class="bt-vs"><span class="bt-g${g === x.a.gid ? ' gol' : ''}${bMeniki(x.a.gid) ? ' men' : ''}">${esc(x.a.nom)}</span>
    ${n ? `<b class="bt-hisob">${n.a.ball} : ${n.b.ball}</b>` : '<b class="bt-x">VS</b>'}
    <span class="bt-g${g === x.b.gid ? ' gol' : ''}${bMeniki(x.b.gid) ? ' men' : ''}">${esc(x.b.nom)}</span></div>`;
}
function bKarta(x, tur) {
  const s = x.sozlama || {}, info = `${s.son || 15} savol · ${s.vaqt_s || 15} s${s.tur && s.tur !== 'tanlov' ? ' · ' + ((JTUR.find(t => t[0] === s.tur) || [])[1] || '') : ''}${s.xavf ? ' · 🔥 ×2' : ''}${x.turnir_id ? ' · 🏆 turnir' : ''}`;
  let amal = '', qator = `<span>🕕 ${bSana(x.vaqt)}</span><span>${info}</span>`;
  if (tur === 'kelgan') amal = `<button class="ha" onclick="bJavob(${x.id},'qabul')">✓ Qabul qilish</button>
      <button class="kichik-btn" onclick="bVaqtOch(${x.id})">🕘 Boshqa vaqt</button><button class="yoq" onclick="bJavob(${x.id},'rad')">✕ Rad etish</button>
      <div class="bt-vaqt" id="bV-${x.id}" style="display:none"><input type="datetime-local" id="bVi-${x.id}" value="${bLokal(x.vaqt)}"><button class="kichik-btn" onclick="bJavob(${x.id},'vaqt')">Taklif qilish</button></div>`;
  else if (tur === 'yuborilgan') { amal = `<button class="yoq" onclick="bBekor(${x.id})">Chaqiruvni bekor qilish</button>`; qator += `<span>raqib javobini kutyapmiz</span>`; }
  else if (tur === 'qabul') {
    qator += `<span>⏳ ${bQoldi(x.vaqt)}</span><span>🙋 ${x.qatnash} kishi «qatnashaman» dedi</span>`;
    amal = `<button class="ha" onclick="bOch(${x.id})">▶ Battle’ni ${x.oyin_id ? 'davom ettirish' : 'ochish'}</button>${x.turnir_id && KIM.rol === 'sardor' ? '' : `<button class="yoq" onclick="bBekor(${x.id})">Bekor qilish</button>`}`;
  } else if (tur === 'otdi') {
    const n = x.natija || {}, g = n.golib;
    qator = `<span>${bSana(x.vaqt)}</span><span>${g ? '🏆 ' + esc(g === x.a.gid ? x.a.nom : x.b.nom) + '-guruh g‘olib' : '🤝 Durang'}</span>${n.mvp ? `<span>⭐ MVP: ${esc(n.mvp.ism)} (${n.mvp.ball})</span>` : ''}
      <span>${n.a ? n.a.soni + ' : ' + n.b.soni + ' kishi' : ''}</span>`;
    amal = (x.menda.a || x.menda.b) && !x.turnir_id ? `<button class="kichik-btn" onclick="bRevansh(${x.id})">🔁 Revansh</button>` : '';
  }
  return `<div class="karta bt-k ${tur}">${bVS(x)}<div class="bt-info">${qator}</div>${amal ? `<div class="amal bt-amal">${amal}</div>` : ''}</div>`;
}
function bFormaOch(a, b) {
  const men = BD.menikilar === null ? BD.guruhlar.map(g => g.id) : BD.menikilar;
  BFORMA = { a: a || men[0], b: b || null, vaqt: bLokal() };
  battleChiz($('asosiyIchi'));
  setTimeout(() => { const f = $('bForma'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
}
function bRevansh(id) { const x = BD.battlelar.find(y => y.id === id); if (!x) return; const a = x.menda.a ? x.a.gid : x.b.gid; bFormaOch(a, a === x.a.gid ? x.b.gid : x.a.gid); }
function bSozTugma(k, v, n) { return `<button class="jt${BS[k] === v ? ' on' : ''}" onclick="BS.${k}=${typeof v === 'string' ? `'${v}'` : v};bSaqla();bFormaYangila()">${n}</button>`; }
function bFormaYangila() { const f = $('bForma'); if (f) { bFormaOqi(); f.innerHTML = bFormaHtml(); } }
function bFormaOqi() { if (!BFORMA) return; const a = $('bA'), b = $('bB'), v = $('bVaqt'); if (a) BFORMA.a = Number(a.value); if (b) BFORMA.b = Number(b.value) || null; if (v) BFORMA.vaqt = v.value; }
function bQismHtml(onclick) {
  return `<div class="jqism">${VOCAB.map((q, i) => `<button class="jq${BS.qism.includes(i) ? ' on' : ''}" onclick="${onclick}(${i})">${esc(jYorliq(q))}</button>`).join('')}</div>`;
}
function bQism(i) { BS.qism = BS.qism.includes(i) ? BS.qism.filter(x => x !== i) : BS.qism.concat(i); bSaqla(); bFormaYangila(); }
function bFormaHtml() {
  const men = BD.menikilar === null ? BD.guruhlar.map(g => g.id) : BD.menikilar, f = BFORMA, biz = bGuruh(f.a);
  const raqib = BD.guruhlar.filter(g => g.id !== f.a).sort((x, y) => ((x.univ === biz.univ && x.kurs === biz.kurs) ? 0 : 1) - ((y.univ === biz.univ && y.kurs === biz.kurs) ? 0 : 1));
  return `<div class="karta bt-forma"><h3>⚔️ Yangi chaqiruv</h3>
    <div class="bt-2"><div class="maydon"><label>Bizning guruh</label>${men.length === 1 ? `<div class="bt-sabit">${esc(guruhTol(biz))}</div><input type="hidden" id="bA" value="${f.a}">`
      : `<select id="bA" onchange="bFormaYangila()">${men.map(g => `<option value="${g}"${g === f.a ? ' selected' : ''}>${esc(guruhTol(bGuruh(g)))}</option>`).join('')}</select>`}</div>
      <div class="maydon"><label>Raqib guruh</label><select id="bB"><option value="">— tanlang —</option>${raqib.map(g => `<option value="${g.id}"${g.id === f.b ? ' selected' : ''}>${esc(guruhTol(g))}</option>`).join('')}</select></div></div>
    <div class="maydon"><label>Qachon (Toshkent vaqti)</label><input type="datetime-local" id="bVaqt" value="${esc(f.vaqt)}"></div>
    <div class="maydon"><label>Savollar — lug‘at qismlari <span class="jsana">${BS.qism.length ? jSozlar(BS.qism).length + ' ta so‘z' : '(tanlanmasa — battle ochilganda tanlaysiz)'}</span></label>${bQismHtml('bQism')}</div>
    <div class="bt-2"><div class="maydon"><label>Savollar soni</label><div class="jqator">${[10, 15, 20].map(n => bSozTugma('son', n, n)).join('')}</div></div>
      <div class="maydon"><label>Har savolga</label><div class="jqator">${[10, 15, 20].map(n => bSozTugma('vaqt_s', n, n + ' s')).join('')}</div></div></div>
    <div class="maydon"><label>Savollar orasidagi vaqt</label><div class="jqator">${ORALIQLAR.map(n => bSozTugma('oraliq', n, n + ' s')).join('')}</div></div>
    <div class="maydon"><label>Savol turi</label><div class="jqator">${JTUR.map(([k, n]) => bSozTugma('tur', k, n)).join('')}
      <button class="jt jbelgi${BS.xavf ? ' on' : ''}" onclick="BS.xavf=!BS.xavf;bSaqla();bFormaYangila()">🔥 ×2 tavakkal</button></div></div>
    <div class="jo-tugmalar" style="margin-top:10px"><button class="kichik-btn" onclick="BFORMA=null;battleChiz($('asosiyIchi'))">Bekor</button>
      <button class="asosiy-btn" style="width:auto" onclick="bChaqir()">⚔️ Chaqiruv yuborish</button></div><div class="xabar xato" id="bX"></div></div>`;
}
async function bChaqir() {
  bFormaOqi();
  const f = BFORMA, x = $('bX');
  if (!f.b) { x.textContent = 'Raqib guruhni tanlang'; return; }
  if (!f.vaqt) { x.textContent = 'Vaqtni belgilang'; return; }
  const d = await api('battle-chaqir', { a_gid: f.a, b_gid: f.b, vaqt: f.vaqt, sozlama: BS });
  if (!d.ok) { x.textContent = d.xato || 'Yuborib bo‘lmadi'; return; }
  BFORMA = null; battleChiz($('asosiyIchi'));
}
function bVaqtOch(id) { const e = $('bV-' + id); if (e) e.style.display = e.style.display === 'none' ? 'flex' : 'none'; }
async function bJavob(id, amal) {
  if (amal === 'rad' && !confirm('Chaqiruv rad etilsinmi?')) return;
  const d = await api('battle-javob', { id, amal, vaqt: amal === 'vaqt' ? ($('bVi-' + id) || {}).value : undefined });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  battleChiz($('asosiyIchi'));
}
async function bBekor(id) {
  if (!confirm('Battle bekor qilinsinmi?')) return;
  const d = await api('battle-bekor', { id });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  battleChiz($('asosiyIchi'));
}
// battle'ni ochish: savollar shu yerda tuziladi (lug'atdan) → jonli test ekrani
async function bOch(id) {
  const x = BD.battlelar.find(y => y.id === id); if (!x) return;
  const s = x.sozlama || {};
  let qism = (s.qism || []).filter(i => VOCAB[i]);
  if (!qism.length) qism = BS.qism.length ? BS.qism : VOCAB.map((_, i) => i);
  OyinOvoz.tayyorla();
  const sv = x.oyin_id ? [] : jSavollar(qism, s.son || 15, s.yon || 'ar-uz', s.tur || 'tanlov');
  const d = await api('battle-och', { id, savollar: sv.length ? sv : jSavollar(qism, 15, 'ar-uz', 'tanlov') });
  if (!d.ok) { alert((d.xato || 'Ochib bo‘lmadi') + (d.pin ? '\n\nPIN: ' + d.pin : '')); return; }
  oyinOch(d.oyin_id);
}

/* ---------------- turnir ---------------- */
let TG = [];
function tFormaHtml() {
  const men = (BD.menikilar === null ? BD.guruhlar.map(g => g.id) : BD.menikilar).map(bGuruh);
  return `<div class="karta bt-forma"><h3>🏆 Yangi turnir</h3>
    <div class="maydon"><label>Nomi</label><input id="tNom" placeholder="Masalan: 3-kurs kuzgi turniri"></div>
    <div class="maydon"><label>Qatnashadigan guruhlar <span class="jsana">${TG.length} ta</span></label>
      ${univlar(men).map(([u, ug]) => kurslar(ug).map(([k, gs]) => `<div class="kurs-kichik">${esc(univQisqa(u) ? univQisqa(u) + ' · ' : '')}${kursNom(k)}</div>
        <div class="jqism">${gs.map(g => `<button class="jq${TG.includes(g.id) ? ' on' : ''}" onclick="tGuruh(${g.id})">${esc(g.nom)}</button>`).join('')}</div>`).join('')).join('')}
      <div class="jizoh">2 dan 16 tagacha. Juftlar tanlangan tartibda tuziladi; soni 4, 8, 16 bo‘lmasa — ba’zi guruhlar birinchi bosqichdan juftsiz o‘tadi.</div></div>
    <div class="maydon"><label class="bt-check"><input type="checkbox" id="tAral" checked> Juftlarni tasodifiy tuzish (qur’a)</label></div>
    <div class="maydon"><label>Savollar — lug‘at qismlari</label>${bQismHtml('tQism')}</div>
    <div class="bt-2"><div class="maydon"><label>Savollar soni</label><div class="jqator">${[10, 15, 20].map(n => `<button class="jt${BS.son === n ? ' on' : ''}" onclick="BS.son=${n};bSaqla();battleChiz($('asosiyIchi'))">${n}</button>`).join('')}</div></div>
      <div class="maydon"><label>Har savolga</label><div class="jqator">${[10, 15, 20].map(n => `<button class="jt${BS.vaqt_s === n ? ' on' : ''}" onclick="BS.vaqt_s=${n};bSaqla();battleChiz($('asosiyIchi'))">${n} s</button>`).join('')}</div></div></div>
    <div class="maydon"><label>Savollar orasidagi vaqt</label><div class="jqator">${ORALIQLAR.map(n => `<button class="jt${(BS.oraliq || 7) === n ? ' on' : ''}" onclick="BS.oraliq=${n};bSaqla();battleChiz($('asosiyIchi'))">${n} s</button>`).join('')}</div></div>
    <button class="asosiy-btn" onclick="tYarat()">🏆 Turnirni boshlash</button><div class="xabar xato" id="tX"></div></div>`;
}
function tGuruh(id) { const n = $('tNom') ? $('tNom').value : ''; TG = TG.includes(id) ? TG.filter(x => x !== id) : TG.concat(id); battleChiz($('asosiyIchi')).then(() => { if ($('tNom')) $('tNom').value = n; }); }
function tQism(i) { BS.qism = BS.qism.includes(i) ? BS.qism.filter(x => x !== i) : BS.qism.concat(i); bSaqla(); battleChiz($('asosiyIchi')); }
async function tYarat() {
  const x = $('tX');
  if (TG.length < 2) { x.textContent = 'Kamida 2 ta guruh tanlang'; return; }
  const d = await api('turnir-yarat', { nom: $('tNom').value.trim(), guruhlar: TG, aralash: $('tAral').checked, sozlama: BS });
  if (!d.ok) { x.textContent = d.xato || 'Bo‘lmadi'; return; }
  TG = []; TFORMA = false; battleChiz($('asosiyIchi'));
}
const tRaundNom = (r, n) => { const q = n - r; return q === 1 ? 'Final' : q === 2 ? 'Yarim final' : q === 3 ? 'Chorak final' : (1 << (q - 1)) + '-bosqich'; };
function tHtml(t) {
  const R = t.raundlar, sardor = KIM.rol === 'sardor';
  return `<div class="karta tr-k"><div class="tr-bosh"><h3>🏆 ${esc(t.nom)}</h3><span class="jholat ${t.holat === 'tugadi' ? 'tugadi' : ''}">${t.holat === 'tugadi' ? 'Tugagan' : 'Davom etmoqda'}</span>
      ${!sardor && (KIM.rol === 'admin') ? `<button class="yoq" onclick="tOchir(${t.id})">O‘chirish</button>` : ''}</div>
    ${t.golib ? `<div class="tr-chemp">🏆 Chempion: <b>${esc((R[R.length - 1][0] || {})[(R[R.length - 1][0] || {}).golib === (R[R.length - 1][0] || {}).a ? 'aNom' : 'bNom'] || '')}-guruh</b></div>` : ''}
    <div class="tr-jadval">${R.map((r, ri) => `<div class="tr-ust"><h4>${tRaundNom(ri, R.length)}</h4>${r.map((m, mi) => tJuft(t, m, ri, mi)).join('')}</div>`).join('')}</div></div>`;
}
function tJuft(t, m, ri, mi) {
  const tom = (g, nom, b) => `<div class="${m.golib && m.golib === g ? 'g' : m.golib ? 'y' : ''}"><span>${g ? esc(nom) : ri === 0 ? '— juftsiz —' : '…'}</span><b>${m.ball ? m.ball[b] : ''}</b></div>`;
  let amal = '';
  const men = bMeniki(m.a) || bMeniki(m.b);
  if (m.a && m.b && !m.golib && men && t.holat !== 'tugadi') {
    const bt = m.battle;
    amal = `<div class="tr-amal">${bt ? `<small>🕕 ${bSana(bt.vaqt)}</small>` : ''}
      ${KIM.rol !== 'sardor' ? `<input type="datetime-local" id="tv-${t.id}-${ri}-${mi}" value="${bLokal(bt && bt.vaqt)}"><button class="kichik-btn" onclick="tVaqt(${t.id},${ri},${mi})">${bt ? 'Vaqtni o‘zgartirish' : '🕕 Vaqt belgilash'}</button>` : ''}
      ${bt && bt.holat === 'qabul' ? `<button class="ha" onclick="tOch(${bt.id})">▶ Ochish</button>` : ''}</div>`;
  }
  return `<div class="match">${tom(m.a, m.aNom, 'a')}${tom(m.b, m.bNom, 'b')}${amal}</div>`;
}
async function tVaqt(tid, r, m) {
  const v = ($('tv-' + tid + '-' + r + '-' + m) || {}).value;
  const d = await api('turnir-vaqt', { tid, r, m, vaqt: v });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  battleChiz($('asosiyIchi'));
}
async function tOch(bid) {
  // turnir battle'i ham oddiy battle kabi ochiladi
  if (!BD.battlelar.some(x => x.id === bid)) { const d = await api('battlelar'); if (d.ok) BD = d; }
  bOch(bid);
}
async function tOchir(tid) {
  if (!confirm('Turnir o‘chirilsinmi? Rejalashtirilgan battlelari bekor bo‘ladi.')) return;
  const d = await api('turnir-ochir', { tid });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  battleChiz($('asosiyIchi'));
}

/* ---------------- haftalik liga (kurs bo'yicha) ---------------- */
async function ligaOch(k, univ) {
  univ = univ || 'jtu';
  const d = await api('liga?kurs=' + k + '&univ=' + encodeURIComponent(univ));
  if (!d.ok) { alert(d.xato || 'Ochib bo‘lmadi'); return; }
  GURUH = null; KURS = null; LIGA = { k, univ };
  if (!$('eGuruh').classList.contains('faol')) ekran('eGuruh');
  $('gNom').textContent = '📅 ' + (univQisqa(univ) ? univQisqa(univ) + ' · ' : '') + kursNom(k) + ' · haftalik liga';
  $('gIzoh').textContent = d.hafta + '-hafta · tugashiga ' + bQoldi(d.tugash).replace(' qoldi', '');
  $('gTab').innerHTML = '';
  const j = d.joriy;
  $('gIchi').innerHTML = `<div class="eslatma">Har hafta (dushanba–yakshanba) guruhlar o‘rtacha ball bo‘yicha o‘zi saralanadi: guruhdagi har talabaga to‘g‘ri keladigan ball. Hafta tugagach g‘olib chatda e’lon qilinadi.</div>
    ${!j.length ? '<div class="bosh-bosh">Bu kursda tasdiqlangan talabasi bor guruh yo‘q.</div>' : `<div class="jadval-q"><table><tr><th>#</th><th>Guruh</th><th class="son">O‘rtacha ball</th><th class="son">Talabalar</th><th class="son">O‘tgan haftaga</th><th class="son">🏆 G‘alabalar</th></tr>
      ${j.map(x => `<tr><td class="orin">${x.orin <= 3 ? ['🥇', '🥈', '🥉'][x.orin - 1] : x.orin}</td><td><b>${esc(x.nom)}</b></td><td class="son"><b>${x.ball}</b></td><td class="son">${x.soni}</td>
        <td class="son">${x.trend > 0 ? `<span style="color:var(--green)">↑${x.trend}</span>` : x.trend < 0 ? `<span style="color:var(--red)">↓${-x.trend}</span>` : '='}</td>
        <td class="son">${'🏆'.repeat(Math.min(6, d.galaba[x.gid] || 0)) || '—'}</td></tr>`).join('')}</table></div>`}
    ${d.tarix.length ? `<div class="karta" style="margin-top:14px"><h3>Haftalar bo‘yicha g‘oliblar</h3><div class="jtegs">${d.tarix.slice().reverse().map(x => `<span class="jteg">${x.hafta}-hafta: <b>${esc(x.nom)}</b> (${x.ball})</span>`).join('')}</div></div>` : ''}`;
}

</script>
