<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ustoz kabineti</title>
<meta name="theme-color" content="#1a2238">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="ikon-ios.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Ustoz kabineti — ustozlar va admin uchun. Talabalar ko'rmaydi.
   Ranglar lug'at sahifasidagi bilan bir xil (mavzu.js). */
:root{
  --ink:#1a2238; --ink-soft:#4a5578; --paper:#faf9f6; --card:rgba(255,255,255,.92); --line:#e7e4dd;
  --amber:#c8811d; --amber-soft:#f7edda; --green:#2f7d5b; --green-soft:#e3f2ea;
  --red:#b5442f; --red-soft:#f8e6e2; --blue:#2b5c8a; --blue-soft:#e4eef7;
  --shadow:0 1px 3px rgba(26,34,56,.06),0 8px 24px rgba(26,34,56,.05);
  --kart:#fff; --kart2:#f4f2ee; --head-bg:rgba(250,249,246,.94);
  --t:#1f5f99; --t-grad:linear-gradient(135deg,#2f80c3,#1f5f99); --t-tile:#e3eef8; --t-matn:#1f5f99; --t-soya:rgba(31,95,153,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;
  padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.ar{font-family:'Amiri',serif;direction:rtl}
header{position:sticky;top:0;z-index:20;background:var(--head-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-inner{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0}
.head-txt h1{font-size:15px;font-weight:800}
.head-txt p{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:18px}
.ekran{display:none}.ekran.faol{display:block;animation:paydo .2s}
@keyframes paydo{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.kichik-btn{border:1px solid var(--line);background:var(--kart);color:var(--ink-soft);border-radius:11px;padding:8px 12px;
  font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
/* kirish */
.kirish{max-width:380px;margin:40px auto 0;text-align:center}
.kirish img{width:64px;height:64px;border-radius:16px;box-shadow:0 5px 16px rgba(26,34,56,.12);margin-bottom:10px;object-fit:cover}
.kirish h2{font-size:21px;font-weight:800;margin-bottom:3px}
.kirish p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.karta{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;
  background:var(--kart);color:var(--ink);outline:none}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--t-matn)}
.maydon{margin-bottom:10px;text-align:left}
.maydon label{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px}
/* parol: o'ng chetda ko'z — bosilsa yozilgani ko'rinadi */
.parol-q{position:relative}
.parol-q input{padding-right:48px}
.koz{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;background:none;
  color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.koz:hover{color:var(--ink)}
.koz .chiziq{display:none}
.koz.ochiq .chiziq{display:inline}
.asosiy-btn{width:100%;padding:13px;border:none;border-radius:13px;background:var(--t-grad);color:#fff;font-family:inherit;
  font-size:15px;font-weight:800;cursor:pointer}
.asosiy-btn:disabled{opacity:.55}
.xabar{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
.xabar.xato{color:var(--red)}.xabar.ok{color:var(--green)}
/* sarlavha va tablar */
.bosh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bosh h2{font-size:21px;font-weight:800;flex:1;min-width:200px}
.bosh .izoh{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.orqaga{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:6px}
.tablar{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tab{flex-shrink:0;border:1.5px solid var(--line);background:var(--kart);color:var(--ink-soft);border-radius:20px;padding:8px 14px;
  font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
.tab.on{background:var(--t);border-color:var(--t);color:#fff}
.tab .son{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;margin-left:5px}
/* guruh kartalari */
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gr{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.gr:active{transform:scale(.98)}
.gr .ik{width:44px;height:44px;border-radius:13px;background:var(--t-tile);display:grid;place-items:center;font-size:21px}
.gr b{font-size:16px;font-weight:800}
.gr span{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.gr .kut{color:var(--red);font-weight:800}
/* jadvallar */
.jadval-q{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--kart2);color:var(--ink-soft);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
td.son,th.son{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .ism{font-weight:800}td .tel{font-size:11.5px;color:var(--ink-soft)}
tr.bosiladi{cursor:pointer}tr.bosiladi:hover td{background:var(--t-tile)}
.orin{font-weight:800;color:var(--ink-soft);width:36px}
.foiz{font-weight:800}.foiz.y{color:var(--green)}.foiz.o{color:var(--amber)}.foiz.p{color:var(--red)}
.amal{display:flex;gap:6px;justify-content:flex-end}
.amal button{border:1px solid var(--line);background:var(--kart);border-radius:9px;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink)}
.amal .ha{background:var(--green);border-color:var(--green);color:#fff}
.amal .yoq{color:var(--red)}
.bosh-bosh{text-align:center;color:var(--ink-soft);padding:34px 16px;font-size:14px}
.filtr{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtr > *{flex:1;min-width:140px}
.excel{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.xato-soz{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.xato-soz:first-child{border-top:none}
.boshqaruv{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.boshqaruv h3{font-size:15px;font-weight:800;margin-bottom:10px}
.qator{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qator:first-of-type{border-top:none}
.qator .n{flex:1;font-weight:700;min-width:0}
.qator .n small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.belgi-q{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.belgi-q label{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.belgi-q input{width:auto}
.yang-btn .ik{display:inline-block;font-size:14px;line-height:1}
.yang-btn.ayl .ik{animation:aylan .7s linear infinite}
.yang-btn.tayyor{color:var(--green);border-color:var(--green)}
@keyframes aylan{to{transform:rotate(360deg)}}
@media (max-width:440px){.yang-btn .m{display:none}.yang-btn{padding:8px 11px}}
.univ-bosh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.univ-bosh:first-child{margin-top:0}
.univ-bosh h2{font-size:18.5px;font-weight:800;flex:1}
.univ-bosh .izoh{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.univ-kichik{font-size:12.5px;font-weight:800;color:var(--ink);margin:16px 0 2px}
.univ-kichik:first-child{margin-top:0}
.kurs-bosh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.kurs-bosh:first-child{margin-top:0}
.kurs-bosh h3{font-size:17px;font-weight:800}
.kurs-bosh .izoh{flex:1;font-size:12.5px;color:var(--ink-soft);font-weight:600}
.kurs-kichik{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--t-matn);margin:12px 0 4px}
.kurs-kichik:first-of-type{margin-top:0}
.bt-q{display:flex;flex-direction:column;gap:12px}
.bt-bosh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.bt-bosh>div{flex:1;min-width:220px}.bt-bosh h3{margin-bottom:2px}
.bt-sar{font-size:16px;font-weight:800;margin:10px 0 0;display:flex;align-items:center;gap:8px}
.bt-sar .son{background:var(--red);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.bt-k{padding:14px 16px}
.bt-k.kelgan{border:2px solid #f0cf6a;background:linear-gradient(135deg,#fffaf0,var(--card))}
.bt-vs{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.bt-g{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;padding:6px 16px;border-radius:13px;background:var(--kart2);border:2px solid var(--line)}
.bt-g.men{border-color:var(--t);color:var(--t-matn)}
.bt-g.gol{background:#f6c64f;border-color:#d4a23a;color:#1c1f4a}
.bt-g.gol::after{content:" 🏆"}
.bt-x{font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;color:var(--ink-soft)}
.bt-hisob{font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px}
.bt-info{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-top:10px}
.bt-amal{justify-content:center;margin-top:10px;flex-wrap:wrap}
.bt-vaqt{display:flex;gap:6px;width:100%;justify-content:center;margin-top:6px}.bt-vaqt input{max-width:240px}
.bt-forma{border:2px solid var(--t)}
.bt-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt-sabit{padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;font-weight:800;background:var(--kart2)}
.bt-check{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}.bt-check input{width:auto}
.tr-k{padding:14px 16px}
.tr-bosh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.tr-bosh h3{flex:1;margin:0}
.tr-chemp{background:#fff6d6;border:1.5px solid #f0cf6a;border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:10px;color:#4a3a08}
.tr-jadval{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px}
.tr-ust{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:190px;flex:1}
.tr-ust h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--t-matn);text-align:center}
.tr-k .match{background:var(--kart);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.tr-k .match>div:not(.tr-amal){display:flex;justify-content:space-between;padding:6px 10px;font-weight:700;font-size:13.5px}
.tr-k .match>div+div:not(.tr-amal){border-top:1px solid var(--line)}
.tr-k .match .g{background:var(--green-soft,#e2f6ec);color:#0f7a55}.tr-k .match .y{color:var(--ink-soft);opacity:.7}
.tr-amal{display:flex;flex-direction:column;gap:5px;padding:8px;border-top:1px dashed var(--line);background:var(--kart2)}
.tr-amal .ha{border:none;background:var(--green);color:#fff;border-radius:10px;padding:8px 12px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
.tr-amal small{font-size:11.5px;font-weight:700;color:var(--ink-soft)}.tr-amal input{padding:6px 8px;font-size:13px}
@media (max-width:640px){.bt-2{grid-template-columns:1fr}}
.sardor-b{display:inline-block;background:#f6c64f;color:#1c1f4a;border-radius:8px;padding:0 7px;font-size:11px;font-weight:800;vertical-align:1px}
.sardor-kod{background:#fff6d6;border:1.5px solid #f0cf6a;border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;color:#4a3a08}
.sardor-kod span{font-size:13px}.sardor-kod .sk-q{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.sardor-kod .sk-kod{font-family:monospace;font-size:18px;letter-spacing:.1em;background:#fff;padding:2px 8px;border-radius:8px}
.sardor-kod button{align-self:flex-start}
.sr-bosh{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.sr-bosh>div{flex:1;min-width:240px}.sr-bosh .izoh{display:block;margin-top:4px;line-height:1.45;font-size:13px;color:var(--ink-soft)}
.sr-bosh input{width:260px;max-width:100%;padding:9px 12px}
.sr-q{flex-wrap:wrap}.sr-q .sr-h{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.sr-q .sr-h small{font-size:12px;color:var(--ink-soft)}.sr-q .sr-h .sardor-b{align-self:flex-start}.sr-q .izoh{font-size:13px;color:var(--ink-soft)}.sr-q select{max-width:230px}
html[data-tun="1"] .sardor-kod{background:#3a2f0c;border-color:#7a6220;color:#ffe9a8}
.kurs-hamma-q{display:flex;align-items:center;gap:10px}
.kurs-hamma{width:auto;border:1.5px solid var(--line);background:var(--kart);color:var(--t-matn);border-radius:20px;padding:4px 11px;
  font-family:inherit;font-size:11.5px;font-weight:800;text-transform:none;letter-spacing:0;cursor:pointer}
.kurs-hamma::before{content:"☐ "}
.kurs-hamma.on{background:var(--t);border-color:var(--t);color:#fff}
.kurs-hamma.on::before{content:"✓ "}
.qator .kurs-sel{width:auto;padding:6px 8px;font-size:12.5px;border-radius:9px}
.sorov-q{background:var(--card);border:1.5px solid var(--amber);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sorov-q .sar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--amber-soft)}
.sorov-q .sar h3{font-size:16px;font-weight:800;flex:1;min-width:180px}
.sorov-q .sar .son{display:inline-block;min-width:24px;padding:1px 7px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;text-align:center;margin-left:6px}
.sorov-q .sar .ha-hammasi{border:none;background:var(--green);color:#fff;border-radius:11px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
.sorov-q .ichi{max-height:420px;overflow-y:auto}
.sorov-q .sr{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid var(--line)}
.sorov-q .kim{flex:1;min-width:170px}
.sorov-q .ism{font-weight:800}.sorov-q .tel{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.sorov-q .gr-nom{font-weight:800;white-space:nowrap;min-width:70px}.sorov-q .gr-nom small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700}
.sorov-q .amal button{padding:8px 12px}
@media (max-width:560px){.sorov-q .amal{width:100%}.sorov-q .amal button{flex:1}}
/* ---------- jonli test ---------- */
.jqism{display:flex;flex-wrap:wrap;gap:6px}
.jq,.jt{border:2px solid var(--line);background:var(--kart);color:var(--ink);border-radius:13px;padding:8px 12px;font-family:'Fredoka',inherit;
  font-size:14.5px;font-weight:600;cursor:pointer;min-width:46px;box-shadow:0 3px 0 var(--line)}
.jq.on,.jt.on{background:#f6c64f;border-color:#d4a23a;color:#1c1f4a;box-shadow:0 3px 0 #d4a23a}
.jqator{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.jqator input{width:90px;flex:none}
.jsoz-panel{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--kart2,#f7f5f0)}
.jsoz-ust{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.jsoz-ust input{flex:1;min-width:160px;padding:8px 11px}
.jsoz-q+.jsoz-q{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.jsoz-b{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}.jsoz-b span{font-size:12px;color:var(--ink-soft);font-weight:700;flex:1}.jsoz-b .jtoza{margin:0}
.jsoz-r{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto}
.jsoz{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:var(--kart,#fff);border-radius:10px;padding:4px 9px;cursor:pointer;font-family:inherit;color:var(--ink)}
.jsoz .ar{font-family:'Amiri',serif;font-size:19px;line-height:1.5}.jsoz small{font-size:11px;color:var(--ink-soft);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jsoz.on{border-color:var(--t,#2563eb);background:var(--t-soft,#e5edff);box-shadow:0 0 0 1px var(--t,#2563eb) inset}
.jtoza{border:none;background:none;color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;margin-top:6px}
.jsana{color:var(--t-matn);font-weight:800;margin-left:6px;text-transform:none}
.jholat{font-size:12px;font-weight:800;padding:4px 9px;border-radius:10px;white-space:nowrap;background:var(--kart2);color:var(--ink-soft)}
.jholat.kutish,.jholat.boshlandi{background:var(--amber-soft);color:var(--amber)}
.qator.bosiladi{cursor:pointer}.qator.bosiladi:hover .n{color:var(--t-matn)}
/* o'yin ekrani (oyin.css ustiga) */
html.oy-rejim,html.oy-rejim body{background-color:#eef1fc;background-image:radial-gradient(#cfd5ef 1.3px,transparent 1.5px);background-size:25px 25px;min-height:100vh}
html[data-tun="1"].oy-rejim,html[data-tun="1"].oy-rejim body{background-color:#11142b;background-image:radial-gradient(#272c55 1.3px,transparent 1.5px)}
html.oy-rejim body{background:none}
html.oy-rejim header{background:transparent;border-bottom-color:transparent;backdrop-filter:none}
#eOyin .markaz{text-align:center}
#eOyin h2{font-size:30px}#eOyin h3{font-size:22px}
.jo-asbob{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.jx-q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.jx-son{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-soft)}.jx-son input{width:100%;padding:9px 10px;font-size:17px;font-weight:800;text-align:center}.jx-son small{font-size:11.5px}
.jx-r{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;font-weight:700}.jx-r input{width:18px;height:18px}

   ============================================================ */
.oy{

  --o-chiz:#dde2f6; --o-soya:#d3d8ef; --o-sariq:#f6c64f; --o-sariq2:#d4a23a; --o-yashil:#16a070; --o-yashil2:#4a9d74;

}
html[data-tun="1"] .oy{
  --o-bg:#11142b; --o-nuqta:#272c55; --o-ink:#eef0ff; --o-soft:#a6acd8; --o-kart:#1b1f3f; --o-kart2:#22274b;
  --o-chiz:#2e3466; --o-soya:#0a0c1f; --o-sariq2:#b8882a;
}

.oy .ar{font-family:'Amiri',serif;direction:rtl;font-weight:700}

.oy-kart{background:var(--o-kart);border:2px solid var(--o-chiz);border-radius:28px;box-shadow:0 6px 0 var(--o-soya);padding:24px 22px}

.oy-nom{flex:1;min-width:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oy-nom small{display:block;font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:700;color:var(--o-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis}

.oy-label{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;margin:16px 0 8px}
.oy-input{width:100%;border:2px solid var(--o-chiz);background:var(--o-kart2);border-radius:18px;padding:16px 18px;font-family:'Fredoka',sans-serif;

.oy-pin-input{text-align:center;font-size:34px;font-weight:600;letter-spacing:.22em}

.oy-pin{display:inline-block;background:var(--o-sariq);box-shadow:0 7px 0 var(--o-sariq2);border-radius:26px;padding:8px 36px;

.oy-rq{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:2px solid var(--o-chiz);font-family:'Fredoka',sans-serif;font-weight:500;font-size:19px}

.oy-p-ball{font-size:14px;font-weight:800;color:var(--o-soft);margin:2px 0 10px}
.oy-foiz{color:var(--o-ink);font-weight:800}
.oy-p-ust{width:100%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:14px;

@keyframes oyKotar{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
/* konfetti */
.oy-konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}

  .oy-kart{padding:20px 16px;border-radius:24px}

}

    '#auKorinish .ok{width:100%;padding:15px;border:none;border-radius:15px;background:var(--t-grad);color:#fff;' +
    'font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer}';

  function cssQosh() {
    if (!document.head || document.getElementById('auKorinishCss')) return;
    var st = document.createElement('style'); st.id = 'auKorinishCss'; st.textContent = CSS;
    document.head.appendChild(st);
  }

  // rang tanlash oynasi
  function oyna(qayta) {
    var eski = document.getElementById('auKorinish');
    if (eski) eski.remove();
    var h = hozirgi();
    var o = document.createElement('div'); o.id = 'auKorinish';
    if (qayta) o.style.animation = 'none';
    o.innerHTML = '<div class="sh" role="dialog" aria-modal="true" aria-label="Ko‘rinish"><div class="tut"></div>' +
      '<div class="bosh"><div class="ik">🎨</div><div><h3>Ko‘rinish</h3><p>Sayt rangini o‘zingiz tanlang</p></div></div>' +
      '<div class="gr">' + MAVZULAR.map(function (m) {
        var on = m[0] === h.rang;
        return '<button class="rg' + (on ? ' on' : '') + '" data-rang="' + m[0] + '">' +
          '<div class="doira" style="background:linear-gradient(135deg,' + m[3][0] + ',' + m[3][1] + ')">' + (on ? '✓' : '') + '</div>' +
          '<b>' + m[1] + '</b></button>';
      }).join('') + '</div>' +
      '<button class="tun' + (h.tun ? ' on' : '') + '" data-tun="1"><span class="ti">🌙</span>' +
      '<span><b>Tungi rejim</b><small>Qorong‘i fon — kechqurun ko‘zni charchatmaydi</small></span>' +
      '<span class="sw"><i></i></span></button>' +
      '<button class="ok">Tayyor</button></div>';
    document.body.appendChild(o);
    o.addEventListener('click', function (e) {
      if (e.target === o || e.target.closest('.ok')) { o.remove(); return; }
      var r = e.target.closest('[data-rang]'), t = e.target.closest('[data-tun]');
      if (!r && !t) return;
      var s = hozirgi();
      if (r) s.rang = r.getAttribute('data-rang');
      if (t) s.tun = !s.tun;
      yoz(s); qoy(); oyna(true);  // darrov ko'rinadi
    });
  }

  try { cssQosh(); qoy(); } catch (e) {}
  window.auKorinish = function () { cssQosh(); oyna(); };
  window.auKorinishHozir = hozirgi;
  window.AU_MAVZULAR = MAVZULAR;
})();

</script>

const ILLAT  = [WAW, YA, ALIF, MAQ];

const isIllat = c => ILLAT.includes(c);

function verbType(root){
  const [r1,r2,r3] = root;
  const w1=isIllat(r1), w2=isIllat(r2), w3=isIllat(r3);

  const strong = rank(vowelOn) >= rank(vowelBefore) ? vowelOn : vowelBefore;
  if(strong===I) return HA_Y;

  const ch = [...w];

    let rest = ch.slice(i+1).filter(c=>!HARAKAT.includes(c));
    const isFinal = rest.length===0;

// unli bilan boshlanadigan qo'shimchalar (o'tgan zamon)
const PAST_VOWEL_SUF = ['3ms','3md','3mp','3fs','3fd'];
// hozirgi zamonda oxiri sukunli (qisqargan) kataklar
const PRES_SUKUN = ['3fp','2fp'];

const PAST_CONS_SUF = {           // undosh bilan boshlanuvchi (negiz sukunli)
  '3fp':NUN+A, '2ms':TA+A, '2md':TA+U+MIM+A+ALIF, '2mp':TA+U+MIM+S,
  '2fs':TA+I, '2fd':TA+U+MIM+A+ALIF, '2fp':TA+U+NUN+W+A, '1s':TA+U, '1p':NUN+A+ALIF
};
const PRES_PERSON = {'3ms':YA,'3md':YA,'3mp':YA,'3fs':TA,'3fd':TA,'3fp':YA,
  '2ms':TA,'2md':TA,'2mp':TA,'2fs':TA,'2fd':TA,'2fp':TA,'1s':HA_A,'1p':NUN};
const PRES_END = {
  raf:{'3ms':U,'3md':A+ALIF+NUN+I,'3mp':U+WAW+NUN+A,'3fs':U,'3fd':A+ALIF+NUN+I,'3fp':S+NUN+A,
       '2ms':U,'2md':A+ALIF+NUN+I,'2mp':U+WAW+NUN+A,'2fs':I+YA+NUN+A,'2fd':A+ALIF+NUN+I,'2fp':S+NUN+A,'1s':U,'1p':U},
  nasb:{'3ms':A,'3md':A+ALIF,'3mp':U+WAW+ALIF,'3fs':A,'3fd':A+ALIF,'3fp':S+NUN+A,
       '2ms':A,'2md':A+ALIF,'2mp':U+WAW+ALIF,'2fs':I+YA,'2fd':A+ALIF,'2fp':S+NUN+A,'1s':A,'1p':A},
  jazm:{'3ms':S,'3md':A+ALIF,'3mp':U+WAW+ALIF,'3fs':S,'3fd':A+ALIF,'3fp':S+NUN+A,
       '2ms':S,'2md':A+ALIF,'2mp':U+WAW+ALIF,'2fs':I+YA,'2fd':A+ALIF,'2fp':S+NUN+A,'1s':S,'1p':S}
};

/* ================================================================
   I  BOB
   ================================================================ */

/* --- ajvaf yordamchilari --- */
function ajvafMid(root, presV){          // uzun unli harfi va harakati
  const r2 = root[1];
  if(presV==='u') return {v:U, ch:WAW};
  if(presV==='i') return {v:I, ch:YA};
  return {v:A, ch:ALIF};                 // a-tur: يَخَافُ
}
function ajvafShort(root, presV){        // qisqargan holatdagi unli
  if(presV==='u') return U;              // قُلْ، قُلْنَ
  return I;                              // بِعْ، خَفْ→(a-turda fatha, pastda alohida)
}

/* --- noqis turi --- */
function noqisKind(root, pastV, presV){
  if(presV==='a') return 'a';            // يَرْضَى / يَلْقَى
  if(presV==='u') return 'u';            // يَدْعُو
  return 'i';                            // يَرْمِي
}

/* ---------------- O'TGAN ZAMON — I bob ---------------- */
function past1(o, cell){
  const {root, pastV='a', presV='u', voice='aniq'} = o;
  const [r1,r2,r3] = root;
  const t = verbType(root);
  const V  = voice==='aniq' ? {c1:A, c2:{a:A,u:U,i:I}[pastV]} : {c1:U, c2:I};
  const suf = PAST_CONS_SUF[cell];
  const isVow = PAST_VOWEL_SUF.includes(cell);

  /* --- MUDO'AF --- */
  if(t==='mudoaf'){
    if(isVow){
      const base = r1+V.c1 + r2+W;
      return {'3ms':base+A, '3md':base+A+ALIF, '3mp':base+U+WAW+ALIF,
              '3fs':base+A+TA+S, '3fd':base+A+TA+A+ALIF}[cell];
    }
    return r1+V.c1 + r2+V.c2 + r3+S + suf;
  }

  /* --- AJVAF --- */
  if(t==='ajvaf'){
    if(isVow){
      const base = voice==='aniq' ? r1+A+ALIF+r3 : r1+I+YA+r3;
      return {'3ms':base+A, '3md':base+A+ALIF, '3mp':base+U+WAW+ALIF,
              '3fs':base+A+TA+S, '3fd':base+A+TA+A+ALIF}[cell];
    }
    const sv = voice==='aniq' ? ajvafShort(root,presV) : I;
    return r1+sv + r3+S + suf;
  }

  /* --- NOQIS / LAFIF --- */
  if(t==='noqis'||t==='lafif-maqrun'||t==='lafif-mafruq'){
    const wawRoot = (r3===WAW);
    const iPast = (pastV==='i');
    const head = r1+V.c1 + r2;           // r2 harakati pastda qo'yiladi
    if(voice==='majhul' || iPast){        // رَضِيَ / دُعِيَ tipi
      const h = r1+V.c1 + r2 + (voice==='majhul'?I:I);
      if(isVow) return {'3ms':h+YA+A, '3md':h+YA+A+ALIF, '3mp':r1+V.c1+r2+U+WAW+ALIF,
                        '3fs':h+YA+A+TA+S, '3fd':h+YA+A+TA+A+ALIF}[cell];
      return h + (cell==='3fp' ? YA+NUN+A : YA+suf);
    }
    if(wawRoot){                          // دَعَا
      if(isVow) return {'3ms':head+A+ALIF, '3md':head+A+WAW+A+ALIF, '3mp':head+A+WAW+S+ALIF,
                        '3fs':head+A+TA+S, '3fd':head+A+TA+A+ALIF}[cell];
      return head+A+WAW+S + suf;
    }
    // رَمَى
    if(isVow) return {'3ms':head+A+MAQ, '3md':head+A+YA+A+ALIF, '3mp':head+A+WAW+S+ALIF,
                      '3fs':head+A+TA+S, '3fd':head+A+TA+A+ALIF}[cell];
    return head+A+YA+S + suf;
  }

  /* --- SOLIM / MISOL / MAHMUZ (o'tgan zamonda solim kabi) --- */
  const stem = r1+V.c1 + r2+V.c2 + r3;
  const out = isVow
    ? {'3ms':stem+A, '3md':stem+A+ALIF, '3mp':stem+U+WAW+ALIF,
       '3fs':stem+A+TA+S, '3fd':stem+A+TA+A+ALIF}[cell]
    : r1+V.c1 + r2+V.c2 + r3+S + suf;
  return fixMadda(out);
}

/* ---------------- HOZIRGI-KELASI — I bob ---------------- */
function pres1(o, cell, mayl='aniqlik'){
  const {root, pastV='a', presV='u', voice='aniq'} = o;
  const [r1,r2,r3] = root;
  const t = verbType(root);
  const pre = PRES_PERSON[cell];
  const preV = voice==='aniq' ? A : U;
  const key = mayl==='istak'?'nasb' : mayl==='shart'?'jazm' : 'raf';
  const end = PRES_END[key][cell];
  const pv = voice==='aniq' ? {a:A,u:U,i:I}[presV] : A;

  /* --- MUDO'AF --- */
  if(t==='mudoaf'){
    if(PRES_SUKUN.includes(cell))                       // يَمْدُدْنَ
      return pre+preV + r1+S + r2+pv + r3+S+NUN+A;
    if(key==='jazm' && !['3md','3mp','2md','2mp','2fs','3fd','2fd'].includes(cell))
      return pre+preV + r1+pv + r2+W+A;                 // يَمُدَّ
    return pre+preV + r1+pv + r2+W + end;
  }

  /* --- MISOL --- */
  if(t==='misol'){
    const dropW = voice==='aniq' && r1===WAW &&
      (presV==='i' || (presV==='a' && pastV==='a'));
    if(dropW){
      // و tushadi: يَصِلُ ، يَضَعُ
      if(PRES_SUKUN.includes(cell)) return pre+A + r2+pv + r3+S+NUN+A;
      return pre+A + r2+pv + r3 + end;
    }
    // و/ي saqlanadi (majhulda ham): يَوْجَلُ ، يُوعَدُ
    const first = (voice==='majhul' && r1===WAW) ? WAW : r1;
    const body = (voice==='majhul' && r1===WAW) ? WAW : r1+S;
    if(voice==='majhul' && r1===WAW){
      if(PRES_SUKUN.includes(cell)) return pre+U + WAW + r2+A + r3+S+NUN+A;
      return pre+U + WAW + r2+A + r3 + end;
    }
    if(PRES_SUKUN.includes(cell)) return pre+preV + r1+S + r2+pv + r3+S+NUN+A;
    return pre+preV + r1+S + r2+pv + r3 + end;
  }

  /* --- AJVAF --- */
  if(t==='ajvaf'){
    if(voice==='majhul'){
      if(PRES_SUKUN.includes(cell)) return pre+U + r1+A + r3+S+NUN+A;
      if(key==='jazm' && [ '3ms','3fs','2ms','1s','1p'].includes(cell))
        return pre+U + r1+A + r3+S;
      return pre+U + r1+A+ALIF + r3 + end;
    }
    const m = ajvafMid(root, presV);
    const sv = presV==='a' ? A : ajvafShort(root, presV);
    if(PRES_SUKUN.includes(cell))                        // يَقُلْنَ ، يَخَفْنَ
      return pre+A + r1+sv + r3+S+NUN+A;
    if(key==='jazm' && ['3ms','3fs','2ms','1s','1p'].includes(cell))
      return pre+A + r1+sv + r3+S;                       // يَقُلْ
    return pre+A + r1+m.v + m.ch + r3 + end;
  }

  /* --- NOQIS / LAFIF --- */
  if(t==='noqis'||t==='lafif-maqrun'||t==='lafif-mafruq'){
    const drop = (t==='lafif-mafruq' && r1===WAW && voice==='aniq');
    const head = drop ? pre+A + r2 : pre+preV + r1+S + r2;   // يَقِي  /  يَرْمِي
    const kind = voice==='majhul' ? 'a' : noqisKind(root,pastV,presV);
    return noqisEnd(head, kind, cell, key);
  }

  /* --- SOLIM / MAHMUZ --- */
  let out;
  if(PRES_SUKUN.includes(cell)) out = pre+preV + r1+S + r2+pv + r3+S+NUN+A;
  else out = pre+preV + r1+S + r2+pv + r3 + end;
  return fixMadda(out);
}

/* noqis oxirlari: head = ... r2 gacha (harakatsiz) */
function noqisEnd(head, kind, cell, key){
  if(kind==='u'){                        // يَدْعُو
    const T={ raf:{'3ms':U+WAW,'3md':U+WAW+A+ALIF+NUN+I,'3mp':U+WAW+NUN+A,
                   '3fs':U+WAW,'3fd':U+WAW+A+ALIF+NUN+I,'3fp':U+WAW+NUN+A,
                   '2ms':U+WAW,'2md':U+WAW+A+ALIF+NUN+I,'2mp':U+WAW+NUN+A,
                   '2fs':I+YA+NUN+A,'2fd':U+WAW+A+ALIF+NUN+I,'2fp':U+WAW+NUN+A,'1s':U+WAW,'1p':U+WAW},
             nasb:{'3ms':U+WAW+A,'3md':U+WAW+A+ALIF,'3mp':U+WAW+ALIF,
                   '3fs':U+WAW+A,'3fd':U+WAW+A+ALIF,'3fp':U+WAW+NUN+A,
                   '2ms':U+WAW+A,'2md':U+WAW+A+ALIF,'2mp':U+WAW+ALIF,
                   '2fs':I+YA,'2fd':U+WAW+A+ALIF,'2fp':U+WAW+NUN+A,'1s':U+WAW+A,'1p':U+WAW+A},
             jazm:{'3ms':U,'3md':U+WAW+A+ALIF,'3mp':U+WAW+ALIF,
                   '3fs':U,'3fd':U+WAW+A+ALIF,'3fp':U+WAW+NUN+A,
                   '2ms':U,'2md':U+WAW+A+ALIF,'2mp':U+WAW+ALIF,
                   '2fs':I+YA,'2fd':U+WAW+A+ALIF,'2fp':U+WAW+NUN+A,'1s':U,'1p':U} };
    return head + T[key][cell];
  }
  if(kind==='i'){                        // يَرْمِي
    const T={ raf:{'3ms':I+YA,'3md':I+YA+A+ALIF+NUN+I,'3mp':U+WAW+NUN+A,
                   '3fs':I+YA,'3fd':I+YA+A+ALIF+NUN+I,'3fp':I+YA+NUN+A,
                   '2ms':I+YA,'2md':I+YA+A+ALIF+NUN+I,'2mp':U+WAW+NUN+A,
                   '2fs':I+YA+NUN+A,'2fd':I+YA+A+ALIF+NUN+I,'2fp':I+YA+NUN+A,'1s':I+YA,'1p':I+YA},
             nasb:{'3ms':I+YA+A,'3md':I+YA+A+ALIF,'3mp':U+WAW+ALIF,
                   '3fs':I+YA+A,'3fd':I+YA+A+ALIF,'3fp':I+YA+NUN+A,
                   '2ms':I+YA+A,'2md':I+YA+A+ALIF,'2mp':U+WAW+ALIF,
                   '2fs':I+YA,'2fd':I+YA+A+ALIF,'2fp':I+YA+NUN+A,'1s':I+YA+A,'1p':I+YA+A},
             jazm:{'3ms':I,'3md':I+YA+A+ALIF,'3mp':U+WAW+ALIF,
                   '3fs':I,'3fd':I+YA+A+ALIF,'3fp':I+YA+NUN+A,
                   '2ms':I,'2md':I+YA+A+ALIF,'2mp':U+WAW+ALIF,
                   '2fs':I+YA,'2fd':I+YA+A+ALIF,'2fp':I+YA+NUN+A,'1s':I,'1p':I} };
    return head + T[key][cell];
  }
  // kind 'a'  →  يَرْضَى / يَلْقَى / يُبْكَى
  const T={ raf:{'3ms':A+MAQ,'3md':A+YA+A+ALIF+NUN+I,'3mp':A+WAW+S+NUN+A,
                 '3fs':A+MAQ,'3fd':A+YA+A+ALIF+NUN+I,'3fp':A+YA+S+NUN+A,
                 '2ms':A+MAQ,'2md':A+YA+A+ALIF+NUN+I,'2mp':A+WAW+S+NUN+A,
                 '2fs':A+YA+S+NUN+A,'2fd':A+YA+A+ALIF+NUN+I,'2fp':A+YA+S+NUN+A,'1s':A+MAQ,'1p':A+MAQ},
           nasb:{'3ms':A+MAQ,'3md':A+YA+A+ALIF,'3mp':A+WAW+S+ALIF,
                 '3fs':A+MAQ,'3fd':A+YA+A+ALIF,'3fp':A+YA+S+NUN+A,
                 '2ms':A+MAQ,'2md':A+YA+A+ALIF,'2mp':A+WAW+S+ALIF,
                 '2fs':A+YA+S,'2fd':A+YA+A+ALIF,'2fp':A+YA+S+NUN+A,'1s':A+MAQ,'1p':A+MAQ},
           jazm:{'3ms':A,'3md':A+YA+A+ALIF,'3mp':A+WAW+S+ALIF,
                 '3fs':A,'3fd':A+YA+A+ALIF,'3fp':A+YA+S+NUN+A,
                 '2ms':A,'2md':A+YA+A+ALIF,'2mp':A+WAW+S+ALIF,
                 '2fs':A+YA+S,'2fd':A+YA+A+ALIF,'2fp':A+YA+S+NUN+A,'1s':A,'1p':A} };
  return head + T[key][cell];
}

/* ---------------- BUYRUQ MAYLI — I bob ---------------- */
function amr1(o, cell){
  const {root, pastV='a', presV='u'} = o;
  const [r1,r2,r3] = root;
  const t = verbType(root);
  const jazm = pres1({...o, voice:'aniq'}, cell, 'shart');
  if(!jazm) return null;
  let body = jazm.slice(2);                      // shaxs qo'shimchasini olib tashlaymiz

  // 1) negiz unli bilan boshlansa — vasl hamza kerak emas
  if(t==='ajvaf' || (t==='misol' && r1===WAW &&
      (presV==='i'||(presV==='a'&&pastV==='a'))) ||
     (t==='lafif-mafruq' && r1===WAW))
    return body;

  // 2) misol — و saqlangan: اِيجَلْ
  if(t==='misol' && r1===WAW) return ALIF+I + YA + body.slice(2);

  // 3) mudo'af: مُدَّ
  if(t==='mudoaf'){
    const pv = {a:A,u:U,i:I}[presV];
    if(['2md','2mp','2fs'].includes(cell)) return r1+pv + body.slice(body.indexOf(r2));
    if(cell==='2fp') return ALIF+U + r1+S + r2+pv + r3+S+NUN+A;
    return r1+pv + r2+W+A;
  }

  // 4) mahmuz — mashhur istisnolar
  const key = r1+r2+r3;
  // أخذ ، أكل ، أمر — amrda boshidagi hamza butunlay tushadi va bu
  // barcha shaxsda shunday: خُذْ ، خُذِي ، خُذَا ، خُذُوا ، خُذْنَ
  const IRR = ['\u0623\u062E\u0630','\u0623\u0643\u0644','\u0623\u0645\u0631'];
  if(IRR.includes(key)) return body.slice(2);

  // 5) qolganlari — vasl hamza
  const v = presV==='u' ? U : I;
  return ALIF + v + body;
}

/* ================================================================
   II–X BOBLAR  (solim asosida; ajvaf/noqis uchun tuzatish)
   ================================================================ */
function derivedPastStem(bob, r, voice, pastV){
  const [r1,r2,r3]=r;
  if(voice==='aniq') switch(bob){
    case 'II':return r1+A+r2+W+A+r3;                case 'III':return r1+A+ALIF+r2+A+r3;
    case 'IV':return HA_A+A+r1+S+r2+A+r3;           case 'V':return TA+A+r1+A+r2+W+A+r3;
    case 'VI':return TA+A+r1+A+ALIF+r2+A+r3;        case 'VII':return ALIF+I+NUN+S+r1+A+r2+A+r3;
    case 'VIII':return ALIF+I+r1+S+TA+A+r2+A+r3;    case 'IX':return ALIF+I+r1+S+r2+A+r3+W;
    case 'X':return ALIF+I+SIN+S+TA+A+r1+S+r2+A+r3;
  } else switch(bob){
    case 'II':return r1+U+r2+W+I+r3;                case 'III':return r1+U+WAW+r2+I+r3;
    case 'IV':return HA_A+U+r1+S+r2+I+r3;           case 'V':return TA+U+r1+U+r2+W+I+r3;
    case 'VI':return TA+U+r1+U+WAW+r2+I+r3;         case 'VIII':return ALIF+U+r1+S+TA+U+r2+I+r3;
    case 'X':return ALIF+U+SIN+S+TA+U+r1+S+r2+I+r3; default:return null;
  }
}
function derivedPresStem(bob, r, voice){
  const [r1,r2,r3]=r;
  if(voice==='aniq') switch(bob){
    case 'II':return r1+A+r2+W+I+r3;                case 'III':return r1+A+ALIF+r2+I+r3;
    case 'IV':return r1+S+r2+I+r3;                  case 'V':return TA+A+r1+A+r2+W+A+r3;
    case 'VI':return TA+A+r1+A+ALIF+r2+A+r3;        case 'VII':return NUN+S+r1+A+r2+I+r3;
    case 'VIII':return r1+S+TA+A+r2+I+r3;           case 'IX':return r1+S+r2+A+r3+W;
    case 'X':return SIN+S+TA+A+r1+S+r2+I+r3;
  } else switch(bob){
    case 'II':return r1+A+r2+W+A+r3;                case 'III':return r1+A+ALIF+r2+A+r3;
    case 'IV':return r1+S+r2+A+r3;                  case 'V':return TA+A+r1+A+r2+W+A+r3;
    case 'VI':return TA+A+r1+A+ALIF+r2+A+r3;        case 'VIII':return r1+S+TA+A+r2+A+r3;
    case 'X':return SIN+S+TA+A+r1+S+r2+A+r3;        default:return null;
  }
}
function derivedPresPreV(bob, voice){
  if(voice==='majhul') return U;
  return (bob==='II'||bob==='III'||bob==='IV') ? U : A;
}

/* hosila boblarda ajvaf: faqat IV, VII, VIII, X o'zgaradi */
const AJVAF_DERIVED = ['IV','VII','VIII','X'];
function derivedPrefix(bob, r, voice){          // o'zakdan oldingi qism
  const [r1]=r;
  if(voice==='aniq') switch(bob){
    case 'IV': return HA_A+A+r1+S;
    case 'VII': return ALIF+I+NUN+S+r1+A;
    case 'VIII': return ALIF+I+r1+S+TA+A;
    case 'X': return ALIF+I+SIN+S+TA+A+r1+S;
  } else switch(bob){
    case 'IV': return HA_A+U+r1+S;
    case 'VIII': return ALIF+U+r1+S+TA+U;
    case 'X': return ALIF+U+SIN+S+TA+U+r1+S;
    default: return null;
  }
}
function pastDerived(o, cell){
  const {bob, root, voice='aniq'} = o;
  const [r1,r2,r3]=root;
  const t = verbType(root);
  const isVow = PAST_VOWEL_SUF.includes(cell);

  /* --- mudo'af: IV, VII, VIII, X --- */
  if(t==='mudoaf' && AJVAF_DERIVED.includes(bob) && voice==='aniq'){
    const L = {'IV':HA_A+A+r1+A, 'VII':ALIF+I+NUN+S+r1+A,
               'VIII':ALIF+I+r1+S+TA+A, 'X':ALIF+I+SIN+S+TA+A+r1+A}[bob];
    const Sh= {'IV':HA_A+A+r1+S, 'VII':ALIF+I+NUN+S+r1+A,
               'VIII':ALIF+I+r1+S+TA+A, 'X':ALIF+I+SIN+S+TA+A+r1+S}[bob];
    if(isVow){
      const b = L+r2+W;
      return {'3ms':b+A,'3md':b+A+ALIF,'3mp':b+U+WAW+ALIF,
              '3fs':b+A+TA+S,'3fd':b+A+TA+A+ALIF}[cell];
    }
    return Sh+r2+A+r3+S+PAST_CONS_SUF[cell];
  }

  /* --- ajvaf: IV, VII, VIII, X --- */
  if((t==='ajvaf') && AJVAF_DERIVED.includes(bob)){
    let pre;
    if(voice==='aniq'){
      pre = {'IV':HA_A+A+r1, 'VII':ALIF+I+NUN+S+r1,
             'VIII':ALIF+I+r1+S+TA, 'X':ALIF+I+SIN+S+TA+A+r1}[bob];
      if(isVow){
        const b = pre+A+ALIF+r3;
        return {'3ms':b+A,'3md':b+A+ALIF,'3mp':b+U+WAW+ALIF,
                '3fs':b+A+TA+S,'3fd':b+A+TA+A+ALIF}[cell];
      }
      return pre+A+r3+S+PAST_CONS_SUF[cell];
    }
    pre = {'IV':HA_A+U+r1, 'VIII':ALIF+U+r1+S+TA,
           'X':ALIF+U+SIN+S+TA+U+r1}[bob];
    if(!pre) return null;
    if(isVow){
      const b = pre+I+YA+r3;
      return {'3ms':b+A,'3md':b+A+ALIF,'3mp':b+U+WAW+ALIF,
              '3fs':b+A+TA+S,'3fd':b+A+TA+A+ALIF}[cell];
    }
    return pre+I+r3+S+PAST_CONS_SUF[cell];
  }

  const st = derivedPastStem(bob, root, voice);
  if(!st) return null;

  /* --- noqis / lafif: oxiri zaif --- */
  if(['noqis','lafif-maqrun','lafif-mafruq'].includes(t)){
    const head = st.slice(0, st.lastIndexOf(r3));       // r3 dan oldingi qism
    if(voice==='majhul'){                               // أُدِّيَ
      const h = head.replace(/[\u064E\u064F\u0650]$/, I);
      if(isVow) return {'3ms':h+YA+A,'3md':h+YA+A+ALIF,'3mp':head.replace(/[\u064E\u064F\u0650]$/,U)+WAW+ALIF,
                        '3fs':h+YA+A+TA+S,'3fd':h+YA+A+TA+A+ALIF}[cell];
      return h+YA+ (cell==='3fp'? NUN+A : PAST_CONS_SUF[cell]);
    }
    if(isVow) return {'3ms':head+MAQ,'3md':head+YA+A+ALIF,'3mp':head.replace(/[\u064E]$/,A)+WAW+S+ALIF,
                      '3fs':head+TA+S,'3fd':head+TA+A+ALIF}[cell];
    return head+YA+S + PAST_CONS_SUF[cell];
  }

  const out = isVow
    ? st + {'3ms':A,'3md':A+ALIF,'3mp':U+WAW+ALIF,'3fs':A+TA+S,'3fd':A+TA+A+ALIF}[cell]
    : st + S + PAST_CONS_SUF[cell];
  return fixMadda(out);
}
function presDerived(o, cell, mayl='aniqlik'){
  const {bob, root, voice='aniq'} = o;
  const [r1,r2,r3]=root;
  const t = verbType(root);
  const key = mayl==='istak'?'nasb' : mayl==='shart'?'jazm' : 'raf';
  const preV = derivedPresPreV(bob, voice);
  const pre = PRES_PERSON[cell] + preV;

  /* --- mudo'af: IV, VII, VIII, X --- */
  if(t==='mudoaf' && AJVAF_DERIVED.includes(bob) && voice==='aniq'){
    const L = {'IV':r1+I, 'VII':NUN+S+r1+A, 'VIII':r1+S+TA+A, 'X':SIN+S+TA+A+r1+I}[bob];
    const Sh= {'IV':r1+S, 'VII':NUN+S+r1+A, 'VIII':r1+S+TA+A, 'X':SIN+S+TA+A+r1+S}[bob];
    const pv2 = bob==='IV' ? U : A;
    const pre2 = PRES_PERSON[cell] + pv2;
    if(PRES_SUKUN.includes(cell)) return pre2+Sh+r2+I+r3+S+NUN+A;
    if(key==='jazm' && ['3ms','3fs','2ms','1s','1p'].includes(cell))
      return pre2+L+r2+W+A;
    return pre2+L+r2+W+PRES_END[key][cell];
  }

  /* --- ajvaf: IV, VII, VIII, X --- */
  if(t==='ajvaf' && AJVAF_DERIVED.includes(bob)){
    const body = {'IV':r1, 'X':SIN+S+TA+A+r1, 'VII':NUN+S+r1, 'VIII':r1+S+TA}[bob];
    let midV, midCh, shortV, pv;
    if(voice==='majhul'){
      if(bob==='VII') return null;
      midV=A; midCh=ALIF; shortV=A; pv=U;
    } else if(bob==='IV'||bob==='X'){ midV=I; midCh=YA; shortV=I; pv=(bob==='IV'?U:A); }
    else { midV=A; midCh=ALIF; shortV=A; pv=A; }
    const pre2 = PRES_PERSON[cell] + pv;
    if(PRES_SUKUN.includes(cell)) return pre2+body+shortV+r3+S+NUN+A;
    if(key==='jazm' && ['3ms','3fs','2ms','1s','1p'].includes(cell))
      return pre2+body+shortV+r3+S;
    return pre2+body+midV+midCh+r3+PRES_END[key][cell];
  }

  const st = derivedPresStem(bob, root, voice);
  if(!st) return null;

  /* --- noqis / lafif --- */
  if(['noqis','lafif-maqrun','lafif-mafruq'].includes(t)){
    const head = st.slice(0, st.lastIndexOf(r3));
    const aType = (voice==='majhul') || ['V','VI'].includes(bob);
    const kind = aType ? 'a' : 'i';
    const h = head.replace(/[\u064E\u064F\u0650]$/, '');
    return noqisEnd(pre + h, kind, cell, key);
  }

  let out = pre + st + PRES_END[key][cell];
  if(bob==='IX' && key==='jazm') out = out.replace(new RegExp(root[2]+W+S+'$'), root[2]+I+root[2]+S);
  return fixMadda(out);
}
function amrDerived(o, cell){
  const {bob, root} = o;
  const jazm = presDerived({...o, voice:'aniq'}, cell, 'shart');
  if(!jazm) return null;
  const body = jazm.slice(2);
  if(['II','III','V','VI'].includes(bob)) return body;
  if(bob==='IV') return HA_A+A+body;
  return ALIF+I+body;
}

/* ================================================================
   UMUMIY KIRISH NUQTALARI
   ================================================================ */
function conjugate(o, cell){
  const zamon = o.zamon||'otgan', mayl = o.mayl||'aniqlik', bob = o.bob||'I';
  let r;
  if(mayl==='buyruq') return imperative(o, cell);
  if(bob==='I') r = zamon==='otgan' ? past1(o,cell) : pres1(o,cell,mayl);
  else r = zamon==='otgan' ? pastDerived(o,cell) : presDerived(o,cell,mayl);
  if(r && isRaRoot(o.root) && (bob==='IV' || (bob==='I' && zamon!=='otgan')))
    r = elideRa(r);
  if(r && isNunFinal(o.root)) r = idgamNun(r);
  return r ? fixMadda(reseatHamza(r)) : null;
}
/* Ulovchi hamzadan keyin sukunli hamza kelsa, u cho'ziq unliga aylanadi:
   اِئْتِ → اِيتِ ، اُؤْمُرْ → اُومُرْ. Ikkala yozuv ham ishlatiladi, shuning
   uchun asl shakl `imperativeAsl` orqali alohida olinadi.              */
function softenAmrHamza(w){
  return w.replace(new RegExp('^'+ALIF+I+HA_Y+S), ALIF+I+YA)
          .replace(new RegExp('^'+ALIF+U+HA_W+S), ALIF+U+WAW)
          .replace(new RegExp('^'+ALIF+I+HA_A+S), ALIF+I+YA)
          .replace(new RegExp('^'+ALIF+U+HA_A+S), ALIF+U+WAW);
}
function imperativeAsl(o, cell){
  if(!AMR_CELLS.includes(cell)) return null;
  const bob = o.bob||'I';
  let r = bob==='I' ? amr1(o,cell) : amrDerived(o,cell);
  if(r && isRaRoot(o.root)){
    r = elideRa(r);
    // hamza tushgach negiz unli bilan boshlanadi — ulovchi alif kerak emas
    if(bob==='I') r = r.replace(new RegExp('^'+ALIF+'['+I+U+A+']?'), '');
  }
  if(r && isNunFinal(o.root)) r = idgamNun(r);
  return r ? fixMadda(reseatHamza(r)) : null;
}
function imperative(o, cell){
  const r = imperativeAsl(o, cell);
  return r ? softenAmrHamza(r) : r;
}
function hasPassive(o){
  const bob=o.bob||'I';
  if(bob==='VII'||bob==='IX') return false;
  return true;
}

/* ---------- MASDAR (II–X qoidali; I bob lug'atdan) ----------
   Zaif o'zaklarda vazn o'zgaradi — oddiy qolipni qo'yib bo'lmaydi
   (avval تَأْدِيىٌ ، مُسَاوَىَةٌ ، إِقْوَامٌ kabi xato shakllar chiqardi):
     noqis/lafif   II تَرْبِيَةٌ  III مُسَاوَاةٌ  IV إِعْطَاءٌ  V تَجَلٍّ  VI تَوَارٍ
                   VII اِنْزِوَاءٌ  VIII اِشْتِرَاءٌ  X اِسْتِثْنَاءٌ
     ajvaf         IV إِقَامَةٌ  VII اِنْقِيَادٌ  VIII اِخْتِيَارٌ  X اِسْتِطَاعَةٌ
     misol (و/ي)   IV إِيجَادٌ  X اِسْتِيرَادٌ ;  hamza boshida IV إِيمَانٌ
     oxiri hamza   II تَهْنِئَةٌ ; IV/VII/VIII/X إِنْشَاءٌ
     mudo'af       III مُحَاجَّةٌ  VI تَمَاسٌّ                                */
function masdar(bob, r, custom){
  if(custom) return custom;      // qoidaga bo'ysunmaydiganlar: إِيمَانٌ ، إِرَاءَةٌ
  if(bob==='I') return null;
  const z = masdarZaif(bob, r);
  if(z) return fixMadda(reseatHamza(z));
  const q = masdarQolip(bob, r);
  return q && r.some(isHamza) ? fixMadda(reseatHamza(q)) : q;
}
function masdarZaif(bob, r){
  const [r1,r2,r3]=r;
  const TM='ة';
  // o'zakda illat harfi ا / ى ko'rinishida ham yozilishi mumkin (عطى ، تاح)
  const noqis = isIllat(r3), ajvaf = !noqis && isIllat(r2), misol = r1===WAW || r1===YA;
  const h1 = isHamza(r1), h3 = isHamza(r3), mud = r2===r3;
  // misol va hamza boshida — ulovchi kasradan keyin cho'ziq ī: إِيجَادٌ ، إِيمَانٌ
  const ii = (misol || h1) ? YA : r1+S;
  if(noqis){
    switch(bob){
      case 'II':   return TA+A+r1+S+r2+I+YA+A+TM+Tan;
      case 'III':  return MIM+U+r1+A+ALIF+r2+A+ALIF+TM+Tan;
      case 'IV':   return HA_I+I+ii+r2+A+ALIF+HA+Tan;
      case 'V':    return TA+A+r1+A+r2+W+TanK;
      case 'VI':   return TA+A+r1+A+ALIF+r2+TanK;
      case 'VII':  return ALIF+I+NUN+S+r1+I+r2+A+ALIF+HA+Tan;
      case 'VIII': return ALIF+I+r1+S+TA+I+r2+A+ALIF+HA+Tan;
      case 'X':    return ALIF+I+SIN+S+TA+I+(misol?YA:r1+S)+r2+A+ALIF+HA+Tan;
    }
    return null;
  }
  if(ajvaf){
    switch(bob){
      case 'IV':   return HA_I+I+r1+A+ALIF+r3+A+TM+Tan;
      case 'VII':  return ALIF+I+NUN+S+r1+I+YA+A+ALIF+r3+Tan;
      case 'VIII': return ALIF+I+r1+S+TA+I+YA+A+ALIF+r3+Tan;
      case 'X':    return ALIF+I+SIN+S+TA+I+r1+A+ALIF+r3+A+TM+Tan;
    }
    return null;                // II, III, V, VI — oddiy qolip to'g'ri
  }
  if(h3){
    switch(bob){
      case 'II':   return TA+A+r1+S+r2+I+HA_Y+A+TM+Tan;
      case 'IV':   return HA_I+I+ii+r2+A+ALIF+HA+Tan;
      case 'VII':  return ALIF+I+NUN+S+r1+I+r2+A+ALIF+HA+Tan;
      case 'VIII': return ALIF+I+r1+S+TA+I+r2+A+ALIF+HA+Tan;
      case 'X':    return ALIF+I+SIN+S+TA+I+r1+S+r2+A+ALIF+HA+Tan;
    }
  }
  if(bob==='IV' && (misol || h1)) return HA_I+I+YA+r2+A+ALIF+r3+Tan;
  if(bob==='X' && misol)          return ALIF+I+SIN+S+TA+I+YA+r2+A+ALIF+r3+Tan;
  if(mud && bob==='III')          return MIM+U+r1+A+ALIF+r2+W+A+TM+Tan;
  if(mud && bob==='VI')           return TA+A+r1+A+ALIF+r2+W+Tan;
  return null;
}
function masdarQolip(bob, r){
  const [r1,r2,r3]=r;
  switch(bob){
    case 'II':  return TA+A+r1+S+r2+I+YA+r3+Tan;
    case 'III': return MIM+U+r1+A+ALIF+r2+A+r3+A+'\u0629'+Tan;
    case 'IV':  return HA_I+I+r1+S+r2+A+ALIF+r3+Tan;
    case 'V':   return TA+A+r1+A+r2+W+U+r3+Tan;
    case 'VI':  return TA+A+r1+A+ALIF+r2+U+r3+Tan;
    case 'VII': return ALIF+I+NUN+S+r1+I+r2+A+ALIF+r3+Tan;
    case 'VIII':return ALIF+I+r1+S+TA+I+r2+A+ALIF+r3+Tan;
    case 'IX':  return ALIF+I+r1+S+r2+I+r3+A+ALIF+r3+Tan;   // اِحْمِرَارٌ ، اِسْوِدَادٌ
    case 'X':   return ALIF+I+SIN+S+TA+I+r1+S+r2+A+ALIF+r3+Tan;
  }
}
/* ---------- SIFATDOSH NEGIZI: r3 oldidagi unli aniq beriladi ---------- */
function partStem(bob, r, vw){
  const [r1,r2,r3] = r;
  switch(bob){
    case 'II':   return r1+A + r2+W+vw + r3;
    case 'III':  return r1+A+ALIF + r2+vw + r3;
    case 'IV':   return r1+S + r2+vw + r3;
    case 'V':    return TA+A + r1+A + r2+W+vw + r3;
    case 'VI':   return TA+A + r1+A+ALIF + r2+vw + r3;
    case 'VII':  return NUN+S + r1+A + r2+vw + r3;
    case 'VIII': return r1+S + TA+A + r2+vw + r3;
    case 'IX':   return r1+S + r2+A + r3+W;
    case 'X':    return SIN+S+TA+A + r1+S + r2+vw + r3;
  }
}

/* ---------- SIFATDOSHLAR ----------
   Zaif fe'llarda oxiri o'zgaradi:
     noqis/lafif  →  ism foil مُوَاتٍ ,  ism maf'ul مُوَاتًى
     ajvaf        →  قَائِلٌ / مَقُولٌ ,  مُقِيمٌ / مُقَامٌ
     mudo'af      →  مَادٌّ / مَمْدُودٌ ,  مُحِبٌّ / مُحَبٌّ            */
function participle(bob, r, kind, presV){
  if(bob==='IV' && isRaRoot(r)){
    const out = participleRaw(bob, r, kind, presV);
    return out ? fixMadda(elideRa(out)) : out;
  }
  return participleRaw(bob, r, kind, presV);
}
function participleRaw(bob, r, kind, presV){
  const [r1,r2,r3]=r;
  const t = verbType(r);
  const oxirZaif = ['noqis','lafif-maqrun','lafif-mafruq'].includes(t);
  const aniq = (kind==='aniq');

  /* ===== I BOB ===== */
  if(bob==='I'){
    if(aniq){
      // reseatHamza bu yerda qo'llanmaydi (قَائِلٌ ni قَاءِلٌ qilib yuboradi),
      // lekin o'zak boshi hamza bo'lsa madda kerak: أَائِدٌ → آئِدٌ
      if(t==='ajvaf')  return fixMadda(r1+A+ALIF+HA_Y+I+r3+Tan);                // قَائِلٌ
      if(t==='mudoaf') return fixMadda(r1+A+ALIF+r2+W+Tan);                     // مَادٌّ
      if(oxirZaif)     return fixMadda(reseatHamza(r1+A+ALIF+r2+TanK));          // قَاضٍ ، وَاقٍ
      return fixMadda(reseatHamza(r1+A+ALIF+r2+I+r3+Tan));                       // فَاعِلٌ
    }
    if(t==='ajvaf'){
      const m = ajvafMid(r, presV||'u');
      return fixMadda(reseatHamza(MIM+A+r1+m.v+m.ch+r3+Tan));                    // مَقُولٌ ، مَبِيعٌ
    }
    if(oxirZaif) return fixMadda(reseatHamza(
      r3===WAW ? MIM+A+r1+S+r2+U+WAW+W+Tan : MIM+A+r1+S+r2+I+YA+W+Tan));         // مَدْعُوٌّ ، مَرْمِيٌّ
    return fixMadda(reseatHamza(MIM+A+r1+S+r2+U+WAW+r3+Tan));                    // مَفْعُولٌ
  }

  /* ===== HOSILA BOBLAR ===== */
  if(bob==='VII' && !aniq) return null;
  if(bob==='IX')  return aniq ? MIM+U+r1+S+r2+A+r3+W+Tan : null;

  const vw = aniq ? I : A;

  /* --- ajvaf: IV, VII, VIII, X --- */
  if(t==='ajvaf' && AJVAF_DERIVED.includes(bob)){
    let bosh;
    if(bob==='IV')       bosh = r1;
    else if(bob==='X')   bosh = SIN+S+TA+A+r1;
    else if(bob==='VII') bosh = NUN+S+r1;
    else                 bosh = r1+S+TA;
    const uzun = (aniq && (bob==='IV'||bob==='X')) ? I+YA : A+ALIF;
    return fixMadda(reseatHamza(MIM+U+bosh+uzun+r3+Tan));   // مُقِيمٌ / مُقَامٌ / مُخْتَارٌ
  }

  /* --- mudo'af: IV, VII, VIII, X --- */
  if(t==='mudoaf' && AJVAF_DERIVED.includes(bob)){
    let bosh;
    if(bob==='IV')       bosh = r1;
    else if(bob==='X')   bosh = SIN+S+TA+A+r1;
    else if(bob==='VII') bosh = NUN+S+r1;
    else                 bosh = r1+S+TA;
    const v2 = (bob==='VII'||bob==='VIII') ? A : vw;
    return fixMadda(reseatHamza(MIM+U+bosh+v2+r2+W+Tan));   // مُحِبٌّ / مُحَبٌّ / مُمْتَدٌّ
  }

  /* --- qolganlari: umumiy vazn --- */
  const st = partStem(bob, r, vw);
  if(!st) return null;
  if(oxirZaif){
    const bosh = st.slice(0, st.length-2);                  // vw va r3 ni olib tashlaymiz
    return fixMadda(reseatHamza(MIM+U+bosh+(aniq ? TanK : TanF+MAQ)));  // مُوَاتٍ / مُوَاتًى
  }
  return fixMadda(reseatHamza(MIM+U+st+Tan));
}

/* Test variantlari uchun bir-biriga o'xshash shakllar: o'sha fe'lning
   boshqa mayli (marfu' / mansub / majzum), boshqa shaxsi (يَ / تَ / نَ / أَ),
   nisbati yoki buyrug'i — faqat harakat yoki old harf bilan farq qiladi.
   Masalan يَكْتُبُ uchun: يَكْتُبَ ، تَكْتُبُ ، نَكْتُبْ ، اُكْتُبْ.
   sit: {zamon, mayl, cell, voice}. Natija — to'g'ri javobdan farqli,
   takrorlanmaydigan n ta shakl (avval eng o'xshashlari).              */
const QISQA_CELLS = ['3ms','3fs','2ms','1s','1p'];
function yaqinShakllar(o, sit, n){
  n = n || 3;
  const voice = sit.voice || 'aniq', cell = sit.cell, mayl = sit.mayl || 'aniqlik', zamon = sit.zamon || 'otgan';
  const qil = (z, m, c, v) => { try { return (m==='buyruq' ? imperative(o, c) : conjugate(Object.assign({}, o, {voice: v || voice, zamon: z, mayl: m}), c)) || ''; } catch(e){ return ''; } };
  const asl = qil(zamon, mayl, cell, voice);
  const yaqin = [], uzoq = [], kichik = QISQA_CELLS.includes(cell) ? QISQA_CELLS : [cell];
  const has = hasPassive(o);
  if(mayl==='buyruq'){
    yaqin.push(qil('hozirgi','shart',cell,'aniq'), qil('hozirgi','shart','3ms','aniq'), qil('hozirgi','aniqlik',cell,'aniq'),
               qil('hozirgi','istak',cell,'aniq'), qil('hozirgi','shart','1p','aniq'));
    AMR_CELLS.filter(c => c!==cell).forEach(c => uzoq.push(qil('hozirgi','buyruq',c)));
  } else if(zamon==='otgan'){
    ['3ms','3fs','2ms','1s','1p','3mp','3md'].filter(c => c!==cell).forEach(c => yaqin.push(qil('otgan','aniqlik',c)));
    if(has) yaqin.push(qil('otgan','aniqlik',cell, voice==='aniq' ? 'majhul' : 'aniq'));
    CELLS.forEach(c => uzoq.push(qil('otgan','aniqlik',c.id)));
  } else {
    const M = ['aniqlik','istak','shart'];
    M.filter(m => m!==mayl).forEach(m => yaqin.push(qil('hozirgi', m, cell)));
    kichik.filter(c => c!==cell).forEach(c => M.forEach(m => yaqin.push(qil('hozirgi', m, c))));
    if(voice==='aniq' && kichik.length > 1) yaqin.push(qil('hozirgi','buyruq','2ms'));
    if(has) yaqin.push(qil('hozirgi', mayl, cell, voice==='aniq' ? 'majhul' : 'aniq'));
    CELLS.forEach(c => uzoq.push(qil('hozirgi', mayl, c.id)));
  }
  const bor = new Set([asl]), chiq = [];
  const aralash = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  for(const v of aralash(yaqin).concat(aralash(uzoq))){
    if(chiq.length >= n) break;
    if(v && !bor.has(v)){ bor.add(v); chiq.push(v); }
  }
  return chiq;
}

const E = {conjugate, imperative, imperativeAsl, masdar, participle, verbType, TYPE_NOM,
           hasPassive, CELLS, AMR_CELLS, isIllat, isHamza, yaqinShakllar};
if(typeof module!=='undefined') module.exports = E;

<script>
/* ============================================================
   Ustoz kabineti — /ustoz.html
   Ustoz: o'z guruhlari — reyting, so'rovlarni tasdiqlash, natijalar,
   xato so'zlar, Excel. Hech narsani o'chira olmaydi.
   Admin («admin» login): barcha guruhlar + guruh va ustozlarni
   boshqarish, talabani ko'chirish/chiqarish, natijani o'chirish.
   Server: _worker.js dagi /api/g/… (Cloudflare D1).
   Talabalar kiritgan ism-familiya HTML sifatida emas, matn sifatida
   chiqariladi (esc) — kabinetga zararli kod tushmasin.
   ============================================================ */
const TKEY = 'au_kabinet_v1';
let TOKEN = '', KIM = null, GURUH = null, KURS = null, GTAB = 'reyting', ATAB = 'guruhlar', FILTR = {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const tk = v => { if (!v) return '—'; const d = new Date(Date.parse(v) + 5 * 3600e3).toISOString(); return d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(2, 4) + ' ' + d.slice(11, 16); };
const foizK = p => p >= 80 ? 'y' : p >= 50 ? 'o' : 'p';
try { TOKEN = localStorage.getItem(TKEY) || ''; } catch (e) {}

async function api(yol, tana) {
  const o = { headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {} };
  if (tana !== undefined) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(tana); }
  let d;
  try { d = await (await fetch(yol[0] === '/' ? yol : '/api/g/' + yol, o)).json(); }
  catch (e) { return { ok: false, xato: 'Serverga ulanib bo‘lmadi' }; }
  if (d && d.kirish) { chiqildi(); }
  return d || { ok: false, xato: 'javob yo‘q' };
}
function ekran(id) {
  // o'yin ekranidan chiqilsa — holatni so'rashni to'xtatamiz (jonli.js)
  if (id !== 'eOyin' && typeof JO !== 'undefined' && JO) { clearTimeout(JTIMER); JO = null; }
  document.querySelectorAll('.ekran').forEach(e => e.classList.toggle('faol', e.id === id));
  document.documentElement.classList.toggle('oy-rejim', id === 'eOyin');
  window.scrollTo(0, 0);
  if (id === 'eAsosiy' && KIM) asosiyChiz();
}
function chiqildi() {
  TOKEN = ''; KIM = null; SOROV = [];
  if ($('sorovQ')) $('sorovQ').innerHTML = '';
  try { localStorage.removeItem(TKEY); } catch (e) {}
  $('chiqBtn').style.display = 'none'; $('yangBtn').style.display = 'none';
  ekran('eKirish');
}

/* ---------------- kirish / chiqish ---------------- */
/* «Men ustozman» — admindan login so'rash (admin panelida «Ustozlar» tabida chiqadi) */
async function usSorovOch() {
  const f = $('usSorov'); f.style.display = ''; f.innerHTML = '<div class="bosh-bosh">Yuklanmoqda…</div>';
  let un = [];
  try { un = (await (await fetch('/api/g/guruhlar')).json()).universitetlar || []; } catch (e) {}
  f.innerHTML = `<h3>🙋 Ustozlik so‘rovi</h3><p class="izoh" style="margin:0 0 10px">Admin so‘rovingizni ko‘rib, siz bilan bog‘lanadi va login-parol beradi.</p>
    <div class="maydon"><label>Ism va familiyangiz</label><input id="usIsm" autocomplete="name" placeholder="Masalan: Avazbek Karimov"></div>
    <div class="maydon"><label>Telefon raqamingiz</label><input id="usTel" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67"></div>
    <div class="maydon"><label>Universitetingiz</label><select id="usUniv" onchange="$('usUnivN').style.display=this.value==='__yangi'?'':'none'">
      <option value="">— tanlang —</option>${un.map(u => `<option value="${esc(u.kod)}">${esc(u.nom)}</option>`).join('')}<option value="__yangi">➕ Ro‘yxatda yo‘q — yozaman</option></select>
      <input id="usUnivN" style="display:none;margin-top:8px" placeholder="Universitet nomi"></div>
    <div class="maydon"><label>Qaysi fan / guruhlar (ixtiyoriy)</label><input id="usIzoh" placeholder="Masalan: arab tili, 2-kurs 2418, 2425"></div>
    <button class="asosiy-btn" id="usBtn" onclick="usSorovYubor()">So‘rov yuborish</button><div class="xabar" id="usX"></div>`;
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function usSorovYubor() {
  const v = $('usUniv').value, x = $('usX');
  const d = await api('ustoz-sorov', { ism: $('usIsm').value.trim(), tel: $('usTel').value.trim(), univ: v === '__yangi' ? '' : v,
    univ_nom: v === '__yangi' ? $('usUnivN').value.trim() : '', izoh: $('usIzoh').value.trim() });
  if (!d.ok) { x.className = 'xabar xato'; x.textContent = d.xato || 'Yuborilmadi'; return; }
  $('usSorov').innerHTML = '<h3>✅ So‘rovingiz yuborildi</h3><p class="izoh" style="margin:0">Admin ko‘rib chiqib, siz bilan bog‘lanadi va login-parol beradi.</p>';
}
async function kirish() {
  const login = $('kLogin').value.trim(), parol = $('kParol').value;
  if (!login || !parol) { $('kXabar').textContent = 'Login va parolni yozing'; return; }
  $('kBtn').disabled = true; $('kXabar').textContent = '';
  const d = await api('kirish', { login, parol });
  $('kBtn').disabled = false;
  if (!d.ok) { $('kXabar').textContent = d.yoqilgan === false ? 'Baza (D1) hali ulanmagan — admin sozlashi kerak.' : (d.xato || 'Kirib bo‘lmadi'); return; }
  TOKEN = d.token;
  try { localStorage.setItem(TKEY, TOKEN); } catch (e) {}
  $('kParol').value = '';
  boshla();
}
// parol maydonidagi ko'z: yozilganini ko'rsatadi / yashiradi
function parolKoz(b) {
  const i = b.parentNode.querySelector('input'), ochiq = i.type === 'password';
  i.type = ochiq ? 'text' : 'password';
  b.classList.toggle('ochiq', ochiq);
  b.setAttribute('aria-label', ochiq ? 'Parolni yashirish' : 'Parolni ko‘rsatish'); b.title = b.getAttribute('aria-label');
  i.focus();
}
async function chiqish() { await api('chiqish', {}); chiqildi(); }
['kLogin', 'kParol'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') kirish(); }));

async function boshla() {
  if (!TOKEN) return ekran('eKirish');
  const d = await api('kabinet?tashrif=1');               // ustoz kirgani «tashrif» botiga (serverda, admin emas)
  if (!d.ok) { if (!d.kirish) { $('kXabar').textContent = d.xato || ''; } return chiqildi(); }
  KIM = d;
  $('chiqBtn').style.display = ''; $('yangBtn').style.display = '';
  ekran('eAsosiy');
}
/* ---------------- 🔄 Yangilash: ochiq turgan ekranni serverdan qayta oladi ---------------- */
let YANG_BAND = false;
async function kabYangila() {
  if (YANG_BAND || !TOKEN) return;
  YANG_BAND = true;
  const b = $('yangBtn'); b.classList.remove('tayyor'); b.classList.add('ayl');
  try {
    const faol = (document.querySelector('.ekran.faol') || {}).id;
    await yangilaKabinet();
    if (faol === 'eGuruh' && GURUH) await guruhYangila();
    else if (faol === 'eGuruh' && KURS) await kursOch(KURS.k, KURS.univ);
    else if (faol === 'eGuruh' && LIGA) await ligaOch(LIGA.k, LIGA.univ);
    else if (faol === 'eAsosiy') asosiyChiz();
  } finally {
    YANG_BAND = false; b.classList.remove('ayl'); b.classList.add('tayyor');
    setTimeout(() => b.classList.remove('tayyor'), 1200);
  }
}

/* ---------------- guruhga qo'shilish so'rovlari (bosh ekran tepasida) ---------------- */
let SOROV = [];
async function sorovYukla() {
  const d = await api('sorovlar');
  if (d.ok) { SOROV = d.sorovlar; sorovChizBosh(); }
}
function sorovChizBosh() {
  const el = $('sorovQ'); if (!el) return;
  if (!SOROV.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="sorov-q"><div class="sar"><h3>Guruhga qo‘shilish so‘rovlari<span class="son">${SOROV.length}</span></h3>
      ${SOROV.length > 1 ? `<button class="ha-hammasi" onclick="hammasiTasdiq()">✓ Hammasini tasdiqlash</button>` : ''}</div>
    <div class="ichi">${SOROV.map(x => `<div class="sr">
      <div class="kim"><div class="ism">${esc(x.ism)} ${esc(x.familiya)}</div><div class="tel">${esc(x.tel)} · ${tk(x.sorov_vaqt)}</div></div>
      <div class="gr-nom">${esc(x.guruh)}<small>${esc([univQisqa(x.univ), x.kurs ? x.kurs + '-kurs' : ''].filter(Boolean).join(' · '))}</small></div>
      <div class="amal"><button class="ha" onclick="tasdiqBosh('${esc(x.tel)}','tasdiqlangan')">✓ Tasdiqlash</button>
        <button class="yoq" onclick="tasdiqBosh('${esc(x.tel)}','rad')">✕ Rad etish</button></div></div>`).join('')}</div></div>`;
}
async function tasdiqBosh(tel, holat) {
  const d = await api('tasdiq', { tel, holat });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  await yangilaKabinet(); asosiyChiz();
}
async function hammasiTasdiq() {
  if (!confirm(SOROV.length + ' ta so‘rovning hammasi tasdiqlansinmi?')) return;
  const d = await api('tasdiq-hammasi', { tellar: SOROV.map(x => x.tel) });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  await yangilaKabinet(); asosiyChiz();
}

/* ---------------- asosiy ekran ---------------- */
function asosiyChiz() {
  sorovChizBosh(); sorovYukla();
  const admin = KIM.rol === 'admin', sardor = KIM.rol === 'sardor';
  $('salom').textContent = admin ? 'Admin paneli' : KIM.nom;
  $('rolIzoh').textContent = admin ? 'barcha guruhlar · boshqaruv' : sardor ? '⭐ sardor · battle, jonli test, guruhga e’lon' : 'ustoz · ' + KIM.guruhlar.length + ' ta guruh';
  const tablar = sardor ? [['guruhlar', 'Guruhim'], ['jonli', '🎮 Jonli test'], ['battle', '⚔️ Battle']]
    : [['guruhlar', 'Guruhlar'], ['jonli', '🎮 Jonli test'], ['battle', '⚔️ Battle'], ['chat', '💬 Chat']].concat(admin ? [['ustozlar', 'Ustozlar' + kutNishon('ustoz')], ['sardorlar', '⭐ Sardorlar'], ['sozlar', '📝 So‘z takliflari' + kutNishon('soz')], ['boshqaruv', 'Guruhlarni boshqarish' + kutNishon('univ')]] : []);
  if (!tablar.some(t => t[0] === ATAB)) ATAB = 'guruhlar';
  $('asosiyTab').innerHTML = tablar.map(([k, n]) => `<button class="tab${ATAB === k ? ' on' : ''}" onclick="ATAB='${k}';asosiyChiz()">${n}</button>`).join('');
  const el = $('asosiyIchi');
  $('sorovQ').style.display = ATAB === 'jonli' || ATAB === 'chat' || ATAB === 'battle' || sardor ? 'none' : '';
  if (ATAB !== 'chat') clearTimeout(CHAT_T);
  if (ATAB === 'jonli') jonliChiz(el);
  else if (ATAB === 'battle') battleChiz(el);
  else if (ATAB === 'chat') chatChiz(el);
  else if (ATAB === 'guruhlar' || !admin) {
    const g = KIM.guruhlar;
    el.innerHTML = !g.length
      ? `<div class="bosh-bosh">${admin ? 'Hali guruh yo‘q. «Guruhlarni boshqarish» bo‘limida yarating.' : 'Sizga hali guruh biriktirilmagan. Admin bilan bog‘laning.'}</div>`
      : univlar(g).map(([u, ug], _, hamma) => (hamma.length > 1 ? `<div class="univ-bosh"><h2>🎓 ${esc(univNom(u))}</h2>
          <span class="izoh">${ug.length} ta guruh · ${ug.reduce((s, x) => s + x.azolar, 0)} ta talaba</span></div>` : '') +
        kurslar(ug).map(([k, gs]) => `<div class="kurs-bosh"><h3>${kursNom(k)}</h3>
          <span class="izoh">${gs.length} ta guruh · ${gs.reduce((s, x) => s + x.azolar, 0)} ta talaba</span>
          ${k ? `<button class="kichik-btn" onclick="kursOch(${k},'${esc(u)}')">🏆 Kurs reytingi</button><button class="kichik-btn" onclick="ligaOch(${k},'${esc(u)}')">📅 Haftalik liga</button>` : ''}</div>
        <div class="gr-grid">${gs.map(x => `<button class="gr" onclick="guruhOch(${x.id})">
          <div class="ik">👥</div><b>${esc(x.nom)}</b><span>${x.azolar} ta talaba</span>
          ${x.kutilmoqda ? `<span class="kut">${x.kutilmoqda} ta so‘rov tasdiq kutmoqda</span>` : ''}</button>`).join('')}</div>`).join('')).join('');
  } else if (ATAB === 'ustozlar') ustozlarChiz(el);
  else if (ATAB === 'sardorlar') sardorlarChiz(el);
  else if (ATAB === 'sozlar') sozlarChiz(el);
  else boshqaruvChiz(el);
}
/* ---------------- admin: foydalanuvchilar taklif qilgan so'zlar ----------------
   Talaba «Mening lug'atim»dan so'z taklif qiladi → shu yerga keladi. Qabul qilinsa —
   tanlangan qismga, umumiy lug'atga qo'shiladi (hammaga darrov ko'rinadi).        */
let SOZ_TARIX = false;
function sozlarChiz(el) {
  el.innerHTML = `<div class="karta"><h3>📝 So‘z takliflari</h3>
    <p class="izoh" style="margin:0 0 10px">Foydalanuvchilar umumiy lug‘atga taklif qilgan so‘zlar. Arabchasi va tarjimasini to‘g‘rilab, qismni tanlang va «✓ Qabul» bosing — so‘z o‘sha qism lug‘atiga qo‘shiladi va hammaga chiqadi.</p>
    <div class="jqator" style="margin-bottom:10px"><button class="jt${SOZ_TARIX ? '' : ' on'}" onclick="SOZ_TARIX=false;asosiyChiz()">Kutilayotganlar</button><button class="jt${SOZ_TARIX ? ' on' : ''}" onclick="SOZ_TARIX=true;asosiyChiz()">Hammasi (tarix)</button></div>
    <div id="sozTak"><div class="bosh-bosh">Yuklanmoqda…</div></div></div>`;
  sozTakYukla();
}
async function sozTakYukla() {
  const d = await api('soz-takliflar' + (SOZ_TARIX ? '?hammasi=1' : '')), el = $('sozTak');
  if (!el) return;
  if (!d.ok) { el.innerHTML = `<div class="xabar xato">${esc(d.xato || 'Yuklab bo‘lmadi')}</div>`; return; }
  const r = d.takliflar || [];
  if (!r.length) { el.innerHTML = `<div class="bosh-bosh" style="padding:16px">${SOZ_TARIX ? 'Hali taklif bo‘lmagan' : 'Kutilayotgan taklif yo‘q'}</div>`; return; }
  const qismlar = sel => '<option value="">— qismni tanlang —</option>' + VOCAB.map(q => `<option value="${q.qism}" ${Number(sel) === q.qism ? 'selected' : ''}>${esc(/qism$/.test(q.nom) ? q.qism + '-qism' : q.nom)}</option>`).join('');
  const bormi = ar => { const n = sozNorm(ar); for (const q of VOCAB) for (const w of q.sozlar) if (sozNorm(w.ar) === n) return w.uz + ' (' + (/qism$/.test(q.nom) ? q.qism + '-qism' : q.nom) + ')'; return ''; };
  el.innerHTML = r.map(x => {
    const kim = `<small>👤 ${esc(x.ism || '—')} · <a href="tel:${esc(x.tel)}">${esc(x.tel)}</a> · ${tk(x.vaqt)}</small>${x.izoh ? `<small>💬 ${esc(x.izoh)}</small>` : ''}`;
    if (x.holat !== 'kutilmoqda') return `<div class="sz-q hal"><div class="sz-s"><span class="sz-ar">${esc(x.ar)}</span> — ${esc(x.uz)}${x.kop ? ` <span class="sz-kop">ج ${esc(x.kop)}</span>` : ''}</div>${kim}
      <small><b style="color:var(--${x.holat === 'qabul' ? 'green' : 'red'})">${x.holat === 'qabul' ? '✓ Qabul qilingan' + (x.qism ? ' · ' + x.qism + '-qism' : '') : '✕ Rad etilgan'}</b>${x.javob ? ' · ' + esc(x.javob) : ''}</small></div>`;
    const b = bormi(x.ar);
    return `<div class="sz-q" data-id="${x.id}">
      <div class="sz-f"><input class="sz-ar-i" dir="rtl" lang="ar" value="${esc(x.ar)}" title="Arabchasi"><input class="sz-uz-i" value="${esc(x.uz)}" title="Tarjimasi"></div>
      <div class="sz-f"><input class="sz-kop-i sz-ar-i" dir="rtl" lang="ar" value="${esc(x.kop || '')}" placeholder="ko‘pligi (ixtiyoriy)" title="Ko‘pligi"><select class="sz-qism-i">${qismlar(x.qism)}</select></div>
      ${kim}${b ? `<small style="color:var(--amber);font-weight:700">⚠️ Bu so‘z lug‘atda bor: ${esc(b)}</small>` : ''}
      <div class="sz-t"><button class="kichik-btn sz-ok" onclick="sozHal(${x.id},'qabul',this)">✓ Qabul — lug‘atga qo‘shish</button><button class="kichik-btn" style="color:var(--red)" onclick="sozHal(${x.id},'rad',this)">Rad etish</button></div></div>`;
  }).join('');
}
// harakatsiz solishtirish (lug'atda bormi)
const sozNorm = t => String(t || '').replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[\u0622\u0623\u0625\u0671]/g, '\u0627').replace(/\s+/g, '');
async function sozHal(id, amal, b) {
  const q = b.closest('.sz-q'), v = c => q.querySelector(c).value.trim();
  const tana = { id, amal };
  if (amal === 'qabul') {
    Object.assign(tana, { ar: v('.sz-ar-i'), uz: v('.sz-uz-i'), kop: v('.sz-kop-i'), qism: Number(v('.sz-qism-i')) || 0 });
    if (!tana.ar || !tana.uz) { alert('Arabchasi va tarjimasi bo‘sh bo‘lmasin'); return; }
    if (!tana.qism) { alert('Qaysi qismga qo‘shilishini tanlang'); q.querySelector('.sz-qism-i').focus(); return; }
  } else {
    const s = prompt('Rad etish sababi (ixtiyoriy — foydalanuvchiga ko‘rinadi):', '');
    if (s === null) return;
    tana.javob = s.trim();
  }
  b.disabled = true;
  const d = await api('soz-taklif-hal', tana);
  if (!d.ok) { b.disabled = false; alert(d.xato || 'Bo‘lmadi'); return; }
  await yangilaKabinet(); asosiyChiz();
}

// universitetlar (server beradi: kabinet javobida). jtu — asosiy, nomi qisqartirilmaydi
const UNIV = () => (KIM && KIM.universitetlar) || [{ kod: 'jtu', nom: 'Jahon tillari universiteti', qisqa: 'JTU', qatiy: true }];
const univNom = kod => (UNIV().find(u => u.kod === kod) || { nom: kod }).nom;
const univQisqa = kod => !kod || kod === 'jtu' ? '' : (UNIV().find(u => u.kod === kod) || { qisqa: kod }).qisqa;
const guruhTol = g => [univQisqa(g.univ), g.kurs ? g.kurs + '-kurs' : '', g.nom].filter(Boolean).join(' · ');
// guruhlarni universitetlarga ajratish (ro'yxatdagi tartibda): [['jtu',[…]], ['oriental',[…]]]
function univlar(g) {
  const m = new Map();
  g.forEach(x => { const u = x.univ || 'jtu'; if (!m.has(u)) m.set(u, []); m.get(u).push(x); });
  const t = UNIV().map(u => u.kod);
  return [...m.entries()].sort((a, b) => (t.indexOf(a[0]) + 1 || 99) - (t.indexOf(b[0]) + 1 || 99));
}
// guruhlarni kurslarga ajratish: [[1,[…]],[2,[…]],…,[0,[…]]] — kurssizlar oxirida
const kursNom = k => k ? k + '-kurs' : 'Kurs belgilanmagan';
function kurslar(g) {
  const m = new Map();
  g.forEach(x => { const k = x.kurs || 0; if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return [...m.entries()].sort((a, b) => (a[0] || 99) - (b[0] || 99));
}

async function guruhYangila() { const d = await api('guruh?id=' + GURUH.guruh.id); if (d.ok) GURUH = d; guruhChiz(); }
function guruhChiz() {
  const g = GURUH;
  $('gNom').textContent = g.guruh.nom + (g.guruh.kurs ? ' · ' + g.guruh.kurs + '-kurs' : '') + (univQisqa(g.guruh.univ) ? ' · ' + univQisqa(g.guruh.univ) : '');

                  [['natijalar', 'Natijalar'], ['xatolar', 'Xato so‘zlar'], ['elon', '📢 E’lon']]);

// sardorga beriladigan kirish ma'lumoti (kod faqat shu payt ko'rinadi)
function sardorKodHtml(kod, guruhNomi, yop) {
  return `<div class="sardor-kod"><b>⭐ ${esc(kod.ism)} endi ${esc(guruhNomi)}-guruh sardori.</b>
      <span>Unga shuni bering — sardor kabinetga shu bilan kiradi (kod faqat hozir ko‘rinadi):</span>
      <div class="sk-q"><span>Sahifa: <b>${esc(location.host)}/ustoz.html</b></span><span>Login: <b>${esc(kod.tel)}</b></span><span>Parol: <b class="sk-kod">${esc(kod.kod)}</b></span></div>
      <div class="amal"><button class="kichik-btn" onclick="sardorKodNusxa(this)">📋 Nusxalash</button><button class="kichik-btn" onclick="SARDOR_KOD=null;${yop}">Yopish</button></div></div>`;
}
function sardorKodNusxa(b) {
  const k = SARDOR_KOD; if (!k) return;
  const m = `${k.ism} — ${k.guruh}-guruh sardori\nSahifa: ${location.origin}/ustoz.html\nLogin: ${k.tel}\nParol: ${k.kod}`;
  const ok = () => { b.textContent = '✓ Nusxalandi'; };
  if (navigator.clipboard) navigator.clipboard.writeText(m).then(ok, () => prompt('Nusxalang:', m)); else prompt('Nusxalang:', m);
}
// gid, eski — guruh va uning hozirgi sardori; keyin — qaysi ekranni yangilash
async function sardorTayin(gid, guruhNomi, tel, eski, keyin) {
  if (!tel) { alert('Talabani tanlang'); return; }
  if (eski && eski !== tel && !confirm('Guruhning sardori almashtirilsinmi? Eski sardorning kodi ishlamay qoladi.')) return;
  if (eski === tel && !confirm('Yangi kod berilsinmi? Eski kod ishlamay qoladi.')) return;
  const d = await api('sardor', { guruh_id: gid, tel });
  if (!d.ok) { alert(d.xato || 'Bo‘lmadi'); return; }
  SARDOR_KOD = { gid, guruh: guruhNomi, tel: d.tel, kod: d.kod, ism: d.ism };
  keyin();
}
async function sardorOlib(gid, keyin) {
  if (!confirm('Sardorlikdan olinsinmi? U endi kabinetga kira olmaydi.')) return;
  const d = await api('sardor', { guruh_id: gid, tel: null });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  if (SARDOR_KOD && SARDOR_KOD.gid === gid) SARDOR_KOD = null;
  keyin();
}
const sardorQil = tel => sardorTayin(GURUH.guruh.id, GURUH.guruh.nom, tel, GURUH.guruh.sardor, guruhYangila);
const sardorOl = () => sardorOlib(GURUH.guruh.id, guruhYangila);

function srTayin(gid, yangiKod) {

/* Bir yo'la bir nechta guruh: har qator — bitta guruh (vergul, nuqta-vergul
   ham ajratadi). Faqat raqamlar bo'lsa («2418-2425 2419»), chiziqcha va
   bo'sh joy ham ajratadi — «1-guruh» kabi nomlar esa buzilmaydi. */
function guruhNomlari(matn) {
  const t = String(matn || '').trim();
  if (!t) return [];
  if (/^[\d\s,;\-–—]+$/.test(t)) return [...new Set(t.split(/[\s,;\-–—]+/).filter(Boolean))];
  return [...new Set(t.split(/[\n,;]+/).map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean))];
}
async function kopla(kurs, nomlar, univ) {
  const d = await api('guruh-kopla', { kurs, nomlar, univ: univ || 'jtu' });
  if (!d.ok) return { xato: d.xato || 'Bo‘lmadi' };
  await yangilaKabinet(); asosiyChiz();
  return { matn: [d.yangi.length ? '✓ ' + d.yangi.length + ' ta guruh yaratildi' : '',
    d.kochdi.length ? d.kochdi.length + ' ta guruhning kursi o‘zgardi (' + d.kochdi.join(', ') + ')' : '',
    d.oldinBor.length ? 'oldin bor edi: ' + d.oldinBor.join(', ') : ''].filter(Boolean).join('. ') };
}
const xabar = (id, r) => { const x = $(id); if (x) { x.className = 'xabar ' + (r.xato ? 'xato' : 'ok'); x.textContent = r.xato || r.matn; } };
async function guruhSaqla(id, nom) {
  if (id) {
    const d = await api('guruh-saqla', { id, nom });
    if (!d.ok) { alert(d.xato || 'Bo‘lmadi'); return; }
    await yangilaKabinet(); asosiyChiz(); return;
  }
  const nomlar = guruhNomlari($('yangiGuruh').value), kurs = Number($('yangiKurs').value), univ = $('yangiUniv').value;
  if (!nomlar.length) return xabar('gXabar', { xato: 'Guruh nomini yozing' });
  if (nomlar.length > 1 && !confirm(univNom(univ) + ', ' + kursNom(kurs) + ': ' + nomlar.length + ' ta guruh yaratilsinmi?\n\n' + nomlar.join(', '))) return;
  xabar('gXabar', { matn: 'Saqlanmoqda…' });
  xabar('gXabar', await kopla(kurs, nomlar, univ));
}
async function tayyorQosh() {
  const t = tayyorQolgan(), natija = [];
  for (const [k, n] of t) { const r = await kopla(k, n, 'jtu'); natija.push(r.xato ? kursNom(k) + ': ' + r.xato : kursNom(k) + ': ' + r.matn); }
  const x = $('gXabar'); if (x) { x.className = 'xabar ok'; x.textContent = natija.join(' · '); }
}
async function guruhKurs(id, kurs) {
  const g = KIM.guruhlar.find(x => x.id === id); if (!g) return;
  const d = await api('guruh-saqla', { id, nom: g.nom, kurs: Number(kurs) });
  if (!d.ok) alert(d.xato || 'Bo‘lmadi');
  await yangilaKabinet(); asosiyChiz();
}
function guruhNom(id) {
  const g = KIM.guruhlar.find(x => x.id === id);
  const nom = prompt('Guruhning yangi nomi:', g ? g.nom : '');
  if (nom && nom.trim()) guruhSaqla(id, nom.trim());
}
async function guruhOchir(id) {
  const g = KIM.guruhlar.find(x => x.id === id);
  if (!confirm('«' + (g ? g.nom : '') + '» guruhi o‘chirilsinmi?\n\nTalabalar guruhsiz qoladi (natijalari o‘chmaydi).')) return;
  await api('guruh-ochir', { id }); await yangilaKabinet(); asosiyChiz();
}
